  <link rel="stylesheet" href="css/tokens.css">
  <style>
    :root {
      --bg-body: #f8fafc;
      --eso-bg: #eff6ff;
      --batx-bg: #f1f5f9;
      --math-title: #3486e4;
      --panel-w: 384px;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; }

    html { overflow: hidden; }
    /* [FIX A2] Augmentat de 600px a 850px per cobrir tauletes landscape i Chromebooks */
    @media (max-height: 850px) { html { overflow: auto; } }
    body {
      margin: 0;
      background: var(--bg-body);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      padding: 10px;
      padding-bottom: 75px;
      min-height: 100vh; min-height: 100dvh; /* [FIX BUG4] */
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .title-container { text-align: center; margin-bottom: 20px; }
    .title-row-1 { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 36px; font-weight: 800; color: #0f172a; margin: 0; }
    .title-row-2 { font-size: 24px; font-weight: 400; color: var(--math-title); margin-top: -15px; }
    .inline-icon { height: 82px; opacity: 0; animation: icon-slide-brake 0.9s cubic-bezier(0.1, 1.0, 0.2, 1.0) 0.1s forwards; }
    .text-step { opacity: 0; animation: fade-in 0.43s ease-out 0.6s forwards; }
    .title-row-2, #mobile-nav-container { opacity: 0; animation: fade-in 0.24s ease-out 1.50s forwards; }

    @keyframes icon-slide-brake { from { transform: translateX(-90px) scale(0.8); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .main-wrapper { display: flex; gap: 30px; justify-content: center; width: 100%; max-width: 1000px; align-items: stretch; }
    .quiz-panel { width: var(--panel-w); max-width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .sub-panel { padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-heavy); display: flex; flex-direction: column; }
    #panel-eso  { opacity: 0; animation: fade-in 0.24s ease-out 1.50s forwards; }
    #panel-batx { opacity: 0; animation: fade-in 0.24s ease-out 1.80s forwards; }
    #panel-eso  .sub-panel { background-color: var(--eso-bg); }
    #panel-batx .sub-panel { background-color: var(--batx-bg); }

    h2 { margin: 0 0 10px 5px; font-size: 22px; font-weight: 800; }

    .row { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 10px; padding: 4px 8px; }
    .row label { font-size: 14px; font-weight: 600; text-align: left; }

    /* Selects natius (sessions, preguntes, errors, criteri) — sense canvis */
    select {
      appearance: none; background-color: #ffffff; height: 32px; padding: 0 10px;
      font-size: 14px; border: 1px solid var(--border-heavy); border-radius: 6px;
      cursor: pointer; text-align: center; width: 100%; transition: background-color 0.2s;
    }
    select:hover { background-color: #cbd5e1; }

    /* ── CUSTOM DROPDOWN (Tailwind UI) ── */
    .cd-wrap { position: relative; width: 100%; font-size: 14px; user-select: none; }

    .cd-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      height: 32px; padding: 0 10px; background: #fff;
      border: 1px solid var(--border-heavy); border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-main);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .cd-trigger:hover { border-color: #94a3b8; background: #e2e8f0; }
    .cd-wrap.open .cd-trigger { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); background: #fff; }

    .cd-chevron {
      flex-shrink: 0; width: 15px; height: 15px; color: var(--text-muted);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .cd-wrap.open .cd-chevron { transform: rotate(180deg); }

    .cd-list {
      position: absolute; top: calc(100% + 5px); left: 0; right: 0;
      background: #fff; border: 1px solid var(--border-heavy); border-radius: 10px;
      box-shadow: 0 8px 30px -4px rgba(15,23,42,0.12), 0 2px 8px -2px rgba(15,23,42,0.08);
      z-index: 999; overflow-y: auto; max-height: 260px; padding: 4px;
      transform-origin: top center;
      transform: scaleY(0.92) translateY(-4px); opacity: 0; pointer-events: none;
      transition: transform 0.18s cubic-bezier(0.4,0,0.2,1), opacity 0.18s cubic-bezier(0.4,0,0.2,1);
    }
    .cd-wrap.open .cd-list { transform: scaleY(1) translateY(0); opacity: 1; pointer-events: auto; }

    .cd-option {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 6px; cursor: pointer;
      font-size: 14px; color: var(--text-main); transition: background 0.1s;
    }
    .cd-option:hover, .cd-option.active { background: #eff6ff; }
    .cd-option.active { box-shadow: inset 0 0 0 2px var(--accent); }
    .cd-trigger:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .cd-option.selected { font-weight: 600; color: var(--accent); background: #eff6ff; }
    .cd-check { width: 13px; height: 13px; flex-shrink: 0; color: var(--accent); opacity: 0; }
    .cd-option.selected .cd-check { opacity: 1; }
    .cd-separator { height: 1px; background: #94a3b8; margin: 4px 6px; }

    /* Link block */
    .link-block { margin-top: 8px; padding-inline: 5px; }
    .panel-spacer { display: none; }

    @media (max-width: 1050px) {
      .panel-spacer { display: block; flex: 1; max-height: 40px; }
    }
    .link-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; margin-bottom: 4px; display: block; }
    .link-output { width: 100%; min-height: 45px; height: 45px; font-family: monospace; font-size: 11px; padding: 8px; border-radius: 6px; border: 1px solid var(--border-heavy); background: #e2e8f0; word-break: break-all; user-select: all; -webkit-user-select: all; cursor: text; line-height: 1.3; display: flex; align-items: center; }

    .btn-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    .copy-btn, .open-btn, .help-btn { height: 38px; cursor: pointer; border-radius: 6px; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; border: none; gap: 6px; transition: all 0.2s ease; }
    .copy-btn { flex: 0.8; background: #ffffff; color: var(--text-main); border: 1px solid var(--border-heavy); }
    .help-btn { flex: 0.9; background: #ffffff; color: var(--text-main); border: 1px solid var(--border-heavy); }
    .open-btn { flex: 1.25; background: var(--accent); color: white; }
    .copy-btn:hover, .help-btn:hover { background-color: #cbd5e1; border-color: #94a3b8; }
    .open-btn:hover { background: #1d4ed8; }

    .yt-icon { height: 16px; width: auto; }
    .copy-status { font-size: 13px; color: #059669; margin-top: 0px; min-height: 0px; font-weight: 700; text-align: center; }

    /* Mòbil */
    .mobile-nav { display: none; margin-bottom: 20px; padding: 5px; background: #e2e8f0; border-radius: 12px; width: 100%; max-width: var(--panel-w); }
    .mobile-nav input { display: none; }
    .mobile-nav label { flex: 1; text-align: center; padding: 10px 0; font-weight: 700; cursor: pointer; border-radius: 8px; color: var(--text-muted); }
    .mobile-nav label:hover { background-color: #cbd5e1; }
    .mobile-nav input:checked + label { background: #ffffff; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    @media (max-width: 1050px) {
      html { overflow: auto; }
      body { justify-content: flex-start; padding-top: 15px; min-height: 100dvh; }
      .main-wrapper { flex-direction: column; align-items: center; flex: 0 0 auto; align-self: center; width: 100%; }
      .mobile-nav { display: flex; }
      .quiz-panel { display: none; }
      .quiz-panel.active { display: flex; flex: 0 0 auto; animation: fade-in 0.3s ease-out forwards; animation-delay: 0s !important; justify-content: flex-start; }
    }

    @media (max-width: 480px) {
      body { padding-bottom: 100px; padding-top: 10px !important; }
      .bottom-icon { bottom: 88px !important; }
      .copy-btn, .open-btn, .help-btn { font-size: 12px; }
      .title-container { margin-bottom: 10px; }
      .inline-icon { height: 60px; }
      .title-row-1 { font-size: 28px; }
      .title-row-2 { font-size: 18px; margin-top: -10px; }
    }

    .select-atencio-shake { animation: select-shake-wave 1.2s ease-in-out; }
    @keyframes select-shake-wave {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); background-color: #fef08a; }
      20%, 40%, 60%, 80% { transform: translateX(4px); background-color: #ffedd5; }
    }

    .help-btn { display: none; }

    /* ── Botó «Activar la resolució pas a pas» ──
       Desactivat (per defecte): tot com sempre. Activat: els menús només ofereixen les
       activitats amb resolució pas a pas animada (pissarra: true) i l'enllaç porta ?pissarra=1. */
    .pissarra-toggle {
      display: flex; align-items: center; gap: 8px;
      margin: 0 auto 16px; height: 38px; padding: 0 18px;
      border-radius: 999px; border: 1px solid var(--border-heavy);
      background: #ffffff; color: var(--text-main);
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      opacity: 0; animation: fade-in 0.24s ease-out 1.50s forwards;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }
    .pissarra-toggle:hover { background-color: #cbd5e1; border-color: #94a3b8; }
    .pissarra-toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .pissarra-toggle[aria-pressed="true"]:hover { background: #1d4ed8; }
    .pissarra-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .pissarra-toggle svg { width: 18px; height: 18px; flex-shrink: 0; }
    .pissarra-toggle[hidden] { display: none; }
    .cd-wrap.buit .cd-label { color: var(--text-muted); font-style: italic; }
    .copy-btn:disabled, .open-btn:disabled { opacity: 0.45; cursor: default; pointer-events: none; }

    /* Amb la resolució pas a pas activada (body.resolucio-pas-a-pas):
       1. tots els blaus passen a ser els lila equivalents (els de prioritat.html: #7c3aed, #6d28d9…);
       2. les opcions de configuració desapareixen: l'enllaç és només «activitat?pissarra=1». */
    .sub-panel, .title-row-2 { transition: background-color 0.3s, color 0.3s; }
    body.resolucio-pas-a-pas {
      --bg-body: #faf9fd;
      --eso-bg: #f5f3ff;
      --batx-bg: #f3f1f9;
      --math-title: #8b5cf6;
      --accent: #7c3aed;
    }
    body.resolucio-pas-a-pas .cd-wrap.open .cd-trigger { box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    body.resolucio-pas-a-pas .cd-option:hover,
    body.resolucio-pas-a-pas .cd-option.active,
    body.resolucio-pas-a-pas .cd-option.selected { background: #f5f3ff; }
    body.resolucio-pas-a-pas .open-btn:hover,
    body.resolucio-pas-a-pas .pissarra-toggle[aria-pressed="true"]:hover { background: #6d28d9; }
    body.resolucio-pas-a-pas .inline-icon { filter: hue-rotate(48deg); }   /* la sabatilla blava, lila */
    /* Els grisos blavosos (vores, fons de l'enllaç, estats «hover»), en gris lila */
    body.resolucio-pas-a-pas .sub-panel,
    body.resolucio-pas-a-pas .cd-trigger,
    body.resolucio-pas-a-pas .cd-list,
    body.resolucio-pas-a-pas .link-output,
    body.resolucio-pas-a-pas .copy-btn { border-color: #d6cdee; }
    body.resolucio-pas-a-pas .link-output { background: #ece8f6; }
    body.resolucio-pas-a-pas .cd-trigger:hover { background: #ede9fe; border-color: #c4b5fd; }
    body.resolucio-pas-a-pas .copy-btn:hover { background-color: #ddd6fe; border-color: #a78bfa; }
    body.resolucio-pas-a-pas .sub-panel-params .row,
    body.resolucio-pas-a-pas #row-fixed-batx { display: none !important; }

    /* ── Animació derrapada sabatilla ── */
    .icon-wrap {
      position: relative;
      display: inline-flex;
      align-items: flex-end;
    }

    /* Línies de derrapada: apareixen mentre frena, es dissolen */
    .icon-wrap::before {
      content: '';
      position: absolute;
      bottom: 11px;
      left: 4px;
      width: 32px;
      height: 6px;
      opacity: 0;
      background:
        linear-gradient(to right, #b8c4d0, #b8c4d0) left top    / 26px 2px no-repeat,
        linear-gradient(to right, #cbd5e1, #cbd5e1) left bottom / 32px 2px no-repeat;
      border-radius: 1px;
      animation: skid 0.55s cubic-bezier(0.15, 0, 0.6, 1) 0.20s forwards;
    }

    /* Núvol de pols: apareix just quan s'atura i es dissipa */
    .icon-wrap::after {
      content: '';
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0;
      box-shadow:
        -10px  0px 5px 4px rgba(148,163,184,0.35),
        -18px -3px 4px 3px rgba(148,163,184,0.20),
         -6px -6px 3px 2px rgba(148,163,184,0.15);
      animation: dust 0.9s ease-out 0.48s forwards;
    }

    @keyframes skid {
      0%   { clip-path: inset(0 100% 0 0); opacity: 0; }
      25%  { clip-path: inset(0 10%  0 0); opacity: 0.75; }
      100% { clip-path: inset(0 0%   0 0); opacity: 0; }
    }

    @keyframes dust {
      0%   { opacity: 0;   transform: scale(0.4) translateX(0); }
      15%  { opacity: 0.9; }
      100% { opacity: 0;   transform: scale(2.0) translateX(-10px); }
    }

    /* Petjada: enllaç a l'app, cantonada superior esquerra */
    .petjada-link { position: fixed; top: 10px; left: 12px; z-index: 102; display: block; line-height: 0; opacity: 0.85; transition: opacity 0.2s; }
    .petjada-link img { height: 56px; width: auto; display: block; transform-origin: 50% 80%; }
    .petjada-link:hover, .petjada-link:focus-visible { opacity: 1; }
    .petjada-link:hover img, .petjada-link:focus-visible img { animation: petjada-blink-shake 1.5s ease-in-out; }
    @keyframes petjada-blink-shake {
      0%   { transform: translateX(0) rotate(0);        opacity: 1; }
      10%  { transform: translateX(-4px) rotate(-6deg); opacity: 0.2; }
      20%  { transform: translateX(4px) rotate(6deg);   opacity: 1; }
      30%  { transform: translateX(-4px) rotate(-6deg); opacity: 0.2; }
      40%  { transform: translateX(4px) rotate(6deg);   opacity: 1; }
      50%  { transform: translateX(-3px) rotate(-4deg); opacity: 0.3; }
      60%  { transform: translateX(3px) rotate(4deg);   opacity: 1; }
      70%  { transform: translateX(-2px) rotate(-3deg); opacity: 0.5; }
      80%  { transform: translateX(2px) rotate(3deg);   opacity: 1; }
      90%  { transform: translateX(-1px) rotate(-1deg); opacity: 0.7; }
      100% { transform: translateX(0) rotate(0);        opacity: 1; }
    }
    @media (max-width: 480px) { .petjada-link { top: 6px; left: 8px; } .petjada-link img { height: 40px; } }
    @media (prefers-reduced-motion: reduce) { .petjada-link:hover img, .petjada-link:focus-visible img { animation: none; } }
  </style>

  <script>
    // ── Custom dropdown factory ──
    function makeCustomDropdown(wrapId, activities, defaultFile, onChangeCallback, stopAfterFile) {
      const wrap    = document.getElementById(wrapId);
      const trigger = wrap.querySelector('.cd-trigger');
      const list    = wrap.querySelector('.cd-list');
      const label   = wrap.querySelector('.cd-label');
      let options = activities.filter(a => !a.separator);   // només les opcions triables
      let currentFile = defaultFile;
      let activeIdx   = -1;   // opció ressaltada amb les fletxes del teclat

      // Accessibilitat: el disparador es comporta com un combobox (Tab, fletxes,
      // Enter/Espai, Esc) i la llista com un listbox per als lectors de pantalla.
      list.id = wrapId + '-list';
      trigger.setAttribute('tabindex', '0');
      trigger.setAttribute('role', 'combobox');
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-controls', list.id);
      trigger.setAttribute('aria-expanded', 'false');
      const rowLabel = wrap.closest('.row')?.querySelector('label');
      if (rowLabel) {
        rowLabel.id = wrapId + '-label';
        trigger.setAttribute('aria-labelledby', rowLabel.id);
      }
      list.setAttribute('role', 'listbox');
      // La classe 'open' també la posen/treuen altres parts de la pàgina:
      // mantenim aria-expanded sincronitzat amb ella.
      new MutationObserver(() => {
        const isOpen = wrap.classList.contains('open');
        trigger.setAttribute('aria-expanded', String(isOpen));
        if (!isOpen) setActive(-1);
      }).observe(wrap, { attributes: true, attributeFilter: ['class'] });

      function getValue() { return currentFile; }

      function choose(a) {
        currentFile = a.file;
        label.textContent = a.label;
        render();
        wrap.classList.remove('open');
        onChangeCallback();
      }

      function setActive(idx) {
        activeIdx = idx;
        list.querySelectorAll('.cd-option').forEach((el, i) => el.classList.toggle('active', i === idx));
        if (idx >= 0) {
          const el = document.getElementById(`${wrapId}-opt-${idx}`);
          trigger.setAttribute('aria-activedescendant', el.id);
          el.scrollIntoView({ block: 'nearest' });
        } else {
          trigger.removeAttribute('aria-activedescendant');
        }
      }

      function render() {
        list.innerHTML = '';
        let i = 0;
        activities.forEach(a => {
          if (a.separator) {
            const hr = document.createElement('div');
            hr.className = 'cd-separator';
            hr.setAttribute('aria-hidden', 'true');
            list.appendChild(hr);
            return;
          }
          const div = document.createElement('div');
          div.className = 'cd-option' + (a.file === currentFile ? ' selected' : '');
          div.id = `${wrapId}-opt-${i++}`;
          div.setAttribute('role', 'option');
          div.setAttribute('aria-selected', String(a.file === currentFile));
          div.innerHTML = `
            <svg class="cd-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 8 7 12 13 4"/>
            </svg>
            <span>${a.label}</span>`;
          div.addEventListener('click', () => choose(a));
          list.appendChild(div);
        });
      }

      const def = activities.find(a => a.file === defaultFile) || activities[0];
      label.textContent = def.label;
      render();

      // Canvia les activitats del menú (el botó «Activar la resolució pas a pas»). Si la triada
      // ja no hi és, es tria la primera; si no n'hi ha cap, getValue() torna null.
      const BUIT = "Encara no n'hi ha cap";
      function setActivities(llista) {
        activities = llista;
        options = activities.filter(a => !a.separator);
        if (!options.some(a => a.file === currentFile)) currentFile = options.length ? options[0].file : null;
        const sel = options.find(a => a.file === currentFile);
        label.textContent = sel ? sel.label : BUIT;
        wrap.classList.toggle('buit', !sel);
        wrap.classList.remove('open');
        render();
      }

      // Part visible (px, comptada des de dalt de l'opció) de la primera opció que queda tallada.
      const PEEK_PX = 20;

      // Alçada màxima de la llista desplegada.
      // Sense `stopAfterFile`: com sempre (320 px com a màxim, sense sortir del panell).
      // Amb `stopAfterFile`: la llista acaba just després d'aquesta opció i només deixa veure el
      // principi de la següent, perquè es vegi que el menú continua. Les alçades es mesuren al
      // navegador (el text pot ocupar 1 o 2 línies segons el dispositiu).
      function listHeight() {
        const panel = wrap.closest('.quiz-panel');
        const triggerBottom = trigger.getBoundingClientRect().bottom;
        const available = panel.getBoundingClientRect().bottom - triggerBottom - 12;
        const normal = Math.min(320, Math.max(100, available));
        if (!stopAfterFile) return normal;

        const optEls = list.querySelectorAll('.cd-option');
        const idx = options.findIndex(a => a.file === stopAfterFile);
        if (idx < 0 || idx + 1 >= optEls.length) return normal;
        return Math.min(normal, optEls[idx + 1].offsetTop + PEEK_PX + 2);   // +2: vores de la llista
      }

      // Amb `stopAfterFile`, si la llista desplegada arribés al botó «Obre», es baixa el botó
      // just el que cal (només mentre el menú és obert) perquè mai quedi tapat.
      function reserveSpaceForButton(h) {
        wrap.style.marginBottom = '';
        const btnRow = wrap.closest('.quiz-panel').querySelector('.btn-row');
        if (!btnRow) return;
        const real = Math.min(h, list.scrollHeight);   // una llista curta no ocupa tota l'alçada màxima
        const listBottom = trigger.getBoundingClientRect().bottom + 5 + real;   // 5 = separació de la llista
        const need = Math.ceil(listBottom + 10 - btnRow.getBoundingClientRect().top);   // 10 = aire
        if (need > 0) wrap.style.marginBottom = need + 'px';
      }

      function openList() {
        wrap.classList.add('open');
        const h = listHeight();
        list.style.maxHeight = h + 'px';
        if (stopAfterFile) reserveSpaceForButton(h);
      }
      if (stopAfterFile) {
        new MutationObserver(() => { if (!wrap.classList.contains('open')) wrap.style.marginBottom = ''; })
          .observe(wrap, { attributes: true, attributeFilter: ['class'] });
      }

      trigger.addEventListener('click', e => {
        e.stopPropagation();
        if (wrap.classList.contains('open')) wrap.classList.remove('open');
        else openList();
      });
      list.addEventListener('click', e => e.stopPropagation());

      trigger.addEventListener('keydown', e => {
        const isOpen = wrap.classList.contains('open');
        const selIdx = options.findIndex(a => a.file === currentFile);
        switch (e.key) {
          case 'ArrowDown':
          case 'ArrowUp': {
            e.preventDefault();
            if (!isOpen) { openList(); setActive(selIdx); return; }
            const from = activeIdx >= 0 ? activeIdx : selIdx;
            const step = e.key === 'ArrowDown' ? 1 : -1;
            setActive(Math.min(options.length - 1, Math.max(0, from + step)));
            break;
          }
          case 'Home':
          case 'End':
            if (!isOpen) return;
            e.preventDefault();
            setActive(e.key === 'Home' ? 0 : options.length - 1);
            break;
          case 'Enter':
          case ' ':
            e.preventDefault();
            if (isOpen && activeIdx >= 0) choose(options[activeIdx]);
            else if (isOpen) wrap.classList.remove('open');
            else { openList(); setActive(selIdx); }
            break;
          case 'Escape':
            if (isOpen) { e.preventDefault(); wrap.classList.remove('open'); }
            break;
          case 'Tab':
            wrap.classList.remove('open');
            break;
        }
      });

      return { getValue, openList, setActivities };
    }

    // ── Panel init ──
    function initPanel(suffix, activities, defaultFile, stopAfterFile) {
      const els = {
        d:        document.getElementById('d-' + suffix),
        rowD:     document.getElementById('row-diff-' + suffix),
        fix:      document.getElementById('fix-' + suffix),
        rowFix:   document.getElementById('row-fixed-' + suffix),
        dim:      document.getElementById('dim-' + suffix),
        rowDim:   document.getElementById('row-dim-' + suffix),
        nivell:   document.getElementById('nivell-' + suffix),
        rowNivell:document.getElementById('row-nivell-' + suffix),
        mod:      document.getElementById('mod-' + suffix),
        rowMod:   document.getElementById('row-mod-' + suffix),
        esv:      document.getElementById('esv-' + suffix),
        rowEsv:   document.getElementById('row-esv-' + suffix),
        s:      document.getElementById('s-' + suffix),
        o:      document.getElementById('o-' + suffix),
        i:      document.getElementById('i-' + suffix),
        m:      document.getElementById('m-' + suffix),
        link:   document.getElementById('l-' + suffix),
        copy:   document.getElementById('c-' + suffix),
        open:   document.getElementById('p-' + suffix),
        help:   document.getElementById('h-' + suffix),
        status: document.getElementById('st-' + suffix)
      };

      let timeout1, timeout2;

      function manageDifficultyRow() {
        if (!els.rowD) return;
        const selected = activities.find(a => a.file === dropdown.getValue());
        els.rowD.style.display = (selected && selected.difficulty) ? '' : 'none';
      }

      function manageFixedRow() {
        if (!els.rowFix) return;
        const selected = activities.find(a => a.file === dropdown.getValue());
        els.rowFix.style.display = (selected && selected.fixed) ? '' : 'none';
        // Quan s'amaga, reseteja el valor per no deixar ?fixed= penjat
        if (!(selected && selected.fixed) && els.fix) els.fix.value = '';
      }

      function manageDimRow() {
        if (!els.rowDim) return;
        els.rowDim.style.display = (dropdown.getValue() === 'vocabulari.html') ? '' : 'none';
      }

      function manageNivellRow() {
        if (!els.rowNivell) return;
        els.rowNivell.style.display = (dropdown.getValue() === 'vocabulari.html') ? '' : 'none';
      }

      // Activitats amb modalitats (modalitat: true), p. ex. prioritat.html: «Resultat final» o «Pas a pas»
      function manageModRow() {
        if (!els.rowMod) return;
        const selected = activities.find(a => a.file === dropdown.getValue());
        // Amb l'esvaïment, prioritat sempre és «Pas a pas»: la modalitat no cal
        const ambEsv = selected && selected.esvaiment && els.esv && els.esv.value !== '';
        els.rowMod.style.display = (selected && selected.modalitat && !ambEsv) ? '' : 'none';
      }

      // Activitats amb el mode «Esvaïment» (esvaiment: true; ha de coincidir amb
      // SUPORTA_ESVAIMENT de js/esvaiment.js, tests/check-repo.js ho comprova)
      function manageEsvRow() {
        if (!els.rowEsv) return;
        const selected = activities.find(a => a.file === dropdown.getValue());
        els.rowEsv.style.display = (selected && selected.esvaiment) ? '' : 'none';
        // Quan s'amaga, reseteja el valor per no deixar ?esvaiment= penjat
        if (!(selected && selected.esvaiment) && els.esv) els.esv.value = '';
      }

      function build() {
        const file = dropdown.getValue();
        // Amb la resolució pas a pas activada, un menú pot quedar buit: no hi ha enllaç
        els.copy.disabled = els.open.disabled = !file;
        if (!file) {
          els.link.textContent = '';
          return;
        }
        // Amb la resolució pas a pas activada no hi ha opcions: només l'activitat i pissarra=1
        if (resolucioPasAPas) {
          els.link.textContent = `${BASE_URL}${file}?pissarra=1`;
          return;
        }
        if (suffix === 'batx') {
          const qs = new URLSearchParams();
          if (els.fix && els.fix.value) qs.set('fixed', els.fix.value);
          const q = qs.toString();
          els.link.textContent = `${BASE_URL}${file}` + (q ? '?' + q : '');
        } else {
          const selected = activities.find(a => a.file === file);
          const qs = new URLSearchParams({
            totalsessions:    els.s.value,
            totaloperations:  els.o.value,
            maxintents:       els.i.value,
            maxenllocmitjana: els.m.value
          });
          if (selected && selected.difficulty && els.d) {
            qs.append('nivell', els.d.value);
          }
          if (els.fix && els.fix.value) {
            qs.set('fixed', els.fix.value);
          }
          if (file === 'vocabulari.html' && els.dim && els.dim.value) {
            qs.append('dim', els.dim.value);
          }
          if (file === 'vocabulari.html' && els.nivell) {
            qs.append('modalitat', els.nivell.value);
          }
          const ambEsv = selected && selected.esvaiment && els.esv && els.esv.value !== '';
          if (selected && selected.modalitat && els.mod && els.mod.value && !ambEsv) {
            qs.append('modalitat', els.mod.value);
          }
          if (ambEsv) {
            qs.append('esvaiment', '1');
            if (els.esv.value !== '0') qs.append('inici', els.esv.value);
          }
          els.link.textContent = `${BASE_URL}${file}?${qs.toString()}`;
        }
      }

      function manageHelpButton(isInitialLoad = false) {
        const selected = activities.find(a => a.file === dropdown.getValue());
        const hasVideo = selected && selected.yt && selected.yt.trim() !== '';
        clearTimeout(timeout1); clearTimeout(timeout2);
        if (isInitialLoad) {
          els.help.style.display = 'none';
          timeout1 = setTimeout(() => {
            const nowSel = activities.find(a => a.file === dropdown.getValue());
            if (nowSel && nowSel.yt) els.help.style.display = 'flex';
          }, 4500);
        } else {
          timeout1 = setTimeout(() => {
            els.help.style.display = 'none';
            timeout2 = setTimeout(() => { if (hasVideo) els.help.style.display = 'flex'; }, 800);
          }, 200);
        }
      }

      function refresh() {
        manageDifficultyRow();
        manageFixedRow();
        manageDimRow();
        manageNivellRow();
        manageEsvRow();
        manageModRow();
        build();
        manageHelpButton(false);
      }
      const dropdown = makeCustomDropdown('cd-' + suffix, activities, defaultFile, refresh, stopAfterFile);

      build();
      manageDifficultyRow();
      manageFixedRow();
      manageDimRow();
      manageNivellRow();
      manageEsvRow();
      manageModRow();
      manageHelpButton(true);

      [els.d, els.fix, els.s, els.o, els.i, els.m, els.dim, els.nivell, els.mod].filter(Boolean).forEach(el => el.addEventListener('change', build));
      if (els.esv) els.esv.addEventListener('change', () => { manageModRow(); build(); });

      els.copy.addEventListener('click', async () => {
        // [FIX BUG5] try-catch + fallback per a HTTP, Safari antic, etc.
        let copiat = false;
        try {
          await navigator.clipboard.writeText(els.link.textContent);
          copiat = true;
        } catch {
          // Fallback: seleccionem el text de l'enllaç d'AQUEST panell (és un <div>,
          // no un textarea) i provem la còpia clàssica. Si tampoc funciona, el text
          // queda seleccionat perquè l'usuari el copiï a mà.
          const range = document.createRange();
          range.selectNodeContents(els.link);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          try { copiat = document.execCommand('copy'); } catch { copiat = false; }
        }
        els.status.textContent = copiat ? 'Copiat ✅' : "Copia l'enllaç seleccionat (Ctrl+C)";
        setTimeout(() => els.status.textContent = '', copiat ? 2000 : 5000);
      });
      els.open.addEventListener('click', () => window.open(els.link.textContent, '_blank'));
      els.help.addEventListener('click', () => {
        const selected = activities.find(a => a.file === dropdown.getValue());
        if (selected && selected.yt) window.open(selected.yt, '_blank');
      });

      // El botó «Activar la resolució pas a pas»: el menú ofereix només les activitats amb
      // pissarra: true (o totes, si es desactiva) i l'enllaç és «activitat?pissarra=1».
      function setResolucioPasAPas() {
        dropdown.setActivities(resolucioPasAPas ? activities.filter(a => a.pissarra) : activities);
        refresh();
      }

      return Object.assign({}, dropdown, { setResolucioPasAPas });
    }

    // «Activar la resolució pas a pas» (desactivat per defecte: tot com sempre). Les activitats
    // que la tenen porten «pissarra: true» a la llista i han de coincidir amb SUPORTA_PISSARRA
    // de js/pissarra/mode.js (tests/check-repo.js ho comprova).
    let resolucioPasAPas = false;

    const dropdownEso = initPanel('eso',  ACTIVITIES_ESO,  DEFAULT_ESO, ESO_LLISTA_FINS);
    const dropdownBatx = initPanel('batx', ACTIVITIES_BATX, DEFAULT_BATX);

    {
      const boto = document.getElementById('btn-pissarra');
      const text = boto.querySelector('.pissarra-toggle-text');
      // Mentre cap activitat no la tingui, el botó no surt
      boto.hidden = ![...ACTIVITIES_ESO, ...ACTIVITIES_BATX].some(a => a.pissarra);
      boto.addEventListener('click', () => {
        resolucioPasAPas = !resolucioPasAPas;
        boto.setAttribute('aria-pressed', String(resolucioPasAPas));
        document.body.classList.toggle('resolucio-pas-a-pas', resolucioPasAPas);   // lila i sense opcions
        text.textContent = resolucioPasAPas ? 'Desactivar la resolució pas a pas' : 'Activar la resolució pas a pas';
        dropdownEso.setResolucioPasAPas();
        dropdownBatx.setResolucioPasAPas();
      });
    }

    // Tanca dropdowns en clicar fora
    document.addEventListener('click', () => {
      document.querySelectorAll('.cd-wrap').forEach(w => w.classList.remove('open'));
    });

    // Navegació mòbil
    document.querySelectorAll('input[name="mobile-nav"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.querySelectorAll('.quiz-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(e.target.value).classList.add('active');
      });
    });

    // Obre els desplegables d'activitat per defecte
    window.addEventListener('load', () => {
      setTimeout(() => {
        // ESO: l'alçada es calcula perquè la llista no tapi el botó «Obre»
        dropdownEso.openList();
        // Batxillerat: com abans
        const wrapBatx = document.getElementById('cd-batx');
        wrapBatx.querySelector('.cd-list').style.maxHeight = '320px';
        wrapBatx.classList.add('open');
      }, 1600);
    });
  </script>
