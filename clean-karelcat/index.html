<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karel</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>


<!-- ══════════════════════════════════════════════════════
     FILA 1 — Identitat i informació
     ══════════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="logo">
    <span class="logo-icon">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor" shape-rendering="crispEdges" width="18" height="18">
        <rect x="5" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/>
        <rect x="4" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="10" y="3" width="1" height="1"/><rect x="11" y="3" width="1" height="1"/>
        <rect x="3" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="8" y="4" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/><rect x="10" y="4" width="1" height="1"/><rect x="11" y="4" width="1" height="1"/><rect x="12" y="4" width="1" height="1"/>
        <rect x="3" y="5" width="1" height="1"/><rect x="4" y="5" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="8" y="5" width="1" height="1"/><rect x="9" y="5" width="1" height="1"/><rect x="10" y="5" width="1" height="1"/><rect x="11" y="5" width="1" height="1"/><rect x="12" y="5" width="1" height="1"/>
        <rect x="3" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="5" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/><rect x="12" y="6" width="1" height="1"/>
        <rect x="3" y="7" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="5" y="7" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="8" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/><rect x="10" y="7" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/><rect x="12" y="7" width="1" height="1"/>
        <rect x="4" y="8" width="1" height="1"/><rect x="5" y="8" width="1" height="1"/><rect x="6" y="8" width="1" height="1"/><rect x="7" y="8" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="9" y="8" width="1" height="1"/><rect x="10" y="8" width="1" height="1"/><rect x="11" y="8" width="1" height="1"/>
        <rect x="4" y="9" width="1" height="1"/><rect x="7" y="9" width="1" height="1"/><rect x="8" y="9" width="1" height="1"/><rect x="11" y="9" width="1" height="1"/>
        <rect x="4" y="10" width="1" height="1"/><rect x="7" y="10" width="1" height="1"/><rect x="8" y="10" width="1" height="1"/><rect x="11" y="10" width="1" height="1"/>
        <rect x="4" y="11" width="1" height="1"/><rect x="7" y="11" width="1" height="1"/><rect x="8" y="11" width="1" height="1"/><rect x="11" y="11" width="1" height="1"/>
        <rect x="3" y="12" width="1" height="1"/><rect x="7" y="12" width="1" height="1"/><rect x="8" y="12" width="1" height="1"/><rect x="12" y="12" width="1" height="1"/>
        <rect x="3" y="13" width="1" height="1"/><rect x="7" y="13" width="1" height="1"/><rect x="8" y="13" width="1" height="1"/><rect x="12" y="13" width="1" height="1"/>
        <rect x="6" y="3" width="1" height="1" fill="#141414"/><rect x="7" y="3" width="1" height="1" fill="#141414"/><rect x="8" y="3" width="1" height="1" fill="#141414"/><rect x="9" y="3" width="1" height="1" fill="#141414"/>
      </svg>
    </span>
    <span>Karel</span>
  </div>

  <div class="topbar-actions">
    <div id="state-badge" aria-live="polite">
      <div id="state-dot"></div>
      <span id="state-lbl">aturat</span>
    </div>
    <span class="toolbar-bag"><span id="lbl-bag">Motxilla:</span> <strong id="st-bag">0</strong></span>
  </div>

  <button id="btn-theme"
          class="btn"
          onclick="toggleTheme()"
          aria-label="Canvia el tema"
          style="margin-left:auto; padding:5px 8px; line-height:1; flex-shrink:0;">
  </button>
</header>


<!-- ══════════════════════════════════════════════════════
     FILA 2 — Controls d'execució
     ══════════════════════════════════════════════════════ -->
<div class="toolbar">
  <button class="btn p" id="btn-run" onclick="handleRunClick()">▶ Executa</button>
  <button class="btn"   id="btn-reset" onclick="resetKarel()">↺ Reinicia</button>
  <div class="speed-row">
    <span id="lbl-speed">Velocitat:</span>
    <input type="range" id="speed" min="1" max="6" step="1" value="2">
    <span id="speed-lbl">Lent</span>
  </div>
</div>


<!-- ══════════════════════════════════════════════════════
     ZONA PRINCIPAL — Editor + món
     ══════════════════════════════════════════════════════ -->
<div class="main">
  <div class="code-col">
    <div class="editor-wrap">
      <div id="line-numbers"></div>
      <div class="editor-inner">
        <div  id="line-bg"        aria-hidden="true"></div>
        <pre  id="code-highlight" aria-hidden="true"></pre>
        <textarea id="code-editor" spellcheck="false"></textarea>
      </div>
    </div>
    <div id="autocomplete" class="autocomplete-dropdown" role="listbox" aria-label="Autocompletat"></div>
    <div id="log-wrap">
      <div id="log"></div>
    </div>
  </div>

  <div class="map-col">
    <div class="world-area" id="world-area">
      <div id="world-grid"></div>
    </div>
  </div>
</div>


<!-- ══════════════════════════════════════════════════════
     Scripts — només els del nucli supervivent
     ══════════════════════════════════════════════════════ -->
<script src="js/constants.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/tokenizer.js"></script>
<script src="js/parser.js"></script>
<script src="js/interpreter.js"></script>
<script src="js/world.js"></script>
<script src="js/renderer.js"></script>
<script src="js/editor.js"></script>
<script src="js/ui.js"></script>
<script src="js/execution.js"></script>
<script src="js/main.js"></script>
</body>
</html>
