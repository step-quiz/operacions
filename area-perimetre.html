<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Àrea i Perímetre de Pentominós — Activitat per a 1r ESO">
    <title>Àrea i Perímetre — Pentominós</title>

    <!--
    ============================================================
    FITXER: area-perimetre.html
    ROL: Joc educatiu per practicar àrea i perímetre de pentominós.

    [FIX A1] Migrat a game-core.js: sessions, nota, codi v2,
             teclat compartit, historial, recordResult.
    ============================================================
    -->

    <!-- 1. Configuració per defecte -->
    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    5,
            defaultIntents:       4,
            defaultEnllocMitjana: 1
        };
    </script>

    <!-- 3. Estils compartits -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">

    <!-- 4. Estils específics d'àrea-perímetre (sobreescriu shared.css on cal) -->

    <style>
        :root {
            --bg-color:      #f8fafc;
            --primary:       #0f766e;
            --primary-light: #ccfbf1;
            --primary-dark:  #134e4a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            transition: background-color 1s ease;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-dark);
            font-size: 1.6em;
            margin: 0 0 2px 0;
            text-align: center;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 1em;
            margin: 0 0 18px 0;
            text-align: center;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 910px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-top: 6px solid var(--primary);
            position: relative;
        }

        /* ── CAPÇALERA ──────────────────────────────────────────── */
        .header-info {
            background-color: #f1f5f9;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left     { display: flex; flex-direction: column; gap: 2px; }
        .header-top-row  { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .session-text    { font-size: 1em;  color: var(--text-muted); }
        .level-text      { font-size: 1em;  color: var(--primary-dark); font-weight: 700; }
        .score-text      { font-size: 1.2em; color: #059669; font-family: monospace; }
        .attempts-counter {
            font-family: monospace;
            font-size: 1.2em;
            color: var(--text-muted);
            padding: 5px 10px;
            background: white;
            border-radius: 4px;
            border: 1px solid var(--border-heavy);
            transition: all 0.3s;
        }
        .attempts-counter.danger { color: var(--danger); border-color: var(--danger); }
        @keyframes attemptsBlink {
            0%,100% { background-color: #fef3c7; }
            50%     { background-color: #e5e7eb; }
        }
        .attempts-counter.blink { animation: attemptsBlink 0.2s linear 5; }

        /* ── CONTINGUT: layout esquerra/dreta ──────────────────── */
        .game-content {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            padding: 0;
            gap: 0;
            min-height: 340px;
        }
        /* Columna esquerra: la figura (45%) */
        .col-figure {
            flex: 45 45 0;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            border-right: 1px solid var(--border-color);
            background: var(--bg-color);
        }
        /* Columna dreta: inputs, botons, ajuda (55%) */
        .col-controls {
            flex: 55 55 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 24px;
            gap: 18px;
        }

        /* ── SVG PENTOMINO ──────────────────────────────────────── */
        .pentomino-svg-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .pentomino-svg {
            display: block;
            max-width: 100%;
            max-height: 420px;
            height: auto;
            margin: 0 auto;
            animation: fadeIn 0.35s ease;
        }

        /* ── INPUTS ─────────────────────────────────────────────── */
        .inputs-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }
        .input-label {
            font-size: 1em;
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .input-label .unit {
            font-size: 0.88em;
            color: var(--text-muted);
            font-weight: 400;
        }
        .measure-input {
            width: 100px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 2em;
            font-weight: bold;
            padding: 10px 6px;
            text-align: center;
            border: 2.5px solid var(--border-heavy);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s, color 0.2s;
            -moz-appearance: textfield;
        }
        .measure-input::-webkit-inner-spin-button,
        .measure-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .measure-input:focus {
            border-color: var(--primary);
            background-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(15,118,110,0.2);
        }
        .measure-input.kb-active-input {
            background-color: var(--primary-light) !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(15,118,110,0.2) !important;
        }
        .measure-input.error-shake {
            border-color: var(--danger) !important;
            background-color: var(--danger-light) !important;
            box-shadow: none !important;
            animation: shake 0.28s;
        }
        /* Resposta encertada: verd, no editable */
        .measure-input.input-locked {
            background-color: #dcfce7 !important;
            border-color: #16a34a !important;
            color: #166534 !important;
            box-shadow: none !important;
            cursor: default;
        }

        /* ── BOTONS D'ACCIÓ ─────────────────────────────────────── */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Botó OK: verd clar per defecte, fosc al hover */
        #btn-ok {
            background-color: #bbf7d0;
            color: #166534;
            border: 2px solid #86efac;
            padding: 14px 28px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            touch-action: manipulation;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        }
        #btn-ok:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        #btn-ok:active        { transform: scale(0.95); }
        @media (hover:hover) {
            #btn-ok:hover {
                background-color: #1e293b;
                color: white;
                border-color: #1e293b;
            }
        }
        #btn-ok.error-shake {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: shake 0.2s;
        }

        /* Botó Ajuda */
        .btn-ajuda {
            background: #fffbeb;
            color: #92400e;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-ajuda:hover  { background: #fef3c7; }
        .btn-ajuda:active { transform: scale(0.96); }

        /* ── CAIXA D'AJUDA ──────────────────────────────────────── */
        .help-box {
            display: none;
            background: #fffbeb;
            border: 2px solid #fde68a;
            border-radius: 10px;
            padding: 14px 16px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }
        .help-box.visible { display: block; }
        .help-box p {
            margin: 8px 0;
            font-size: 1em;
            color: #78350f;
            font-weight: 600;
            line-height: 1.55;
        }
        .help-box p:first-child { margin-top: 0; }
        .help-box p:last-child  { margin-bottom: 0; }
        .help-separator { border: none; border-top: 1px dashed #fbbf24; margin: 10px 0; }

        /* ── RESPOSTA CORRECTA (intents esgotats) ───────────────── */
        .answer-reveal {
            display: none;
            text-align: center;
            color: #b91c1c;
            font-weight: 600;
            font-size: 1em;
            background: var(--danger-light);
            border: 2px solid #fca5a5;
            border-radius: 10px;
            padding: 12px 24px;
            animation: fadeIn 0.35s ease;
            width: 100%;
        }
        .answer-reveal.visible { display: block; }
        .answer-reveal .reveal-vals {
            font-family: monospace;
            font-size: 1.4em;
            font-weight: bold;
            color: #991b1b;
            margin-top: 6px;
        }

        /* ── CAIXA D'ADVERTIMENT ───────────────────────────────── */
        .warning-box {
            display: none;
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.97em;
            font-weight: 600;
            text-align: center;
            animation: fadeIn 0.25s ease;
            line-height: 1.45;
        }
        .warning-box.visible { display: block; }
        .warning-box.warn-empty {
            background: #fef9c3;
            border: 2px solid #fde047;
            color: #713f12;
        }
        .warning-box.warn-swap {
            background: #fff7ed;
            border: 2px solid #fb923c;
            color: #7c2d12;
        }

        /* ── MINI OVERLAY ───────────────────────────────────────── */
        #mini-victory-overlay {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 28px 20px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.3s;
        }
        .vic-message-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 10px;
        }
        .star-icon      { font-size: 3em; animation: pop 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }
        .mini-vic-text  { color: #047857; font-size: 2em; font-weight: bold; }
        .mini-vic-points {
            color: #059669;
            font-size: 1.3em;
            font-weight: bold;
            font-family: monospace;
            background: rgba(255,255,255,0.95);
            padding: 5px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* ── PANTALLES FINALS ───────────────────────────────────── */
        #session-end-screen, #final-screen {
            display: none;
            padding: 38px 20px;
            text-align: center;
        }
        #session-end-screen h2, #final-screen h2 {
            color: var(--success);
            font-size: 1.8em;
            margin-bottom: 22px;
        }
        .trophy-icon  { font-size: 5.5em; margin-bottom: 10px; animation: bounce 1.5s infinite; }
        .final-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin: 0 auto 22px;
            max-width: 480px;
            flex-wrap: wrap-reverse;
        }
        .final-layout .trophy-icon { margin: 0; font-size: 4.5em; }
        .final-summary {
            flex: 1;
            text-align: left;
            font-size: 1.1em;
            line-height: 1.8;
            min-width: 200px;
        }
        .final-summary .session-line {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 1.1em;
        }
        .btn-green {
            display: none;
            background-color: #059669;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .btn-green:hover  { background-color: #047857; }
        .btn-green:active { transform: scale(0.95); }
        .btn-submit {
            background-color: #475569;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .btn-submit:active { transform: scale(0.95); }
        @media (hover:hover) { .btn-submit:hover { background-color: #334155; } }

        /* ── TECLAT NUMÈRIC CUSTOM ──────────────────────────────── */
        #customKeyboard {
            display: none;
            background: #f1f5f9;
            border: 2px solid var(--border-heavy);
            border-radius: 12px;
            padding: 12px 12px 16px;
            width: 100%;
            max-width: 700px;
        }
        #customKeyboard.kb-visible { display: block; }
        .kb-grid {
            display: grid;
            grid-template-columns: 58px 58px 58px 80px;
            gap: 8px;
            justify-content: center;
        }
        .kb-btn {
            height: 52px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            background: white;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            box-shadow: 0 2px 0 #cbd5e1;
            transition: 0.08s;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
        }
        .kb-btn:active   { transform: translateY(2px); box-shadow: none; }
        .kb-btn.kb-enter { background:var(--primary); border-color:var(--primary-dark); color:white; box-shadow:0 2px 0 var(--primary-dark); font-size:1.5rem; }
        .kb-btn.kb-del   { background:#fff1f2; border-color:#fca5a5; color:#b91c1c; font-size:1.1rem; }

        /* ── RESPONSIU ──────────────────────────────────────────── */
        @media (max-width:820px) { .panel { width: 95%; } }

        /* En pantalles estretes (<600px) tornem al layout vertical */
        @media (max-width:600px) {
            .game-content  { flex-direction: column; min-height: unset; }
            .col-figure    { border-right: none; border-bottom: 1px solid var(--border-color); padding: 18px 12px; }
            .col-controls  { flex: unset; width: 100%; padding: 20px 16px; }
            .pentomino-svg { max-height: 240px; }
        }

        @media (max-width:480px) {
            body           { padding: 10px; }
            h1             { font-size: 1.3em; }
            .header-info   { flex-direction: column; gap: 8px; padding: 12px; }
            .header-left   { align-items: center; }
            .level-text, .score-text, .attempts-counter { font-size: 1.05em; }
            .measure-input { width: 88px; font-size: 1.8em; }
            #session-end-screen h2, #final-screen h2 { font-size: 1.5em; }
            .trophy-icon   { font-size: 4em; }
            .star-icon     { font-size: 2.5em; }
            .mini-vic-text { font-size: 1.6em; }
        }
        @media (orientation:landscape) and (max-height:500px) {
            .kb-grid     { grid-template-columns: 48px 48px 48px 64px; gap: 5px; }
            .kb-btn      { height: 40px; font-size: 1.1rem; }
            .kb-btn.kb-enter { font-size: 1.2rem; }
            .panel       { display: flex; flex-direction: row; align-items: stretch; max-width: 100%; }
            #game-screen { flex: 1 1 0; min-width: 0; overflow-y: auto; max-height: 100svh; }
            #customKeyboard {
                flex: 0 0 243px; width: 243px; margin-top: 0; padding: 10px;
                border-top: none; border-left: 2px solid var(--border-heavy);
                border-right: none; border-bottom: none; border-radius: 0; align-self: center;
            }
        }

        @keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pop    { 0%{transform:scale(0)} 80%{transform:scale(1.2)} 100%{transform:scale(1)} }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    </style>
<link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Càlcul d'àrea i de perímetre</h1>
</div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">

        <div class="header-info">
            <div class="header-left">
                <div class="header-top-row">
                    <div class="session-text" id="session-display">Sessió 1 de 1</div>
                    <div class="level-text"   id="lvl-display">· Figura 1 de 5</div>
                </div>
            </div>
            <div class="score-text"      id="score-display">Punts: 0</div>
            <div class="attempts-counter" id="attempts-display">Intents: 4</div>
        </div>

        <div class="game-content" id="game-content">

            <!-- Columna esquerra: figura -->
            <div class="col-figure">
                <div class="pentomino-svg-container" id="pentomino-container"></div>
            </div>

            <!-- Columna dreta: controls -->
            <div class="col-controls">

                <div class="inputs-row">
                    <div class="input-group">
                        <label class="input-label" for="area-input">
                            Àrea <span class="unit">(cm²)</span>
                        </label>
                        <input type="text" id="area-input" class="measure-input"
                               autocomplete="off" maxlength="2"
                               aria-label="Àrea en centímetres quadrats">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="perim-input">
                            Perímetre <span class="unit">(cm)</span>
                        </label>
                        <input type="text" id="perim-input" class="measure-input"
                               autocomplete="off" maxlength="2"
                               aria-label="Perímetre en centímetres">
                    </div>
                </div>

                <div class="action-row">
                    <button id="btn-ok" onclick="checkAnswers()">OK</button>
                    <button class="btn-ajuda" id="btn-ajuda" onclick="toggleHelp()">💡 Ajuda</button>
                </div>

                <div class="help-box" id="help-box" aria-live="polite">
                    <p id="help-p1">Per trobar l'àrea, compta quants quadrats té la figura.</p>
                    <hr class="help-separator" id="help-sep" style="display:none;">
                    <p id="help-p2" style="display:none;">Per trobar el perímetre, segueix la vora exterior de la figura i compta tots els segments.</p>
                </div>

                <div class="warning-box" id="warning-box" aria-live="polite"></div>

                <div class="answer-reveal" id="answer-reveal" aria-live="assertive">
                    La resposta correcta era:
                    <div class="reveal-vals" id="answer-reveal-vals"></div>
                </div>

            </div><!-- /.col-controls -->

        </div>
    </div>
</div>


<script type="module" src="js/area-perimetre/area-perimetre.js"></script>
</body>
</html>
