    <link rel="stylesheet" href="css/passos.css">

    <link rel="stylesheet" href="css/seguent.css">
    <link rel="stylesheet" href="css/codi.css">
    <style>
        /* «Mira com es resol»: la resolució pas a pas d'una fórmula del mateix nivell (resolucio.html) */
        .mira-com {
            display: block;
            width: fit-content;
            margin: 14px auto 4px;
            font-size: 0.9em;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px dashed currentColor;
        }
        .mira-com:hover { color: var(--primary-dark); border-bottom-style: solid; }

<div class="title-row">
    <a href="index.html"

<div class="subtitle">Aïllar una lletra: primer amb nombres, després amb lletres</div>

                <div class="level-text" id="lvl-display">Fórmula 1 de 4</div>
            </div>
            <div class="score-text" id="score-display">Punts: 0</div>
