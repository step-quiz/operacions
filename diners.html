<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Activitat interactiva de matemàtiques — Step Quiz">
    <link rel="icon" href="icon.png">
    <title>Diners i canvi</title>

    <!--
    ============================================================
    FITXER: diners.html
    ROL: Activitat de càlcul amb decimals en context de compra.
         Suma de preus, càlcul de canvi i selecció de bitllet.

    NIVELLS (via ?nivell=):
      Nivell 1: 1 producte, cèntims variats, bitllet 5 € o 10 €.
                Un pas: calcular canvi.
      Nivell 2: 2–3 productes, cèntims variats, bitllet 10 € o 20 €.
                Dos passos: total → canvi.  (default)
      Nivell 3: 2–3 productes, cèntims variats.
                Tres passos: total → triar bitllet òptim → canvi.
      Nivell 4: Quantitats (ex: "2 × Llet a 1,35 €") + total → canvi.
                Bitllet 20 € o 50 €.

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 6)
      ?maxintents=N       (default 3)
      ?maxenllocmitjana=  (default 1)

    DEPENDÈNCIES: utils.js → config.js → game-core.js
    ============================================================
    -->

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    6,
            defaultIntents:       3,
            defaultEnllocMitjana: 1
        };
    </script>
    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>

    <style>
        :root {
            --bg-color:      #f8fafc;
            --primary:       #0369a1;
            --primary-light: #e0f2fe;
            --primary-hover: #2563eb;
        }

        /* ── BOTIGA: productes + bitllet ─────────────────────── */
        .shop-display {
            padding: 24px 20px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .products-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 18px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            min-width: 100px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .product-emoji { font-size: 2.5em; line-height: 1; }
        .product-name  { font-size: 0.95em; color: var(--text-muted); font-weight: 600; }
        .product-price {
            font-size: 1.4em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #1e293b;
        }
        /* Quantitat (nivell 4) */
        .product-qty {
            font-size: 0.85em;
            color: var(--primary);
            font-weight: 700;
        }

        .products-plus {
            font-size: 1.6em;
            font-weight: bold;
            color: #94a3b8;
            align-self: center;
        }

        .bill-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            color: #166534;
        }
        .bill-emoji { font-size: 1.5em; }

        /* ── PANELL DE RESOLUCIÓ ─────────────────────────────── */
        .resolution-panel {
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 24px 20px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        /* Pas completat (feedback inline) */
        .step-done {
            color: var(--success);
            font-weight: 700;
            font-size: 1.05em;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .step-prompt {
            font-size: 1.15em;
            font-weight: 700;
            color: #334155;
            text-align: center;
        }

        /* ── PAS: INPUT NUMÈRIC ──────────────────────────────── */
        .step-container { display: none; flex-direction: column; align-items: center; width: 100%; gap: 12px; animation: fadeIn 0.3s; }
        .step-container.active { display: flex; }

        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.8em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        input[type="text"]#value-input {
            width: 140px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]#value-input:focus {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .answer-unit {
            color: var(--text-muted);
            font-size: 0.75em;
        }

        /* ── PAS: SELECCIÓ DE BITLLET (nivell 3) ─────────────── */
        .bill-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .bill-option-btn {
            background: #ffffff;
            border: 2px solid var(--border-heavy);
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 1.2em;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            color: #334155;
        }
        .bill-option-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .bill-option-btn:active { transform: scale(0.95); }
        @media (hover: hover) {
            .bill-option-btn:hover {
                background: var(--primary-light);
                border-color: var(--primary);
                color: var(--primary);
            }
        }
        .bill-option-btn.error-shake {
            background-color: var(--danger-light) !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
            animation: shake 0.2s;
        }
        .bill-option-btn.correct {
            background: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }

        /* ── RESPONSIU ────────────────────────────────────────── */
        @media (max-width: 480px) {
            .shop-display     { padding: 16px 12px 12px; gap: 10px; }
            .product-card     { padding: 10px 12px; min-width: 80px; }
            .product-emoji    { font-size: 2em; }
            .product-price    { font-size: 1.2em; }
            .answer-row       { font-size: 1.5em; }
            input[type="text"]#value-input { width: 110px; padding: 10px; }
            .resolution-panel { padding: 16px 14px 18px; gap: 12px; }
            .step-prompt      { font-size: 1.05em; }
            .bill-option-btn  { padding: 10px 16px; font-size: 1.05em; }
        }
        @media (max-width: 350px) {
            .product-emoji { font-size: 1.6em; }
            .product-card  { min-width: 70px; padding: 8px 10px; }
        }
    </style>

<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Diners i canvi</h1>
</div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">

        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display">Sessió 1 de 1</div>
                <div class="level-text"   id="lvl-display">Compra 1 de 6</div>
            </div>
            <div class="score-text" id="score-display">Punts: 0</div>
            <div id="attempts-display" class="attempts-counter">Intents: 3</div>
        </div>

        <!-- Botiga -->
        <div class="shop-display" id="shop-display"></div>

        <!-- Panell de resolució (passos encadenats) -->
        <div class="resolution-panel" id="resolution-panel">

            <!-- Indicadors de passos completats -->
            <div id="steps-done"></div>

            <!-- Pas actiu: pregunta + input o botons -->
            <div class="step-container active" id="step-active">
                <div class="step-prompt" id="step-prompt"></div>

                <!-- Input numèric (passos de càlcul) -->
                <div class="answer-row" id="answer-row">
                    <input type="text" id="value-input" autocomplete="off"
                           aria-label="Escriu la resposta">
                    <span class="answer-unit">€</span>
                </div>
                <button class="btn-submit" id="btn-submit-val" onclick="checkValue()">OK</button>

                <!-- Botons de bitllet (nivell 3, pas 2) -->
                <div class="bill-options" id="bill-options" style="display:none;"></div>
            </div>

        </div>

    </div>
</div>

<script src="js/game-core.js"></script>

<script>
'use strict';

// ============================================================
// PARÀMETRES URL
// ============================================================

const _urlParams = new URLSearchParams(window.location.search);

/**
 * Nivell 1: 1 producte, canvi directe
 * Nivell 2: 2–3 productes, total → canvi                 (default)
 * Nivell 3: 2–3 productes, total → triar bitllet → canvi
 * Nivell 4: Quantitats, total → canvi
 */
const NIVELL = getIntParam(_urlParams, 'nivell', 2, 1, 4);

// ============================================================
// ELEMENTS DOM
// ============================================================

const els = {
    body:            document.body,
    gameScreen:      document.getElementById('game-screen'),
    sessionDisplay:  document.getElementById('session-display'),
    lvlDisplay:      document.getElementById('lvl-display'),
    scoreDisplay:    document.getElementById('score-display'),
    attemptsDisplay: document.getElementById('attempts-display'),
    shopDisplay:     document.getElementById('shop-display'),
    resolutionPanel: document.getElementById('resolution-panel'),
    stepsDone:       document.getElementById('steps-done'),
    stepActive:      document.getElementById('step-active'),
    stepPrompt:      document.getElementById('step-prompt'),
    answerRow:       document.getElementById('answer-row'),
    valueInput:      document.getElementById('value-input'),
    btnSubmitVal:    document.getElementById('btn-submit-val'),
    billOptions:     document.getElementById('bill-options'),
};

// ============================================================
// ESTAT LOCAL
// ============================================================

let isPenalizing    = false;
let currentProblem  = null;
let expectedAnswer  = 0;
let currentStep     = 1;
let totalSteps      = 1;
let stepsDoneList   = [];    // textos dels passos completats

// ============================================================
// PRODUCTES
// ============================================================

const PRODUCTS = [
    { emoji: '🍞', nom: 'Pa' },
    { emoji: '🥛', nom: 'Llet' },
    { emoji: '🍎', nom: 'Poma' },
    { emoji: '✏️', nom: 'Llapis' },
    { emoji: '📓', nom: 'Llibreta' },
    { emoji: '🍫', nom: 'Xocolata' },
    { emoji: '💧', nom: 'Aigua' },
    { emoji: '🧃', nom: 'Suc' },
    { emoji: '🥐', nom: 'Croissant' },
    { emoji: '🍌', nom: 'Plàtan' },
    { emoji: '🍪', nom: 'Galetes' },
    { emoji: '🥪', nom: 'Entrepà' },
    { emoji: '🍕', nom: 'Pizza' },
    { emoji: '🥤', nom: 'Refresc' },
    { emoji: '🖊️', nom: 'Boli' },
    { emoji: '🧁', nom: 'Magdalena' },
    { emoji: '🥜', nom: 'Fruits secs' },
    { emoji: '🍇', nom: 'Raïm' },
    { emoji: '🧀', nom: 'Formatge' },
    { emoji: '🥚', nom: 'Ous' },
];

// ============================================================
// UTILITATS
// ============================================================

function pickProduct() {
    return { ...pick(PRODUCTS) };
}

function pickNDifferent(n) {
    const result = [];
    const used = new Set();
    while (result.length < n) {
        const p = pickProduct();
        if (!used.has(p.nom)) {
            used.add(p.nom);
            result.push(p);
        }
    }
    return result;
}

/** Retorna el bitllet més petit que cobreix l'import (de la sèrie estàndard). */
function optimalBill(amount) {
    const bills = [5, 10, 20, 50];
    for (const b of bills) {
        if (b >= amount) return b;
    }
    return 50;
}

/** Genera un preu amb cèntims variats dins [min, max] (passos de 0,05 €). */
function randPrice(min, max) {
    // Treballa en cèntims per evitar errors de coma flotant
    const min5 = Math.ceil(min * 20);   // unitats de 0,05
    const max5 = Math.floor(max * 20);
    const val5 = randInt(min5, max5);
    return Math.round(val5 * 5) / 100;
}

function r100(n) { return Math.round(n * 100) / 100; }

// ============================================================
// FORMAT I PARSEIG
// ============================================================

function fmtMoney(n) {
    return n.toFixed(2).replace('.', ',') + ' €';
}

function parseMoneyInput(str) {
    str = String(str).trim().replace('€', '').trim();
    str = str.replace(',', '.');
    if (!/^\d+(\.\d{1,2})?$/.test(str)) return NaN;
    return Math.round(parseFloat(str) * 100) / 100;
}

function moneyEquals(a, b) {
    return Math.round(a * 100) === Math.round(b * 100);
}

// ============================================================
// GENERACIÓ DE PROBLEMES
// ============================================================

function generateProblem() {
    if (NIVELL === 1) {
        // 1 producte, cèntims variats, bitllet 5 € o 10 €
        // Evita preus exactament iguals al bitllet (canvi = 0 no és útil)
        const prod = pickProduct();
        let price;
        do { price = randPrice(0.50, 9.50); } while (price === 5.00 || price === 10.00);
        prod.price = price;
        const bill = optimalBill(prod.price);
        return {
            products: [prod],
            bill,
            total:  prod.price,
            change: r100(bill - prod.price),
            steps:  ['change'],
        };
    }

    if (NIVELL === 2) {
        // 2–3 productes, bitllet 10 € o 20 €
        const n = randInt(2, 3);
        const prods = pickNDifferent(n);
        prods.forEach(p => { p.price = randPrice(0.80, 5.50); });
        const total = r100(prods.reduce((s, p) => s + p.price, 0));
        const bill  = total <= 10 ? 10 : 20;
        return {
            products: prods,
            bill,
            total,
            change: r100(bill - total),
            steps:  ['total', 'change'],
        };
    }

    if (NIVELL === 3) {
        // 2–3 productes, triar bitllet + canvi
        const n = randInt(2, 3);
        const prods = pickNDifferent(n);
        prods.forEach(p => { p.price = randPrice(1.00, 8.00); });
        const total = r100(prods.reduce((s, p) => s + p.price, 0));
        const bill  = optimalBill(total);
        return {
            products: prods,
            bill,
            total,
            change: r100(bill - total),
            steps:  ['total', 'bill', 'change'],
        };
    }

    // Nivell 4: quantitats (2–3 productes amb qty 1–3)
    // Preu unitari 0,80–4,00 → total màx: 3×3×4,00 = 36,00 < 50 €
    const n = randInt(2, 3);
    const prods = pickNDifferent(n);
    prods.forEach(p => {
        p.qty   = randInt(1, 3);
        p.price = randPrice(0.80, 4.00);
    });
    const total = r100(prods.reduce((s, p) => s + p.price * p.qty, 0));
    const bill  = (total <= 20) ? 20 : 50;
    return {
        products: prods,
        bill,
        total,
        change: r100(bill - total),
        steps:  ['total', 'change'],
    };
}

// ============================================================
// RENDERITZACIÓ DE LA BOTIGA
// ============================================================

function renderShop(p) {
    let html = '<div class="products-row">';
    p.products.forEach((prod, i) => {
        if (i > 0) html += '<span class="products-plus">+</span>';
        const qtyLabel = (prod.qty && prod.qty > 1)
            ? `<span class="product-qty">${prod.qty} unitats</span>` : '';
        html += `<div class="product-card">
            <span class="product-emoji">${prod.emoji}</span>
            <span class="product-name">${prod.nom}</span>
            ${qtyLabel}
            <span class="product-price">${fmtMoney(prod.price)}</span>
        </div>`;
    });
    html += '</div>';

    // El bitllet es mostra a nivells 1, 2 i 4 (donat).
    // Al nivell 3 no es mostra aquí perquè l'alumne l'ha de triar.
    if (NIVELL !== 3) {
        html += `<div class="bill-display">
            <span class="bill-emoji">💵</span>
            Pagues amb ${fmtMoney(p.bill)}
        </div>`;
    }
    return html;
}

// ============================================================
// GESTIÓ DE PASSOS
// ============================================================

function getStepPrompt(stepType) {
    if (stepType === 'total')  return 'Quin és el total?';
    if (stepType === 'bill')   return 'Amb quin bitllet pagues?';
    if (stepType === 'change') return 'Quin canvi reps?';
    return '';
}

function getExpectedForStep(stepType) {
    if (stepType === 'total')  return currentProblem.total;
    if (stepType === 'change') return currentProblem.change;
    return 0;  // 'bill' es gestiona amb botons, no amb input
}

/** Mostra el pas correcte (input numèric o botons de bitllet). */
function showStep() {
    const stepType = currentProblem.steps[currentStep - 1];
    els.stepPrompt.textContent = getStepPrompt(stepType);

    // Renderitzar passos completats
    els.stepsDone.innerHTML = stepsDoneList
        .map(t => `<div class="step-done">${t}</div>`).join('');

    if (stepType === 'bill') {
        // Pas de selecció de bitllet: mostra botons, amaga input
        els.answerRow.style.display      = 'none';
        els.btnSubmitVal.style.display   = 'none';
        els.billOptions.style.display    = 'flex';
        hideCustomKeyboard();

        // Genera opcions: bitllet correcte + 1–2 incorrectes
        const correct = currentProblem.bill;
        const allBills = [5, 10, 20, 50];
        const options = [correct];

        // Afegeix 1–2 bitllets incorrectes (massa petits o massa grans)
        const others = allBills.filter(b => b !== correct);
        // Un bitllet massa gran (si existeix)
        const bigger = others.filter(b => b > correct);
        if (bigger.length) options.push(pick(bigger));
        // Un bitllet massa petit (no cobreix el total)
        const smaller = others.filter(b => b < currentProblem.total && !options.includes(b));
        if (smaller.length) options.push(pick(smaller));

        // Si encara en falten, afegeix qualsevol no repetit
        while (options.length < 3) {
            const candidate = pick(others);
            if (!options.includes(candidate)) options.push(candidate);
            else break;
        }

        options.sort((a, b) => a - b);

        els.billOptions.innerHTML = options.map(b =>
            `<button class="bill-option-btn" data-bill="${b}"
                     onclick="checkBill(${b}, this)">${fmtMoney(b)}</button>`
        ).join('');

    } else {
        // Pas numèric: mostra input, amaga botons
        els.answerRow.style.display      = 'flex';
        els.btnSubmitVal.style.display   = 'inline-flex';
        els.billOptions.style.display    = 'none';
        els.valueInput.value = '';
        expectedAnswer = getExpectedForStep(stepType);

        if (isTouchDevice()) showCustomKeyboard(els.valueInput);
        else                 els.valueInput.focus();
    }
}

/** Avança al pas següent o finalitza l'operació. */
function advanceStep(doneText) {
    stepsDoneList.push(doneText);

    if (currentStep >= currentProblem.steps.length) {
        // Últim pas completat
        hideCustomKeyboard();
        finishOperation(true);
    } else {
        currentStep++;
        showStep();
    }
}

// ============================================================
// COMPROVACIÓ DE RESPOSTES
// ============================================================

function checkValue() {
    if (isTransitioning || isPenalizing) return;
    const raw = els.valueInput.value.trim();
    if (raw === '') return;

    const userAnswer = parseMoneyInput(raw);
    if (isNaN(userAnswer)) { shakeBtn(els.btnSubmitVal); penalize(); return; }

    const stepType = currentProblem.steps[currentStep - 1];
    const question = buildQuestionText(stepType);

    if (!moneyEquals(userAnswer, expectedAnswer)) {
        shakeBtn(els.btnSubmitVal);
        recordAnswerToHistory(question, raw, false);
        penalize();
        if (isTouchDevice()) kbMarkForOverwrite(els.valueInput);
        else { els.valueInput.value = ''; els.valueInput.focus(); }
        return;
    }

    recordAnswerToHistory(question, raw, true);

    if (stepType === 'total') {
        advanceStep(`✅ Total: ${fmtMoney(expectedAnswer)}`);
    } else {
        advanceStep(`✅ Canvi: ${fmtMoney(expectedAnswer)}`);
    }
}

function checkBill(chosen, btn) {
    if (isTransitioning || isPenalizing) return;

    const question = 'Bitllet òptim per a ' + fmtMoney(currentProblem.total);

    if (chosen !== currentProblem.bill) {
        btn.classList.add('error-shake');
        setTimeout(() => btn.classList.remove('error-shake'), 200);
        recordAnswerToHistory(question, fmtMoney(chosen), false);
        penalize();
        return;
    }

    recordAnswerToHistory(question, fmtMoney(chosen), true);
    btn.classList.add('correct');

    // Ara mostrem el bitllet a la botiga (per al pas del canvi)
    const shopEl = els.shopDisplay;
    if (!shopEl.querySelector('.bill-display')) {
        shopEl.insertAdjacentHTML('beforeend',
            `<div class="bill-display" style="animation: fadeIn 0.3s;">
                <span class="bill-emoji">💵</span>
                Pagues amb ${fmtMoney(chosen)}
            </div>`);
    }

    setTimeout(() => {
        advanceStep(`✅ Bitllet: ${fmtMoney(chosen)}`);
    }, 500);
}

// ============================================================
// TEXT DE PREGUNTA PER A L'HISTORIAL
// ============================================================

function buildQuestionText(stepType) {
    const p = currentProblem;
    if (stepType === 'total') {
        return p.products.map(prod => {
            const base = `${prod.emoji} ${fmtMoney(prod.price)}`;
            return (prod.qty && prod.qty > 1) ? `${prod.qty}×${base}` : base;
        }).join(' + ');
    }
    if (stepType === 'bill') {
        return `Bitllet per ${fmtMoney(p.total)}`;
    }
    // change
    return `Canvi: ${fmtMoney(p.bill)} − ${fmtMoney(p.total)}`;
}

// ============================================================
// UI HELPERS
// ============================================================

function shakeBtn(btn) {
    btn.classList.add('error-shake');
    setTimeout(() => btn.classList.remove('error-shake'), 200);
}

function updateHeader() {
    els.sessionDisplay.innerText  = `Sessió ${currentSession + 1} de ${TOTAL_SESSIONS}`;
    els.lvlDisplay.innerText      = `Compra ${currentOperation + 1} de ${TOTAL_OPERATIONS}`;
    els.scoreDisplay.innerText    = `Punts: ${sessionScore}`;
    els.attemptsDisplay.innerText = `Intents: ${attemptsLeft}`;
    els.attemptsDisplay.className = 'attempts-counter' +
        (attemptsLeft <= 1 ? ' danger' : '');
}

// ============================================================
// LÒGICA PRINCIPAL
// ============================================================

function buildLevel() {
    attemptsLeft    = MAX_INTENTS;
    isPenalizing    = false;
    isTransitioning = false;
    currentStep     = 1;
    stepsDoneList   = [];

    currentProblem = generateProblem();
    totalSteps     = currentProblem.steps.length;

    els.body.style.backgroundColor =
        bgColors[(currentSession * TOTAL_OPERATIONS + currentOperation) % bgColors.length];

    els.stepsDone.innerHTML           = '';
    els.resolutionPanel.style.display = 'none';

    updateHeader();

    els.shopDisplay.innerHTML = renderShop(currentProblem);

    els.resolutionPanel.style.display = 'flex';
    showStep();
}

function penalize() {
    if (isPenalizing || isTransitioning) return;
    isPenalizing = true;

    setTimeout(() => {
        attemptsLeft--;
        updateHeader();

        if (attemptsLeft <= 0) {
            isTransitioning = true;
            hideCustomKeyboard();
            finishOperation(false);
        }

        isPenalizing = false;
    }, 400);
}

function finishOperation(success) {
    const fails       = MAX_INTENTS - attemptsLeft;
    const levelPoints = success ? Math.max(0, 10 - fails * 2) : 0;
    sessionScore += levelPoints;

    const waitTime = showMiniOverlay(levelPoints);
    setTimeout(() => {
        hideMiniOverlay();
        if (currentOperation + 1 >= TOTAL_OPERATIONS) {
            endSession();
        } else {
            currentOperation++;
            buildLevel();
        }
    }, waitTime);
}

// ── Teclat físic ────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (els.gameScreen.style.display === 'none') return;
    if (els.resolutionPanel.style.display === 'none') return;
    // Només si el pas actiu és d'input numèric (no botons)
    if (els.answerRow.style.display === 'none') return;
    e.preventDefault();
    if (!isTransitioning) checkValue();
});

function checkCurrentCell() { checkValue(); }

// ============================================================
// INICI
// ============================================================

injectSharedHTML();
validateConfig();

// Teclat custom: tecla ',' en lloc de '−' (no hi ha imports negatius)
initCustomKeyboard({ allowNegative: true });
const minusBtn = document.querySelector('.kb-btn.kb-minus');
if (minusBtn) {
    minusBtn.dataset.key = ',';
    minusBtn.textContent = ',';
    minusBtn.classList.remove('kb-minus');
}

startGame();
</script>
