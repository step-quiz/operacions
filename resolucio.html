<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resolució pas a pas animada d'un exercici (Step Quiz): mira com es resol, i demana més detall dels passos que no entenguis.">
    <link rel="icon" href="icon.png">
    <title>Resolució pas a pas</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="vendor/katex-0.16.11/katex.min.css">
    <link rel="stylesheet" href="css/pissarra.css">
    <style>
        /* El lila de la resolució pas a pas (el mateix de l'índex amb el botó activat) */
        :root {
            --primary: #7c3aed;
            --primary-light: #f5f3ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f8fafc;
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }
        /* La capçalera: gris (el 60 % de negre, el David 24/11/2026), amb «Ara fes-ho tu», «Projectar» i la
           tornada a l'índex a la dreta */
        header {
            background: #666666;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }
        header h1 { margin: 0; font-size: 1.1rem; }
        header nav { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; justify-content: flex-end; }
        header a,
        header button {
            font: inherit;
            color: #fff;
            background: transparent;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 11px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            white-space: nowrap;
            cursor: pointer;
        }
        header a:hover,
        header button:hover { background: rgba(255, 255, 255, 0.18); border-color: #fff; }
        header [aria-pressed="true"] { background: #fff; color: #333; border-color: #fff; }
        header [hidden] { display: none; }
        main {
            max-width: 920px;
            margin: 0 auto;
            /* a baix, lloc per al peu fix (dues línies al mòbil) */
            padding: 20px 16px 110px;
        }
        .barra {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            margin-bottom: 14px;
        }
        #nivells { display: flex; flex-wrap: wrap; gap: 8px; }
        .tria, .accio {
            font: inherit;
            font-size: 15px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-heavy);
            background: #fff;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }
        .tria[aria-pressed="true"] {
            border-color: var(--primary);
            background: var(--primary-light);
            font-weight: 700;
        }
        /* En passar-hi el ratolí, que es vegi clar: vora negra gruixuda i fons gris (el 30 % de negre). La
           vora gruixuda és una ombra a dins, perquè el botó no canviï de mida. */
        .tria:hover,
        .accio:hover {
            border-color: #000;
            box-shadow: inset 0 0 0 2px #000;
            background: #b3b3b3;
            color: #000;
        }
        .accions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
        /* La pissarra té la seva barra quan la resolució és llarga (es veu sempre l'última línia) */
        #pissarra .pis-escenari { max-height: min(64vh, 620px); }
        /* Projectar (el mode professor, per al projector): la pissarra gran, sense les frases (el professor ho explica de
           paraula); es passen els passos amb les fletxes, l'espai o un comandament (Re Pàg / Av Pàg) */
        /* Projectar: la capçalera queda (hi ha el botó per sortir), sense el títol */
        body.professor header h1, body.professor #nivells { display: none; }
        body.professor main { max-width: none; padding: 10px 24px 70px; }
        body.professor .barra { margin-bottom: 8px; }
        body.professor #pissarra .pis-escenari { --pis-escala: 1.8; font-size: 1.8em; max-height: calc(100vh - 235px); }
        body.professor #pissarra .pis-explicacio-fila { display: none; }
        /* El pas (què es fa) ben visible, entre els nivells i la pissarra, amb «Vull més detall» al costat */
        #pissarra .pis-explicacio-dalt {
            margin: 0 0 10px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid var(--border-heavy);
            border-left: 5px solid var(--primary);
            border-radius: 10px;
        }
        #pissarra .pis-explicacio-dalt .pis-explicacio { min-height: 0; }
        #pissarra .pis-explicacio-dalt .pis-num-pas { font-size: 15px; font-weight: 700; color: var(--text-main); }
        #pissarra .pis-explicacio-dalt .pis-text-pas { font-size: 19px; max-width: none; }
        #pissarra .pis-explicacio-dalt .pis-detall-boto { font-weight: 400; font-size: 16px; padding: 6px 16px; }
        #pissarra .pis-explicacio-dalt .pis-detall-boto:hover:not(:disabled) {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 0 3px #000;
        }
        @media (max-width: 520px) {
            #pissarra .pis-explicacio-dalt .pis-text-pas { font-size: 16px; }
        }
        .avis { padding: 14px 16px; border: 1px solid var(--border-heavy); border-radius: 10px; background: #fff; }
        .avis ul { margin: 8px 0 0; }
    </style>
    <script src="vendor/katex-0.16.11/katex.min.js"></script>
</head>
<body>
    <header>
        <h1 id="titol">Resolució pas a pas</h1>
        <nav aria-label="Accions">
            <a id="fes-ho-tu" href="index.html" hidden>Ara fes-ho tu</a>
            <button type="button" id="professor" aria-pressed="false" hidden>Projectar</button>
            <button type="button" id="pantalla" hidden>Pantalla completa</button>
            <a href="index.html">← Step Quiz</a>
        </nav>
    </header>
    <main>
        <div class="barra" id="barra" hidden>
            <div id="nivells" role="group" aria-label="Nivell"></div>
            <div class="accions">
                <button type="button" class="accio" id="un-altre">Un altre exercici</button>
            </div>
        </div>
        <div id="pissarra"></div>
    </main>
    <!-- El peu de l'índex (la mateixa informació), fix a baix i sempre visible (el David, 24/11/2026) -->
    <footer style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: #f8f9fa; border-top: 1px solid #ccc; padding: 10px; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; box-sizing: border-box; text-align: center;">

      </span>
    </footer>
    <script type="module" src="js/resolucio/resolucio.js"></script>
</body>
</html>
