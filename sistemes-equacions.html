<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Activitat interactiva de matemàtiques — Sistemes d'equacions">
    <link rel="icon" href="icon.png">
    <title>Sistemes d'equacions — ESO</title>

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    3,
            defaultIntents:       4,
            defaultEnllocMitjana: 1
        };
    </script>
    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/shared.css">

    <style>
        /* ── Variables de color (verd fosc, herència d'equacions.html) ── */
        :root {
            --primary:       #0d9488;
            --primary-light: #ccfbf1;
            --primary-hover: #0f766e;
            --primary-dark:  #115e59;
            --bg-color:      #f0fdfa;
        }

        /* ── Overrides de shared.css ────────────────────────── */
        h1           { color: var(--primary-dark); }
        .header-info { background-color: #e6fffa; }
        .level-text  { color: var(--primary-dark); }
        .score-text  { color: var(--primary); }
        .panel       { border-top-color: var(--primary); }

        /* ── PANTALLA DE SELECCIÓ ────────────────────────────── */
        #selection-screen         { padding: 30px 20px; text-align: center; }
        #selection-screen h2      { color: #334155; font-size: 1.4em; margin-bottom: 20px; }

        /* Sistema de preview (visible només en mode selecció) */
        #preview-expression-box {
            margin: 0 auto 20px auto;
            padding: 16px 20px;
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 10px;
            max-width: 440px;
            min-height: 0;
            font-size: 1.45em;
        }
        .selection-cards {
            display: flex; flex-direction: column; gap: 12px;
            max-width: 440px; margin: 0 auto;
        }
        .selection-card {
            background: white; border: 2px solid var(--border-heavy); border-radius: 10px;
            padding: 20px 18px; cursor: pointer; transition: all .2s; text-align: left;
            display: flex; align-items: center; gap: 16px; font-family: inherit; width: 100%;
        }
        .selection-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .selection-card:active { transform: scale(0.97); }
        @media (hover:hover) {
            .selection-card:hover {
                border-color: var(--primary); background: var(--primary-light);
                transform: translateY(-2px); box-shadow: 0 4px 15px rgba(13,148,136,.15);
            }
        }
        .selection-text h3  { margin: 0 0 4px 0; color: #334155; font-size: 1.47em; }
        .selection-text p   { margin: 0; color: var(--text-muted); font-size: 1.26em; }

        /* ── EXPRESSION BOX — sistema de dues equacions ─────── */
        .expression-box {
            padding: 24px 20px 20px; text-align: center;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 8px;
            font-size: 1.55em; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; min-height: 110px; line-height: 1.8;
        }
        /* Cada equació en la seva fila */
        .sys-row {
            display: flex; align-items: center; gap: 6px;
            flex-wrap: wrap; justify-content: center;
        }
        /* Clau del sistema (accolade) */
        .sys-brace {
            font-size: 2.4em; line-height: 1; color: var(--primary-dark);
            margin-right: 4px; align-self: center;
        }
        .sys-equations {
            display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
        }
        /* Equació aïllada (pas de substitució) */
        .sys-isolated {
            color: var(--primary); font-size: .9em;
        }
        .expr-op   { padding: 0 5px; color: #475569; }
        .expr-eq   { padding: 0 8px; color: var(--text-muted); }
        .expr-result { color: var(--success); }
        /* Etiquetes (1a) (2a) */
        .eq-label {
            font-size: .55em; color: var(--text-muted);
            font-family: sans-serif; font-weight: normal;
            margin-left: 6px; vertical-align: middle;
        }

        /* ── FILA CONTENIDORA D'INPUTS (resolució) ──────────── */
        .schema-row-input {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.15em;
        }

        /* Contenidor sistema (clau + equacions) */
        .sys-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── INPUTS INLINE (schema-row) ─────────────────────── */
        /* Input estàndard a la schema-row */
        .schema-input-sm {
            display: inline-block;
            width: 52px; height: 44px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em; font-weight: bold; text-align: center;
            border: 2.5px solid var(--primary); border-radius: 8px;
            background: var(--primary-light); outline: none; color: #1e293b;
            -moz-appearance: textfield;
        }
        .schema-input-sm:focus { background: #99f6e4; box-shadow: 0 0 0 3px rgba(13,148,136,.25); }
        .schema-input-sm::-webkit-inner-spin-button,
        .schema-input-sm::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .schema-input-sm.error-flash {
            border-color: var(--danger); background: var(--danger-light); animation: shake .25s;
        }
        .schema-input-sm.locked-green {
            color: var(--success); border-color: var(--success);
            background: #d1fae5; font-weight: bold; pointer-events: none;
        }

        /* ── BOTONS DE SELECCIÓ ──────────────────────────────── */
        .schema-btns {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
            margin: 4px 0 12px;
        }
        .schema-btn {
            padding: 11px 22px; border: 2.5px solid var(--primary); border-radius: 8px;
            background: white; color: var(--primary); font-weight: bold; font-size: .95em;
            cursor: pointer; transition: all .15s; font-family: inherit; touch-action: manipulation;
        }
        .schema-btn:active { transform: scale(.95); }
        @media (hover:hover) { .schema-btn:hover { background: var(--primary); color: white; } }
        .schema-btn.selected { background: var(--primary); color: white; border-color: var(--primary-dark); }
        .schema-btn.error-flash {
            border-color: var(--danger); background: var(--danger-light); color: var(--danger);
            animation: shake .25s;
        }

        /* Botó ± per canviar el signe d'un terme inline */
        .sign-toggle-btn {
            padding: 8px 14px; border: 2.5px solid var(--primary); border-radius: 8px;
            background: white; color: var(--primary); font-weight: bold; font-size: 1.05em;
            cursor: pointer; transition: all .15s; font-family: 'Courier New', monospace;
            touch-action: manipulation; min-width: 44px; vertical-align: middle;
        }
        .sign-toggle-btn:active { transform: scale(.95); }
        @media (hover:hover) { .sign-toggle-btn:hover { background: var(--primary-light); } }
        .sign-toggle-btn.neg { background: var(--primary-light); }

        /* ── PANELL DE RESOLUCIÓ ─────────────────────────────── */
        .resolution-panel {
            background-color: var(--bg-color); border-top: 1px solid var(--border-color);
            padding: 25px 20px; display: none; flex-direction: column; align-items: center;
            width: 100%;
        }
        .step-container        { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn .3s; }
        .step-container.active { display: flex; }
        .step-title {
            font-size: 1.05em; color: #475569; margin-bottom: 12px;
            font-weight: bold; text-align: center; line-height: 1.45;
            max-width: 560px;
        }
        #step-feedback {
            margin-top: 6px; font-size: .95em; color: var(--text-muted);
            text-align: center; min-height: 1.3em;
        }
        #step-feedback.important { color: #b45309; font-weight: bold; }
        #step-feedback.error     { color: #dc2626; font-weight: bold; }
        #step-feedback.success   { color: var(--success); font-weight: bold; }

        /* Botó OK */
        .btn-submit-schema {
            background-color: #475569; color: white; border: none;
            padding: 12px 28px; font-size: 1em; font-weight: bold; border-radius: 6px;
            cursor: pointer; text-transform: uppercase; touch-action: manipulation; margin-top: 14px;
        }
        .btn-submit-schema:active { transform: scale(.95); }
        @media (hover:hover) { .btn-submit-schema:hover { background-color: #334155; } }
        .btn-submit-schema.error-shake { background-color: var(--danger); animation: shake .25s; }

        /* ── OVERLAY ─────────────────────────────────────────── */
        #mini-victory-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: auto;
            background: transparent; z-index: 100;
            justify-content: center; align-items: flex-end;
            padding: 0 20px 24px; pointer-events: none;
            border-radius: 0 0 8px 8px; border-top: none;
        }

        /* ── ALINEACIÓ SISTEMA (substitució, 3 files) ──────────── */
        .align-system {
            display: grid;
            grid-template-columns: 1fr 28px auto;
            gap: 10px 4px;
            align-items: center;
            justify-items: start;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.05em;
            margin: 0 auto;
            max-width: 100%;
        }
        .align-left  { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: flex-end; width: 100%; }
        .align-eq    { text-align: center; color: var(--text-muted); width: 28px; }
        .align-right { display: flex; align-items: center; gap: 4px; }

        /* ── RESPONSIU ───────────────────────────────────────── */
        @media (max-width: 480px) {
            .expression-box { font-size: 1.3em; padding: 18px 10px; min-height: 90px; }
            .schema-input-sm { width: 44px; height: 38px; font-size: .9em; }
        }
    </style>
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Sistemes d'equacions</h1>
</div>

<div class="panel" id="main-panel">

    <!-- ── PANTALLA DE SELECCIÓ ── -->
    <div id="selection-screen">
        <!-- El sistema es renderitza aquí abans que l'alumne triï el mètode -->
        <div class="expression-box" id="preview-expression-box"></div>
        <h2>Quin mètode vols fer servir?</h2>
        <div class="selection-cards">

            <button class="selection-card" onclick="selectRepte(1)">
                <div class="selection-text">
                    <h3>Mètode de substitució</h3>
                    <p>Aïlla una variable, substitueix i resol</p>
                </div>
            </button>

            <button class="selection-card" onclick="selectRepte(2)">
                <div class="selection-text">
                    <h3>Mètode de reducció</h3>
                    <p>Elimina una variable sumant les equacions</p>
                </div>
            </button>

            <button class="selection-card" onclick="selectRepte(3)">
                <div class="selection-text">
                    <h3>Mètode d'igualació</h3>
                    <p>Aïlla la mateixa variable a les dues equacions i iguala-les</p>
                </div>
            </button>

        </div>
    </div>

    <!-- ── PANTALLA DE JOC ── -->
    <div id="game-screen" style="display:none;">
        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display"></div>
                <div class="level-text"   id="lvl-display"></div>
            </div>
            <div class="score-text"    id="score-display">Punts: 0</div>
            <div id="attempts-display" class="attempts-counter" style="display:none;"></div>
        </div>

        <div class="expression-box" id="expression-box"></div>

        <div class="resolution-panel" id="resolution-panel">
            <div class="step-container" id="current-step">
                <div  class="step-title" id="step-title"></div>
                <div  class="schema-row" id="step-schema"></div>
                <div  id="step-btns"></div>
                <div  id="step-feedback"></div>
                <button class="btn-submit-schema" id="btn-submit-step" onclick="checkStep()">OK</button>
            </div>
        </div>
    </div>
    <!-- #mini-victory-overlay, #session-end-screen, #final-screen → injectats per injectSharedHTML() -->
</div>

<script src="js/game-core.js"></script>
<script>

// ================================================================
// PROJECTE: Motor Educatiu — Sistemes d'Equacions
// ================================================================
const els = {
    body:            document.body,
    selectionScreen: document.getElementById('selection-screen'),
    gameScreen:      document.getElementById('game-screen'),
    sessionDisplay:  document.getElementById('session-display'),
    lvlDisplay:      document.getElementById('lvl-display'),
    scoreDisplay:    document.getElementById('score-display'),
    attemptsDisplay: document.getElementById('attempts-display'),
    expressionBox:   document.getElementById('expression-box'),
    resolutionPanel: document.getElementById('resolution-panel'),
    currentStep:     document.getElementById('current-step'),
    stepTitle:       document.getElementById('step-title'),
    stepSchema:      document.getElementById('step-schema'),
    stepBtns:        document.getElementById('step-btns'),
    stepFeedback:    document.getElementById('step-feedback'),
    btnSubmitStep:   document.getElementById('btn-submit-step'),
};

// ================================================================
// ESTAT
// ================================================================
let selectedRepte  = 0;
let isPenalizing   = false;
let usedProblems   = new Set();
let previewProblem = null;   // problema generat a la pantalla de selecció
let currentProblem = null;
let currentSteps   = [];
let currentStepIdx = 0;
let selectedOption = null;

// ================================================================
// UTILITATS MATEMÀTIQUES
// ================================================================
// Parseja enters estrictes (inclou negatius, accepta coma)
function parseNum(s) {
    const clean = String(s).trim().replace(',', '.');
    if (!/^-?\d+(\.\d+)?$/.test(clean)) return NaN;
    return parseFloat(clean);
}

// Mostra un coeficient com a text per a una equació (ax + by = c)
// coef=1,var='x' → 'x' | coef=-1 → '-x' | coef=2 → '2x'
function fmtTerm(coef, varName, isFirst) {
    if (coef === 0) return '';
    const absC = Math.abs(coef);
    const sign = coef < 0 ? '−' : (isFirst ? '' : '+');
    const num  = absC === 1 ? '' : String(absC);
    return `${sign}${num}${varName}`;
}

// Retorna el text d'una equació ax + by = c
function eqText(a, b, c) {
    let s = a !== 0 ? fmtTerm(a, 'x', true) : '';
    if (b !== 0) {
        if (s === '') {
            s = fmtTerm(b, 'y', true);
        } else {
            const raw = fmtTerm(b, 'y', false);
            s += b < 0 ? ` − ${raw.slice(1)}` : ` + ${raw.slice(1)}`;
        }
    }
    if (s === '') s = '0';
    return c !== null ? `${s} = ${c}` : s;
}

// ================================================================
// RENDERITZACIÓ DE L'EXPRESSION BOX
// ================================================================
function mkSpan(html, cls) {
    const el = document.createElement('span');
    if (cls) el.className = cls;
    el.innerHTML = html;
    return el;
}

function clearExpr() { els.expressionBox.innerHTML = ''; }

// Construeix el DOM del sistema (clau + dues equacions) dins `container`
function renderSistemaTo(p, container) {
    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'sys-wrap';

    const brace = mkSpan('{', 'sys-brace');
    const eqsDiv = document.createElement('div');
    eqsDiv.className = 'sys-equations';

    const eq1 = document.createElement('div'); eq1.className = 'sys-row';
    eq1.innerHTML = eqText(p.a1, p.b1, p.c1) + `<span class="eq-label">(1a)</span>`;
    const eq2 = document.createElement('div'); eq2.className = 'sys-row';
    eq2.innerHTML = eqText(p.a2, p.b2, p.c2) + `<span class="eq-label">(2a)</span>`;

    eqsDiv.appendChild(eq1);
    eqsDiv.appendChild(eq2);
    wrap.appendChild(brace);
    wrap.appendChild(eqsDiv);
    container.appendChild(wrap);
}

// Renderitza el sistema a l'expression-box de la pantalla de joc
function renderSistema(p) { renderSistemaTo(p, els.expressionBox); }

// Afegeix una fila addicional a l'expression-box (per mostrar expressió aïllada, etc.)
function addExprRow(html, cls) {
    const row = document.createElement('div');
    row.className = 'sys-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    els.expressionBox.appendChild(row);
}

function showResult(html) {
    const row = document.createElement('div');
    row.className = 'sys-row';
    row.innerHTML = `<span class="expr-result">${html}</span>`;
    els.expressionBox.appendChild(row);
}

// ================================================================
// CONSTRUCTORS D'ESQUEMA
// ================================================================

// Esquema buit
function buildEmpty() {
    return (c) => { c.innerHTML = ''; };
}

// Botó de selecció amb auto-submit
function buildBtnSelect(options) {
    return (_c) => {
        selectedOption = null;
        const wrap = document.createElement('div'); wrap.className = 'schema-btns';
        options.forEach(opt => {
            const btn = document.createElement('button'); btn.className = 'schema-btn';
            btn.textContent = opt.label;
            btn.onclick = () => {
                wrap.querySelectorAll('.schema-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedOption = opt.value;
                if (!isTransitioning && !isPenalizing) checkStep();
            };
            wrap.appendChild(btn);
        });
        els.stepBtns.appendChild(wrap);
    };
}

// Construeix una schema-row amb múltiples inputs i text fix
// parts = array de strings (text) o objectes {id, width?} (inputs)
function buildSchemaRow(parts) {
    return (c) => {
        c.innerHTML = '';
        const row = document.createElement('div');
        row.className = 'schema-row-input';
        parts.forEach(part => {
            if (typeof part === 'string') {
                row.appendChild(mkSpan(part));
            } else {
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.className = 'schema-input-sm';
                inp.id = part.id;
                inp.autocomplete = 'off';
                if (part.width) inp.style.width = part.width + 'px';
                row.appendChild(inp);
            }
        });
        c.appendChild(row);
    };
}

// Helper: crea un input per a un coeficient signat.
// L'alumne escriu directament el valor (positiu o negatiu) sense cap botó.
// Retorna { inp, getSignedValue } — sense btn, per compatibilitat amb codi que
// els afegeix al DOM, btn és un fragment buit inert.
function mkSignedInput(id, width, _correctVal) {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'schema-input-sm';
    inp.id = id; inp.autocomplete = 'off';
    if (width) inp.style.width = width + 'px';

    inp._kbDirectTapBound = true;
    inp.addEventListener('pointerdown', e => {
        if (!isTouchDevice()) return;
        e.preventDefault();
        showCustomKeyboard(inp);
    });

    // btn és un fragment buit: el codi que fa row.appendChild(si.btn) no peta
    // però no afegeix cap element visible al DOM.
    const btn = document.createDocumentFragment();

    return { btn, inp, getSignedValue: () => parseNum(inp.value) };
}



// ── REPTE 1: Substitució ─────────────────────────────────────────
// Genera un sistema on una variable té coeficient 1 o -1 (fàcil d'aïllar)
// Solució (x0, y0) generada primer per garantir enters
function genRepte1(opIdx) {
    const x0 = randIntNonZero(-5, 5);
    const y0 = randIntNonZero(-5, 5);

    // Decidim quina equació i quina variable tindran coef ±1
    const isoEq  = pick([1, 2]);        // equació on aïllem (1a o 2a)
    const isoVar = pick(['x', 'y']);    // variable que aïllem

    // Coeficients de l'equació on aïllem: la variable aïllada té coef 1 o -1
    const isoCoef = pick([1, -1]);
    // L'altra variable té coef aleatori ≠ 0
    const otherCoef = randIntNonZero(-4, 4);

    // Construim les 4 coeficients segons quin és l'isoEq i isoVar
    let a1, b1, c1, a2, b2, c2;
    if (isoEq === 1 && isoVar === 'x') {
        a1 = isoCoef; b1 = otherCoef;
        c1 = a1 * x0 + b1 * y0;
        a2 = randIntNonZero(-4, 4); b2 = randIntNonZero(-4, 4);
        c2 = a2 * x0 + b2 * y0;
    } else if (isoEq === 1 && isoVar === 'y') {
        b1 = isoCoef; a1 = otherCoef;
        c1 = a1 * x0 + b1 * y0;
        a2 = randIntNonZero(-4, 4); b2 = randIntNonZero(-4, 4);
        c2 = a2 * x0 + b2 * y0;
    } else if (isoEq === 2 && isoVar === 'x') {
        a2 = isoCoef; b2 = otherCoef;
        c2 = a2 * x0 + b2 * y0;
        a1 = randIntNonZero(-4, 4); b1 = randIntNonZero(-4, 4);
        c1 = a1 * x0 + b1 * y0;
    } else {  // isoEq===2 && isoVar==='y'
        b2 = isoCoef; a2 = otherCoef;
        c2 = a2 * x0 + b2 * y0;
        a1 = randIntNonZero(-4, 4); b1 = randIntNonZero(-4, 4);
        c1 = a1 * x0 + b1 * y0;
    }

    return { type: 'subst', a1, b1, c1, a2, b2, c2, x0, y0, isoEq, isoVar, isoCoef, otherCoef };
}

// ── REPTE 2: Reducció ────────────────────────────────────────────
// Genera un sistema on una variable té coeficients oposats (elimina directament)
// o iguals (elimina restant). Opcionalment cal multiplicar per un factor petit.
function genRepte2(opIdx) {
    const x0 = randIntNonZero(-5, 5);
    const y0 = randIntNonZero(-5, 5);

    // Variable a eliminar
    const elimVar = pick(['x', 'y']);
    // Tipus: 'direct' (coefs oposats ja) o 'multiply' (cal multiplicar una equació)
    const tipus = opIdx === 0 ? 'direct' : pick(['direct', 'direct', 'multiply']);

    let a1, b1, c1, a2, b2, c2, factor = 1, elimEq = null;

    if (tipus === 'direct') {
        const coefElim = randIntNonZero(1, 4);
        if (elimVar === 'x') {
            a1 = coefElim; a2 = -coefElim;
            b1 = randIntNonZero(-4, 4); b2 = randIntNonZero(-4, 4);
        } else {
            b1 = coefElim; b2 = -coefElim;
            a1 = randIntNonZero(-4, 4); a2 = randIntNonZero(-4, 4);
        }
        c1 = a1 * x0 + b1 * y0;
        c2 = a2 * x0 + b2 * y0;
    } else {
        // 'multiply': una equació es multiplica per un factor (2 o 3) per oposar coefs
        factor = pick([2, 3]);
        elimEq = pick([1, 2]);  // equació que cal multiplicar
        const coefBase = randIntNonZero(1, 3);
        if (elimVar === 'x') {
            if (elimEq === 1) {
                a2 = coefBase * factor; a1 = -coefBase;
            } else {
                a1 = coefBase * factor; a2 = -coefBase;
            }
            b1 = randIntNonZero(-3, 3); b2 = randIntNonZero(-3, 3);
        } else {
            if (elimEq === 1) {
                b2 = coefBase * factor; b1 = -coefBase;
            } else {
                b1 = coefBase * factor; b2 = -coefBase;
            }
            a1 = randIntNonZero(-3, 3); a2 = randIntNonZero(-3, 3);
        }
        c1 = a1 * x0 + b1 * y0;
        c2 = a2 * x0 + b2 * y0;
    }

    return { type: 'reduc', a1, b1, c1, a2, b2, c2, x0, y0, elimVar, tipus, factor, elimEq };
}

// ── REPTE 3: Igualació ───────────────────────────────────────────
// Genera un sistema on la mateixa variable té coeficient ±1 a les dues equacions,
// cosa que permet aïllar-la sense fraccions i igualar les dues expressions.
function genRepte3(opIdx) {
    let a1, b1, c1, a2, b2, c2, isoVar, isoCoef1, isoCoef2, altCoef1, altCoef2;

    // Regenerem fins que el sistema sigui no degenerat (coefResult ≠ 0)
    let coefResult = 0;
    let tries = 0;
    do {
        const x0_ = randIntNonZero(-5, 5);
        const y0_ = randIntNonZero(-5, 5);

        isoVar   = pick(['x', 'y']);
        isoCoef1 = pick([1, -1]);
        isoCoef2 = pick([1, -1]);
        altCoef1 = randIntNonZero(-4, 4);
        altCoef2 = randIntNonZero(-4, 4);

        if (isoVar === 'x') {
            a1 = isoCoef1; b1 = altCoef1;
            a2 = isoCoef2; b2 = altCoef2;
        } else {
            a1 = altCoef1; b1 = isoCoef1;
            a2 = altCoef2; b2 = isoCoef2;
        }
        c1 = a1 * x0_ + b1 * y0_;
        c2 = a2 * x0_ + b2 * y0_;

        // coefResult = iso1CoefAlt - iso2CoefAlt
        //            = (-isoCoef1*altCoef1) - (-isoCoef2*altCoef2)
        coefResult = (-isoCoef1 * altCoef1) - (-isoCoef2 * altCoef2);

        // Aprofitem les coordenades generades si el sistema és vàlid
        if (coefResult !== 0) {
            return { type: 'igual', a1, b1, c1, a2, b2, c2,
                     x0: x0_, y0: y0_,
                     isoVar, isoCoef1, isoCoef2, altCoef1, altCoef2 };
        }
        tries++;
    } while (tries < 50);

    // Fallback segur (molt improbable arribar aquí)
    return genRepte3(opIdx);
}

// ================================================================
// CONSTRUCTORS DE PASSOS
// ================================================================

// Helper: formata un coeficient com a signe+nombre per a expressions aïllades
// Ex: coef=2,var='x' → '2x' | coef=-1 → '−x' | coef=3 → '3x'
function fmtIso(coef, varName) {
    if (coef === 0) return '0';
    const abs = Math.abs(coef);
    const sign = coef < 0 ? '−' : '';
    const num  = abs === 1 ? '' : String(abs);
    return `${sign}${num}${varName}`;
}

// ── Repte 1: Substitució ─────────────────────────────────────────
function buildStepsRepte1(p) {
    const steps = [];

    // ── Helpers: quines equacions/variables admet el sistema ─────
    // Retorna el coeficient de la variable v a l'equació eqN
    function coefOf(eqN, v) {
        return v === 'x' ? (eqN === 1 ? p.a1 : p.a2)
                         : (eqN === 1 ? p.b1 : p.b2);
    }
    // Una equació/variable és aïllable si té coeficient ±1
    function canIso(eqN, v)  { return Math.abs(coefOf(eqN, v)) === 1; }
    // Equacions que tenen almenys una variable aïllable
    function validEqs()      { return [1, 2].filter(n => canIso(n, 'x') || canIso(n, 'y')); }

    // ── Eleccions reals de l'alumne (s'omplen als onCorrect 1 i 2) ─
    let chosenEq  = null;   // 1 o 2
    let chosenVar = null;   // 'x' o 'y'

    // ── Càlcul diferit: tots els valors derivats de l'elecció real ─
    // Cridat DINS de buildSchema/validate (quan chosenEq i chosenVar ja estan fixats)
    function isoData() {
        const varAil    = chosenVar;
        const varAltra  = varAil === 'x' ? 'y' : 'x';
        const coefIso   = coefOf(chosenEq, varAil);
        const coefOther = varAil === 'x'
            ? (chosenEq === 1 ? p.b1 : p.b2)
            : (chosenEq === 1 ? p.a1 : p.a2);
        const cEq        = chosenEq === 1 ? p.c1 : p.c2;

        // varAil = isoCoefVar·varAltra + isoConst  (coefIso = ±1 garantit)
        const isoCoefVar = -coefOther / coefIso;
        const isoConst   = cEq / coefIso;

        // Substituïm a l'altra equació
        const subEq = chosenEq === 1 ? 2 : 1;
        const aS    = subEq === 1 ? p.a1 : p.a2;
        const bS    = subEq === 1 ? p.b1 : p.b2;
        const cS    = subEq === 1 ? p.c1 : p.c2;

        let coefResultat, constResultat, varResultat;
        if (varAil === 'y') {
            coefResultat  = aS + bS * isoCoefVar;
            constResultat = cS - bS * isoConst;
            varResultat   = 'x';
        } else {
            coefResultat  = bS + aS * isoCoefVar;
            constResultat = cS - aS * isoConst;
            varResultat   = 'y';
        }

        // Expansió del parèntesi: coefSubstit·(isoCoefVar·varAltra + isoConst)
        const coefSubstit   = varAil === 'x' ? aS : bS;
        const expandedCoef  = coefSubstit * isoCoefVar;
        const expandedConst = coefSubstit * isoConst;

        return {
            varAil, varAltra, isoCoefVar, isoConst,
            coefResultat, constResultat, varResultat,
            solResultat: constResultat / coefResultat,
            solAilada:   varAil === 'x' ? p.x0 : p.y0,
            subEq, aS, bS, cS, coefSubstit, expandedCoef, expandedConst,
        };
    }

    // Text de l'expressió aïllada: p.ex. "2x − 3" o "−y + 1"
    function isoExprText(d) {
        let s = '';
        if (d.isoCoefVar !== 0) {
            const ac   = Math.abs(d.isoCoefVar);
            const sign = d.isoCoefVar < 0 ? '−' : '';
            s += `${sign}${ac === 1 ? '' : ac}${d.varAltra}`;
        }
        if (d.isoConst !== 0) {
            s += s === '' ? String(d.isoConst)
                          : (d.isoConst < 0 ? ` − ${Math.abs(d.isoConst)}` : ` + ${d.isoConst}`);
        }
        return s || '0';
    }

    // PAS 1 — Triar equació (botó) — AUTO-SUBMIT
    // Accepta qualsevol equació que tingui almenys una variable aïllable (coef ±1)
    steps.push({
        title: `De quina equació aïlles una variable?`,
        buildSchema: buildEmpty(),
        hideBtnOk: true,
        buildBtns: buildBtnSelect([
            { label: '1a equació', value: '1' },
            { label: '2a equació', value: '2' },
        ]),
        validate:  () => validEqs().includes(Number(selectedOption)),
        onCorrect: () => { chosenEq = Number(selectedOption); },
    });

    // PAS 2 — Triar variable (botó) — AUTO-SUBMIT
    // Accepta qualsevol variable amb coef ±1 a l'equació triada
    steps.push({
        title: `Quina variable aïlles?`,
        buildSchema: buildEmpty(),
        hideBtnOk: true,
        buildBtns: buildBtnSelect([
            { label: 'x', value: 'x' },
            { label: 'y', value: 'y' },
        ]),
        validate: () => {
            if (canIso(chosenEq, selectedOption)) return true;
            // La variable triada no és aïllable directament: escrivim el feedback
            // i retornem false sense activar flashError (soft warning)
            if (els.stepFeedback) {
                els.stepFeedback.innerHTML = 'La variable que intentes aïllar no té coeficient 1 ni −1.<br>Escull l\'altra variable, que podràs aïllar sense fer ús de fraccions.';
                els.stepFeedback.className = 'important';
            }
            return false;
        },
        onCorrect: () => { chosenVar = selectedOption; },
    });

    // PAS 3 — Escriure l'expressió aïllada (valors calculats a partir de l'elecció real)
    steps.push({
        title: () => {
            const d = isoData();
            return `Aïlla ${d.varAil} a la ${chosenEq === 1 ? 'primera' : 'segona'} equació:`;
        },
        buildSchema: (c) => {
            c.innerHTML = '';
            const d   = isoData();
            const row = document.createElement('div');
            row.className = 'schema-row-input';
            row.appendChild(mkSpan(`${d.varAil} =`));
            const siC = mkSignedInput('iso-coef',  52, d.isoCoefVar);
            row.appendChild(siC.btn);
            row.appendChild(siC.inp);
            row.appendChild(mkSpan(d.varAltra));
            const siK = mkSignedInput('iso-const', 52, d.isoConst);
            row.appendChild(siK.btn);
            row.appendChild(siK.inp);
            c._getVC = siC.getSignedValue;
            c._getVK = siK.getSignedValue;
            c.appendChild(row);
        },
        validate: () => {
            const d  = isoData();
            const vc = els.stepSchema._getVC?.();
            const vk = els.stepSchema._getVK?.();
            if (isNaN(vc) || isNaN(vk)) return false;
            return vc === d.isoCoefVar && vk === d.isoConst;
        },
        onCorrect: () => {
            const d = isoData();
            addExprRow(`${d.varAil} = ${isoExprText(d)}`, 'sys-isolated');
        },
    });

    // ── Getters de tots els inputs signats del pas de substitució ──
    // (Declarat aquí per estar disponible tant a buildSchema com a validate)
    let subGetters = {};

    // PAS 4 — 4 files alineades: equació original → substitució → expansió → resultat
    steps.push({
        title: () => {
            const d    = isoData();
            const nEq  = d.subEq === 1 ? '1a' : '2a';
            return `Substitueix a la ${nEq} equació:`;
        },
        buildSchema: (c) => {
            c.innerHTML = '';
            const d = isoData();

            // ── helpers ───────────────────────────────────────────
            const otherCoef = d.varAil === 'x' ? d.bS : d.aS;
            const absCS     = Math.abs(d.coefSubstit);
            const dotPart   = absCS === 1 ? '' : `${absCS}·`;

            // Prefix davant el parèntesi de substitució (fila 2)
            // Exemples: '−x + 2·(' | '−x + (' | '−x − 2·(' | '2·(' | '('
            function prefixRow2() {
                if (otherCoef !== 0) {
                    const absO = Math.abs(otherCoef);
                    const sO   = otherCoef < 0 ? '−' : '';
                    const nO   = absO === 1 ? '' : String(absO);
                    const otherStr = `${sO}${nO}${d.varAltra}`;
                    const join  = d.coefSubstit < 0 ? ' − ' : ' + ';
                    return `${otherStr}${join}${dotPart}`;
                } else {
                    return (d.coefSubstit < 0 ? '−' : '') + dotPart;
                }
            }

            // Prefix davant el parèntesi d'expansió (fila 3): otherTerm + ' + ('
            // (els valors expandits porten el signe incorporat als inputs)
            function prefixRow3() {
                if (otherCoef !== 0) {
                    const absO = Math.abs(otherCoef);
                    const sO   = otherCoef < 0 ? '−' : '';
                    const nO   = absO === 1 ? '' : String(absO);
                    return `${sO}${nO}${d.varAltra} + `;
                }
                return '';
            }

            // Sufix darrere el parèntesi (varAil='x': + otherTerm al final)
            function suffixRows() {
                if (d.varAil === 'x' && otherCoef !== 0) {
                    const absO = Math.abs(otherCoef);
                    const join = otherCoef < 0 ? ' − ' : ' + ';
                    const nO   = absO === 1 ? '' : String(absO);
                    return `${join}${nO}${d.varAltra}`;
                }
                return '';
            }

            // Construeix una cel·la esquerra amb inputs dins parèntesi
            function mkRowLeft(prefix, inpA, inpB, suffix) {
                const div = document.createElement('div');
                div.className = 'align-left';
                div.appendChild(mkSpan(prefix + '('));
                div.appendChild(inpA);
                div.appendChild(mkSpan(d.varAltra));
                div.appendChild(inpB);
                div.appendChild(mkSpan(')' + suffix));
                return div;
            }

            const grid = document.createElement('div');
            grid.className = 'align-system';

            // ── Fila 1: equació original (text fix) ──────────────
            const r1l = document.createElement('div'); r1l.className = 'align-left';
            r1l.appendChild(mkSpan(eqText(d.aS, d.bS, null)));

            // ── Fila 2: substitució — [isoCoefVar] varAltra [isoConst] ──
            const s1C = mkSignedInput('sub-coef',  52, d.isoCoefVar);
            const s1K = mkSignedInput('sub-const', 52, d.isoConst);
            const r2l = mkRowLeft(prefixRow2(), s1C.inp, s1K.inp, suffixRows());

            // ── Fila 3: expansió — [expandedCoef] varAltra [expandedConst] ──
            const s2C = mkSignedInput('exp-coef',  52, d.expandedCoef);
            const s2K = mkSignedInput('exp-const', 52, d.expandedConst);
            const r3l = mkRowLeft(prefixRow3(), s2C.inp, s2K.inp, suffixRows());

            // ── Fila 4: varResultat = [inp] ──────────────────────
            const r4l = document.createElement('div'); r4l.className = 'align-left';
            r4l.appendChild(mkSpan(d.varResultat));
            const inp4 = document.createElement('input');
            inp4.type = 'text'; inp4.className = 'schema-input-sm';
            inp4.id = 'sol-res'; inp4.autocomplete = 'off';
            inp4.style.width = '60px';
            inp4._kbDirectTapBound = true;
            inp4.addEventListener('pointerdown', e => {
                if (!isTouchDevice()) return;
                e.preventDefault();
                showCustomKeyboard(inp4);
            });
            const r4r = document.createElement('div'); r4r.className = 'align-right';
            r4r.appendChild(inp4);

            // ── Assemblar al grid ─────────────────────────────────
            const cS_str = String(d.cS);
            [
                r1l, mkSpan('=', 'align-eq'), mkSpan(cS_str, 'align-right'),
                r2l, mkSpan('=', 'align-eq'), mkSpan(cS_str, 'align-right'),
                r3l, mkSpan('=', 'align-eq'), mkSpan(cS_str, 'align-right'),
                r4l, mkSpan('=', 'align-eq'), r4r,
            ].forEach(el => grid.appendChild(el));

            c.appendChild(grid);

            subGetters = {
                subCoef:  s1C.getSignedValue,
                subConst: s1K.getSignedValue,
                expCoef:  s2C.getSignedValue,
                expConst: s2K.getSignedValue,
            };
        },

        validate: () => {
            const d = isoData();
            const checks = [
                { id: 'sub-coef',  expected: d.isoCoefVar,    getter: () => subGetters.subCoef?.()  },
                { id: 'sub-const', expected: d.isoConst,      getter: () => subGetters.subConst?.() },
                { id: 'exp-coef',  expected: d.expandedCoef,  getter: () => subGetters.expCoef?.()  },
                { id: 'exp-const', expected: d.expandedConst, getter: () => subGetters.expConst?.() },
                { id: 'sol-res',   expected: d.solResultat,   getter: () => parseNum(document.getElementById('sol-res')?.value ?? '') },
            ];

            let allOk = true;
            for (const ch of checks) {
                const el = document.getElementById(ch.id);
                if (!el || el.readOnly) continue;
                const val = ch.getter();
                if (!isNaN(val) && val === ch.expected) {
                    el.classList.add('locked-green');
                    el.readOnly = true;
                } else {
                    allOk = false;
                    el.classList.add('error-flash');
                    setTimeout(() => { el.classList.remove('error-flash'); el.value = ''; }, 350);
                }
            }

            if (!allOk) {
                if (els.stepFeedback) {
                    els.stepFeedback.innerHTML = 'Algun valor és incorrecte. Revisa els camps en vermell.';
                    els.stepFeedback.className = 'important';
                }
                setTimeout(() => {
                    const first = els.stepSchema.querySelector('input:not([readonly])');
                    if (first) {
                        if (isTouchDevice()) showCustomKeyboard(first);
                        else first.focus();
                    }
                }, 400);
                return false;
            }
            return true;
        },

        onCorrect: () => {
            const d = isoData();
            addExprRow(`${d.varResultat} = <span class="expr-result">${d.solResultat}</span>`);
        },
    });


            // PAS 6 — Valor de varAil (substitució enrere)
    steps.push({
        title: () => {
            const d = isoData();
            return `Substitueix ${d.varResultat} = ${d.solResultat} a l'expressió aïllada. Quant val ${d.varAil}?`;
        },
        buildSchema: (c) => {
            const d = isoData();
            buildSchemaRow([`${d.varAil} =`, { id: 'sol-var2', width: 60 }])(c);
        },
        validate: () => {
            const d = isoData();
            const v = parseNum(document.getElementById('sol-var2')?.value ?? '');
            return !isNaN(v) && v === d.solAilada;
        },
        onCorrect: () => {
            const d = isoData();
            addExprRow(`${d.varAil} = <span class="expr-result">${d.solAilada}</span>`);
        },
    });

    // PAS 7 — Verificació
    steps.push({
        title: `Verifica la solució a la 1a equació:`,
        buildSchema: (c) => {
            buildSchemaRow([eqText(p.a1, p.b1, null) + ' =', { id: 'verif-1', width: 60 }])(c);
        },
        validate: () => {
            const v = parseNum(document.getElementById('verif-1')?.value ?? '');
            return !isNaN(v) && v === p.c1;
        },
        onCorrect: () => {
            showResult(`Solució: x = ${p.x0}, y = ${p.y0} ✓`);
        },
    });

    return steps;
}

// ── Repte 2: Reducció ────────────────────────────────────────────
function buildStepsRepte2(p) {
    const steps = [];
    const elimVar = p.elimVar;
    const altaVar = elimVar === 'x' ? 'y' : 'x';

    // Coeficients de la variable a eliminar
    const coefE1 = elimVar === 'x' ? p.a1 : p.b1;
    const coefE2 = elimVar === 'x' ? p.a2 : p.b2;

    // Coeficients de l'altra variable
    const coefA1 = elimVar === 'x' ? p.b1 : p.a1;
    const coefA2 = elimVar === 'x' ? p.b2 : p.a2;

    // Resultat de la suma de les dues equacions (eliminant la variable)
    const coefAlt  = coefA1 + coefA2;  // coeficient de l'altra variable
    const cSum     = p.c1 + p.c2;      // terme independent de la suma

    // Solució de la variable eliminada (per substitució enrere)
    const solElim  = elimVar === 'x' ? p.x0 : p.y0;
    const solAltra = elimVar === 'x' ? p.y0 : p.x0;

    // PAS 1 — Quina variable s'elimina?
    steps.push({
        title: `Quina variable pots eliminar sumant les dues equacions?`,
        buildSchema: buildEmpty(),
        hideBtnOk: true,
        buildBtns: buildBtnSelect([
            { label: 'x', value: 'x' },
            { label: 'y', value: 'y' },
        ]),
        validate: () => selectedOption === elimVar,
    });

    // PAS 2 — Si cal multiplicar, indica el factor i l'equació (cas 'multiply')
    if (p.tipus === 'multiply') {
        steps.push({
            title: `Per quant multipliques la ${p.elimEq === 1 ? 'primera' : 'segona'} equació?`,
            buildSchema: buildSchemaRow([
                `Equació ${p.elimEq}a ×`,
                { id: 'mul-factor', width: 52 },
            ]),
            validate: () => {
                const v = parseNum(document.getElementById('mul-factor')?.value ?? '');
                return !isNaN(v) && v === p.factor;
            },
        });
    }

    // PAS 3 — Resultat de la suma: [±coefAlt]·altaVar = [±cSum]
    steps.push({
        title: `Suma les dues equacions. Quina equació obtens?`,
        buildSchema: (c) => {
            c.innerHTML = '';
            const row = document.createElement('div');
            row.className = 'schema-row-input';
            const siC = mkSignedInput('sum-coef',  52, coefAlt);
            const siK = mkSignedInput('sum-const', 52, cSum);
            row.appendChild(siC.btn); row.appendChild(siC.inp);
            row.appendChild(mkSpan(`${altaVar} =`));
            row.appendChild(siK.btn); row.appendChild(siK.inp);
            c._getVC = siC.getSignedValue;
            c._getVK = siK.getSignedValue;
            c.appendChild(row);
        },
        validate: () => {
            const vc = els.stepSchema._getVC?.();
            const vk = els.stepSchema._getVK?.();
            if (isNaN(vc) || isNaN(vk)) return false;
            return vc === coefAlt && vk === cSum;
        },
    });

    // PAS 4 — Valor de l'altra variable
    steps.push({
        title: `Quant val ${altaVar}?`,
        buildSchema: buildSchemaRow([
            `${altaVar} =`,
            { id: 'sol-alt', width: 60 },
        ]),
        validate: () => {
            const v = parseNum(document.getElementById('sol-alt')?.value ?? '');
            return !isNaN(v) && v === solAltra;
        },
        onCorrect: () => {
            addExprRow(`${altaVar} = <span class="expr-result">${solAltra}</span>`);
        },
    });

    // PAS 5 — Substitució per trobar la variable eliminada
    steps.push({
        title: `Substitueix ${altaVar} = ${solAltra} a la 1a equació. Quant val ${elimVar}?`,
        buildSchema: buildSchemaRow([
            `${elimVar} =`,
            { id: 'sol-elim', width: 60 },
        ]),
        validate: () => {
            const v = parseNum(document.getElementById('sol-elim')?.value ?? '');
            return !isNaN(v) && v === solElim;
        },
        onCorrect: () => {
            addExprRow(`${elimVar} = <span class="expr-result">${solElim}</span>`);
            showResult(`Solució: x = ${p.x0}, y = ${p.y0} ✓`);
        },
    });

    return steps;
}

// ── Repte 3: Igualació ────────────────────────────────────────────
function buildStepsRepte3(p) {
    const steps = [];

    // ── Helpers ─────────────────────────────────────────────────
    // Comprova si la variable v té coef ±1 a les dues equacions (aïllable sense fraccions)
    function canIgual(v) {
        const c1 = v === 'x' ? p.a1 : p.b1;
        const c2 = v === 'x' ? p.a2 : p.b2;
        return Math.abs(c1) === 1 && Math.abs(c2) === 1;
    }

    let chosenVar = null;   // definit a l'onCorrect del pas 1

    // Tots els valors derivats calculats diferidament (quan chosenVar ja és conegut)
    function igualData() {
        const varIso = chosenVar;
        const varAlt = varIso === 'x' ? 'y' : 'x';

        const isoC1 = varIso === 'x' ? p.a1 : p.b1;   // coef de varIso a eq1
        const altC1 = varIso === 'x' ? p.b1 : p.a1;   // coef de varAlt a eq1
        const isoC2 = varIso === 'x' ? p.a2 : p.b2;
        const altC2 = varIso === 'x' ? p.b2 : p.a2;

        // Aïllament de varIso:
        //   isoC1·varIso + altC1·varAlt = c1
        //   varIso = (c1 − altC1·varAlt) / isoC1
        //          = isoC1·c1 + (−isoC1·altC1)·varAlt   [ja que 1/isoC1 = isoC1 per a ±1]
        const iso1CoefAlt = -isoC1 * altC1;
        const iso1Const   =  isoC1 * p.c1;

        const iso2CoefAlt = -isoC2 * altC2;
        const iso2Const   =  isoC2 * p.c2;

        // Igualació: iso1CoefAlt·varAlt + iso1Const = iso2CoefAlt·varAlt + iso2Const
        //   → (iso1CoefAlt − iso2CoefAlt)·varAlt = iso2Const − iso1Const
        const coefResult  = iso1CoefAlt - iso2CoefAlt;
        const constResult = iso2Const   - iso1Const;

        const solAlt = varIso === 'x' ? p.y0 : p.x0;
        const solIso = varIso === 'x' ? p.x0 : p.y0;

        return { varIso, varAlt, iso1CoefAlt, iso1Const, iso2CoefAlt, iso2Const,
                 coefResult, constResult, solAlt, solIso };
    }

    // Formata l'expressió aïllada com a text: ex. "−2y + 8" o "3y − 7"
    function exprText(coefAlt, varAlt, constVal) {
        let s = '';
        if (coefAlt !== 0) {
            const ac   = Math.abs(coefAlt);
            const sign = coefAlt < 0 ? '−' : '';
            s += `${sign}${ac === 1 ? '' : ac}${varAlt}`;
        }
        if (constVal !== 0) {
            s += s === '' ? String(constVal)
                          : (constVal < 0 ? ` − ${Math.abs(constVal)}` : ` + ${constVal}`);
        }
        return s || '0';
    }

    // PAS 1 — Triar variable a aïllar (botó) — AUTO-SUBMIT
    steps.push({
        title: `Quina variable aïllaràs a les dues equacions?`,
        buildSchema: buildEmpty(),
        hideBtnOk: true,
        buildBtns: buildBtnSelect([
            { label: 'x', value: 'x' },
            { label: 'y', value: 'y' },
        ]),
        validate: () => {
            if (canIgual(selectedOption)) return true;
            if (els.stepFeedback) {
                els.stepFeedback.innerHTML =
                    'Aquesta variable no té coeficient 1 ni −1 a les dues equacions.<br>' +
                    'Tria l\'altra variable per poder aïllar-la sense fraccions.';
                els.stepFeedback.className = 'important';
            }
            return false;
        },
        onCorrect: () => { chosenVar = selectedOption; },
    });

    // PAS 2 — Aïlla varIso de la 1a equació
    steps.push({
        title: () => {
            const d = igualData();
            return `Aïlla ${d.varIso} a la <strong>primera</strong> equació:`;
        },
        buildSchema: (c) => {
            c.innerHTML = '';
            const d   = igualData();
            const row = document.createElement('div');
            row.className = 'schema-row-input';
            row.appendChild(mkSpan(`${d.varIso} =`));
            const siC = mkSignedInput('iso1-coef',  52, d.iso1CoefAlt);
            row.appendChild(siC.btn); row.appendChild(siC.inp);
            row.appendChild(mkSpan(d.varAlt));
            const siK = mkSignedInput('iso1-const', 52, d.iso1Const);
            row.appendChild(siK.btn); row.appendChild(siK.inp);
            c._getVC = siC.getSignedValue;
            c._getVK = siK.getSignedValue;
            c.appendChild(row);
        },
        validate: () => {
            const d  = igualData();
            const vc = els.stepSchema._getVC?.();
            const vk = els.stepSchema._getVK?.();
            if (isNaN(vc) || isNaN(vk)) return false;
            return vc === d.iso1CoefAlt && vk === d.iso1Const;
        },
        onCorrect: () => {
            const d = igualData();
            addExprRow(
                `${d.varIso} = ${exprText(d.iso1CoefAlt, d.varAlt, d.iso1Const)}` +
                `<span class="eq-label">(1a)</span>`,
                'sys-isolated'
            );
        },
    });

    // PAS 3 — Aïlla varIso de la 2a equació
    steps.push({
        title: () => {
            const d = igualData();
            return `Aïlla ${d.varIso} a la <strong>segona</strong> equació:`;
        },
        buildSchema: (c) => {
            c.innerHTML = '';
            const d   = igualData();
            const row = document.createElement('div');
            row.className = 'schema-row-input';
            row.appendChild(mkSpan(`${d.varIso} =`));
            const siC = mkSignedInput('iso2-coef',  52, d.iso2CoefAlt);
            row.appendChild(siC.btn); row.appendChild(siC.inp);
            row.appendChild(mkSpan(d.varAlt));
            const siK = mkSignedInput('iso2-const', 52, d.iso2Const);
            row.appendChild(siK.btn); row.appendChild(siK.inp);
            c._getVC = siC.getSignedValue;
            c._getVK = siK.getSignedValue;
            c.appendChild(row);
        },
        validate: () => {
            const d  = igualData();
            const vc = els.stepSchema._getVC?.();
            const vk = els.stepSchema._getVK?.();
            if (isNaN(vc) || isNaN(vk)) return false;
            return vc === d.iso2CoefAlt && vk === d.iso2Const;
        },
        onCorrect: () => {
            const d = igualData();
            addExprRow(
                `${d.varIso} = ${exprText(d.iso2CoefAlt, d.varAlt, d.iso2Const)}` +
                `<span class="eq-label">(2a)</span>`,
                'sys-isolated'
            );
        },
    });

    // PAS 4 — Equació resultant d'igualar les dues expressions
    steps.push({
        title: () => {
            const d = igualData();
            return `Igualem les dues expressions de ${d.varIso}. Quina equació en ${d.varAlt} obtens?`;
        },
        buildSchema: (c) => {
            c.innerHTML = '';
            const d   = igualData();
            const row = document.createElement('div');
            row.className = 'schema-row-input';
            const siC = mkSignedInput('eq-coef',  52, d.coefResult);
            const siK = mkSignedInput('eq-const', 52, d.constResult);
            row.appendChild(siC.btn); row.appendChild(siC.inp);
            row.appendChild(mkSpan(`${d.varAlt} =`));
            row.appendChild(siK.btn); row.appendChild(siK.inp);
            c._getVC = siC.getSignedValue;
            c._getVK = siK.getSignedValue;
            c.appendChild(row);
        },
        validate: () => {
            const d  = igualData();
            const vc = els.stepSchema._getVC?.();
            const vk = els.stepSchema._getVK?.();
            if (isNaN(vc) || isNaN(vk)) return false;
            return vc === d.coefResult && vk === d.constResult;
        },
    });

    // PAS 5 — Valor de varAlt
    steps.push({
        title: () => `Quant val ${igualData().varAlt}?`,
        buildSchema: (c) => {
            const d = igualData();
            buildSchemaRow([`${d.varAlt} =`, { id: 'sol-alt', width: 60 }])(c);
        },
        validate: () => {
            const d = igualData();
            const v = parseNum(document.getElementById('sol-alt')?.value ?? '');
            return !isNaN(v) && v === d.solAlt;
        },
        onCorrect: () => {
            const d = igualData();
            addExprRow(`${d.varAlt} = <span class="expr-result">${d.solAlt}</span>`);
        },
    });

    // PAS 6 — Valor de varIso (substitució enrere a la 1a expressió aïllada)
    steps.push({
        title: () => {
            const d = igualData();
            return `Substitueix ${d.varAlt} = ${d.solAlt} a la primera expressió aïllada. Quant val ${d.varIso}?`;
        },
        buildSchema: (c) => {
            const d = igualData();
            buildSchemaRow([`${d.varIso} =`, { id: 'sol-iso', width: 60 }])(c);
        },
        validate: () => {
            const d = igualData();
            const v = parseNum(document.getElementById('sol-iso')?.value ?? '');
            return !isNaN(v) && v === d.solIso;
        },
        onCorrect: () => {
            const d = igualData();
            addExprRow(`${d.varIso} = <span class="expr-result">${d.solIso}</span>`);
        },
    });

    // PAS 7 — Verificació a la 1a equació
    steps.push({
        title: `Verifica la solució a la 1a equació:`,
        buildSchema: (c) => {
            buildSchemaRow([eqText(p.a1, p.b1, null) + ' =', { id: 'verif-1', width: 60 }])(c);
        },
        validate: () => {
            const v = parseNum(document.getElementById('verif-1')?.value ?? '');
            return !isNaN(v) && v === p.c1;
        },
        onCorrect: () => {
            showResult(`Solució: x = ${p.x0}, y = ${p.y0} ✓`);
        },
    });

    return steps;
}

function showCurrentStep() {
    const step = currentSteps[currentStepIdx];

    if (els.stepFeedback) {
        els.stepFeedback.innerText = '';
        els.stepFeedback.className = '';
    }

    els.stepTitle.innerHTML = typeof step.title === 'function' ? step.title() : step.title;

    // Schema normal (no hi ha appendToExpr en sistemes — tots els inputs van a la schema-row)
    els.stepSchema.style.display = '';
    els.stepBtns.innerHTML = '';
    step.buildSchema(els.stepSchema);

    if (step.buildBtns) step.buildBtns(els.stepBtns);

    // Amaga botó OK en passos de botons (auto-submit)
    els.btnSubmitStep.style.display = step.hideBtnOk ? 'none' : '';

    els.currentStep.classList.add('active');
    els.resolutionPanel.style.display = 'flex';

    // Focus al primer input editable
    setTimeout(() => {
        const first = els.stepSchema.querySelector('input:not([readonly])');
        if (first) {
            if (isTouchDevice()) { showCustomKeyboard(first); } else { first.focus(); }
        }
    }, 120);
}

function flashError() {
    els.stepSchema.querySelectorAll('input').forEach(inp => {
        inp.classList.add('error-flash');
        setTimeout(() => inp.classList.remove('error-flash'), 300);
    });
    els.stepBtns.querySelectorAll('.schema-btn.selected').forEach(btn => {
        btn.classList.add('error-flash');
        setTimeout(() => btn.classList.remove('error-flash'), 300);
    });
    els.btnSubmitStep.classList.add('error-shake');
    setTimeout(() => els.btnSubmitStep.classList.remove('error-shake'), 300);
}

function clearAndFocus() {
    const allInputs = [...els.stepSchema.querySelectorAll('input')];
    allInputs.forEach(inp => {
        if (!inp.readOnly) {
            inp.value = '';
            inp.style.color = ''; inp.style.borderColor = '';
            inp.style.background = ''; inp.style.fontWeight = '';
        }
    });
    const first = allInputs.find(i => !i.readOnly) || null;
    if (first) {
        if (isTouchDevice()) { kbMarkForOverwrite(first); showCustomKeyboard(first); }
        else { first.focus(); }
    }
    els.stepBtns.querySelectorAll('.schema-btn').forEach(b => b.classList.remove('selected'));
    selectedOption = null;
}

function checkStep() {
    if (isTransitioning || isPenalizing) return;

    const step = currentSteps[currentStepIdx];

    if (els.stepFeedback) {
        els.stepFeedback.innerText = '';
        els.stepFeedback.className = '';
    }
    const res = step.validate();

    if (res !== true) {
        // Soft warning (validate ha escrit feedback manualment): no penalitzar
        const hasSoftWarning = els.stepFeedback && els.stepFeedback.innerText !== '';
        if (!hasSoftWarning) {
            flashError();
            clearAndFocus();
        }
        return;
    }

    if (step.onCorrect) step.onCorrect();
    currentStepIdx++;

    if (currentStepIdx >= currentSteps.length) {
        finalizeProblem();
    } else {
        setTimeout(() => showCurrentStep(), step.onCorrect ? 600 : 0);
    }
}

// ================================================================
// SOLUCIÓ CORRECTA QUAN S'ESGOTEN ELS INTENTS
// ================================================================
function showCorrectAnswer(p) {
    renderSistema(p);
    showResult(`Solució: x = ${p.x0}, y = ${p.y0}`);
}

// ================================================================
// PENALITZACIÓ
// ================================================================
function penalize() {
    // Intents desactivats en aquesta activitat — no s'usa
}

function finalizeProblem(forcedPoints) {
    if (forcedPoints === undefined) forcedPoints = null;
    isTransitioning = true;
    hideCustomKeyboard();
    els.currentStep.classList.remove('active');
    els.resolutionPanel.style.display = 'none';

    const pts = forcedPoints !== null ? forcedPoints : 10;

    if (pts === 0) showCorrectAnswer(currentProblem);

    sessionScore += pts;
    els.scoreDisplay.innerText = `Punts: ${sessionScore}`;

    const waitTime = showMiniOverlay(pts);
    setTimeout(() => {
        hideMiniOverlay();
        if (currentOperation + 1 >= TOTAL_OPERATIONS) {
            endSession();
        } else {
            currentOperation++;
            buildLevel();
        }
    }, waitTime);
}

// ================================================================
// SELECCIÓ DE REPTE I FLUX DE JOC
// ================================================================
function selectRepte(n) {
    selectedRepte = n;
    startGame();
}

function updateUI() {
    els.sessionDisplay.innerText = `Sessió ${currentSession + 1} de ${TOTAL_SESSIONS}`;
    els.lvlDisplay.innerText     = `Exercici ${currentOperation + 1} de ${TOTAL_OPERATIONS}`;
    els.scoreDisplay.innerText   = `Punts: ${sessionScore}`;
    if (els.attemptsDisplay) {
        els.attemptsDisplay.innerText = '';
    }
}

function buildLevel() {
    let p, key;
    // Si és el primer exercici de la primera sessió i hi ha un problema de preview,
    // el reutilitzem perquè l'alumne vegi el sistema que ja coneixia.
    if (currentOperation === 0 && currentSession === 0 && previewProblem) {
        p = previewProblem;
        previewProblem = null;   // consumit: els exercicis següents es generen normalment
    } else {
        let tries = 0;
        do {
            p = selectedRepte === 1 ? genRepte1(currentOperation)
              : selectedRepte === 2 ? genRepte2(currentOperation)
              :                       genRepte3(currentOperation);
            key = JSON.stringify({ t: p.type, x: p.x0, y: p.y0, a1: p.a1, b1: p.b1 });
            tries++;
        } while (usedProblems.has(key) && tries < 30);
    }
    key = JSON.stringify({ t: p.type, x: p.x0, y: p.y0, a1: p.a1, b1: p.b1 });
    usedProblems.add(key);
    currentProblem = p;

    renderSistema(p);

    currentSteps = selectedRepte === 1 ? buildStepsRepte1(p)
                 : selectedRepte === 2 ? buildStepsRepte2(p)
                 :                       buildStepsRepte3(p);

    currentStepIdx = 0;
    showCurrentStep();
    updateUI();
}

// ================================================================
// TECLAT
// ================================================================
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (els.gameScreen.style.display !== 'none' &&
            els.resolutionPanel.style.display !== 'none') {
            e.preventDefault();
            if (!isTransitioning && !isPenalizing) checkStep();
        }
    }
});

// ================================================================
// INICIALITZACIÓ I ROUTING PER PARÀMETRE ?m
// ================================================================
validateConfig();
injectSharedHTML();                            // ha d'anar ABANS: crea el #customKeyboard al DOM
initCustomKeyboard({ allowNegative: true });   // ara sí troba els .kb-btn i hi registra els listeners
registerScreens(['selection-screen', 'game-screen', 'session-end-screen', 'final-screen']);

// Mapeig del paràmetre públic ?m als reptes interns:
//   m=1 → Reducció   (selectedRepte=2)
//   m=2 → Igualació  (pendent d'implementar)
//   m=3 → Substitució (selectedRepte=1)
//   cap → pantalla de selecció amb preview del sistema
const mParam = getIntParam(urlParams, 'm', 0, 1, 3);

if (mParam === 1) {
    selectRepte(2);   // Reducció

} else if (mParam === 2) {
    selectRepte(3);   // Igualació

} else if (mParam === 3) {
    selectRepte(1);   // Substitució

} else {
    // Cap paràmetre m: genera i mostra un sistema de context perquè
    // l'alumne pugui triar el mètode amb coneixement de causa.
    // El guardem a previewProblem per reutilitzar-lo com a primer exercici.
    previewProblem = genRepte1(0);
    renderSistemaTo(previewProblem, document.getElementById('preview-expression-box'));
    showScreen('selection-screen');
}

</script>
