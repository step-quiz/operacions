<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial — Lectura de Gràfiques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:       #6b7c2e;
      --primary-light: #eef2dc;
      --primary-dark:  #3d4a10;
      --accent:        #8fa840;
      --bg:            #f4f7e8;
      --panel:         #ffffff;
      --text:          #0f172a;
      --muted:         #64748b;
      --border:        #e2e8f0;
      --success:       #059669;
      --success-light: #d1fae5;
      --danger:        #dc2626;
      --danger-light:  #fee2e2;
      --radius:        10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px 10px;
    }

    /* ---- CAPÇALERA PÀGINA ---- */
    .title-row {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 10px;
      width: 100%; max-width: 82vw;
      justify-content: center;
    }
    .title-row h1 {
      font-size: 1.485em; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--primary-dark);
    }
    .home-icon-link {
      width: 42px; height: 42px; opacity: 0.7;
      transition: opacity 0.2s; display: block; flex-shrink: 0;
    }
    .home-icon-link:hover { opacity: 1; }
    .home-icon-link img { width: 100%; height: 100%; object-fit: contain; }

    /* ---- PANELL ---- */
    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      width: 100%; max-width: 82vw;
      overflow: hidden;
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---- CAPÇALERA TUTORIAL ---- */
    .tut-header {
      background: var(--primary-dark);
      color: white;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .step-counter {
      font-size: 0.858em; font-weight: 700;
      background: rgba(255,255,255,0.15);
      padding: 3px 10px; border-radius: 20px;
      white-space: nowrap; flex-shrink: 0;
    }
    .example-chip { display: none; }
    .header-spacer { flex: 1 1 0; }

    .btn-pause {
      background: white;
      border: 2px solid #ea580c;
      color: #ea580c; font-size: 0.99em; font-weight: 800;
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(234,88,12,0.2);
    }
    .btn-pause:hover { background: #fff7ed; }

    .btn-next {
      padding: 6px 18px;
      background: white; color: var(--primary-dark);
      font-family: 'Barlow', sans-serif; font-size: 1.012em; font-weight: 700;
      border: none; border-radius: 7px; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-next:hover  { background: #e2e8f0; }
    .btn-next:active { transform: scale(0.97); }
    .btn-next.btn-finish        { background: #d1fae5; color: #065f46; }
    .btn-next.btn-finish:hover  { background: #a7f3d0; }
    .btn-next.btn-next-ex       { background: #ede9fe; color: #4c1d95; }
    .btn-next.btn-next-ex:hover { background: #ddd6fe; }

    /* ---- BARRA TIMER — creix d'esquerra a dreta, taronja ---- */
    .timer-track { height: 5px; background: rgba(0,0,0,0.08); flex-shrink: 0; }
    .timer-fill  { height: 100%; background: linear-gradient(90deg, #f97316, #ea580c); width: 0%; }

    /* ---- COS ---- */
    .game-body {
      display: flex; flex-direction: row;
      flex: 1 1 0; min-height: 0;
      transition: opacity 0.22s ease;
    }
    .game-body.fading { opacity: 0; pointer-events: none; }

    .game-left {
      width: 30%; flex-shrink: 0;
      display: flex; flex-direction: column;
      padding: 14px 12px 14px 18px;
      border-right: 1px solid var(--border);
      overflow-y: auto; min-height: 0;
      transition: opacity 0.3s ease;
    }
    .game-right {
      width: 70%; flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: flex-start;
      padding: 10px 14px 10px 10px;
      overflow-y: auto; min-height: 0;
      gap: 8px;
    }

    /* ---- PREGUNTA ---- */
    .question-prompt {
      font-size: 1.08em; font-weight: 600;
      color: var(--primary-dark); line-height: 1.45;
      margin-bottom: 8px;
      transition: opacity 0.3s ease;
    }
    .question-hint {
      font-size: 0.902em; font-weight: 500;
      color: var(--muted); font-style: italic;
      margin-bottom: 10px; line-height: 1.4; min-height: 1em;
      transition: opacity 0.3s ease;
    }

    /* ---- OPCIONS ---- */
    .options-list {
      display: flex; flex-direction: column; gap: 7px;
      transition: opacity 0.3s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(5px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .btn-option {
      padding: 9px 11px;
      font-family: 'Barlow', sans-serif; font-size: 1.001em; font-weight: 600;
      border-radius: var(--radius); border: 2px solid var(--border);
      background: white; color: var(--text);
      cursor: default; pointer-events: none;
      text-align: left; line-height: 1.35;
      opacity: 0;
      animation: popIn 0.22s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
      min-height: 42px;
      display: flex; align-items: center; gap: 9px; padding-left: 10px;
      transition: opacity 0.3s ease;
    }
    .btn-option::before {
      content: ''; flex-shrink: 0;
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border); background: white;
    }
    .btn-option.correct {
      background: var(--success-light) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }
    .btn-option.correct::before {
      border-color: var(--success) !important; background: var(--success) !important;
    }
    .btn-option.wrong {
      background: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
    }
    .btn-option.wrong::before {
      border-color: var(--danger) !important; background: var(--danger) !important;
    }
    /* Opció no focal: sense animació, directament atenuada */
    .btn-option.dim {
      opacity: 0.15 !important;
      animation: none !important;
    }

    /* ---- SVG ---- */
    #tut-graph { width: 100%; transition: opacity 0.3s ease; }
    #tut-graph svg { display: block; width: 90%; height: auto; }

    /* ---- NARRADOR (sobre el gràfic, en flux) ---- */
    .narration-box {
      width: 90%;
      background: white;
      border: 2px solid var(--primary);
      border-left: 5px solid var(--primary);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex; align-items: flex-start; gap: 10px;
      box-shadow: 0 2px 10px rgba(107,124,46,0.12);
      flex-shrink: 0;
      opacity: 0;   /* invisible per defecte; _showNarration() la fa apareixer */
    }
    .narration-icon { font-size: 1.375em; flex-shrink: 0; margin-top: 1px; line-height: 1; }
    .narration-text { font-size: 1.045em; line-height: 1.58; color: var(--text); }
    .narration-text b { color: var(--primary-dark); }

    /* ---- CLASSES FOCUS ---- */
    .game-left.dim { opacity: 0.15; }
    #tut-graph.dim { opacity: 0.15; }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 780px) {
      body { overflow: auto; height: auto; }
      /* FIX mòbil vertical: .panel ja no pot créixer amb flex perquè body
         no té altura definida. Li donem un mínim explícit perquè el
         game-body tingui espai real i no col·lapsi a zero. */
      .panel { flex: none; min-height: 580px; }
      .game-body { flex-direction: column-reverse; }
      .game-left, .game-right { width: 100%; border-right: none; }
      .game-left  { border-top: 1px solid var(--border); padding: 12px; }
      .game-right { padding: 10px; }
      #tut-graph svg, .narration-box { width: 100%; }
    }
    @media (max-width: 600px) {
      body { padding: 8px 8px 16px; }
      .title-row h1 { font-size: 1.05em; }
      .tut-header   { padding: 7px 10px; gap: 7px; }
    }
  </style>
</head>
<body>

<div class="title-row">
  <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
    <img src="icon.png" alt="Inici" onerror="this.style.display='none'">
  </a>
  <h1>Tutorial — Lectura de Gràfiques</h1>
</div>

<div class="panel">

  <div class="tut-header">
    <span class="step-counter" id="step-counter">Completat: 10%</span>
    <button class="btn-pause" id="btn-pause" aria-label="Pausa/repren">⏸</button>
    <button class="btn-next"  id="btn-next">Següent →</button>
    <div class="header-spacer"></div>
    <span class="example-chip"  id="example-chip"></span>
  </div>

  <div class="timer-track">
    <div class="timer-fill" id="timer-fill"></div>
  </div>

  <div class="game-body" id="game-body">
    <div class="game-left" id="game-left">
      <div class="question-prompt" id="tut-question"></div>
      <div class="question-hint"   id="tut-hint"></div>
      <div class="options-list"    id="tut-options"></div>
    </div>
    <div class="game-right">
      <div class="narration-box">
        <span class="narration-icon" id="narration-icon">👀</span>
        <div  class="narration-text" id="narration-text"></div>
      </div>
      <div id="tut-graph"></div>
    </div>
  </div>

</div>

<div id="fade-overlay" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999;transition:opacity 2s ease;"></div>

<script>
'use strict';

/* ================================================================
   DADES DEL TUTORIAL  —  2 exemples, 8 passos totals
   ================================================================ */
const TUTORIAL = [

  // ----------------------------------------------------------------
  // EXEMPLE 1 — Q2: Quina temperatura feia fa 3 dies?  (x = −3)
  // Cloud: [(-3,5), (-1,-1), (0,2), (2,1)]
  // Opcions descendent: 5 ºC (idx 0, correcta), 2, 1, −1
  // ----------------------------------------------------------------
  {
    chip:     'Exemple 1 \u00b7 Llegir un punt',
    question: 'Quina temperatura feia fa 3 dies?',
    cloud:    [[-3,5],[-1,-1],[0,2],[2,1]],
    yRange:   { min:-6, max:6, majorStep:1 },
    options: [
      { text: '5 \u00baC'       },   // idx 0 — correcta
      { text: '2 \u00baC'       },   // idx 1
      { text: '1 \u00baC'       },   // idx 2
      { text: '\u22121 \u00baC' },   // idx 3
    ],
    steps: [
      {
        icon:      '📖',
        narration: 'Llegeix la <b>pregunta</b>, a l\'esquerra. Ens demana la temperatura de <b>fa 3 dies</b>.<br>El primer pas és sempre llegir la pregunta!',
        highlight: null,
        btnStates: ['','','',''],
        focus:     'question',
      },
      {
        icon:      '🔎',
        narration: '<b>«Fa 3 dies»</b> correspon a x\u00a0=\u00a0−3.<br>Localitza x\u00a0=\u00a0−3 a l\'eix horitzontal del gràfic.',
        highlight: { type:'column', x:-3, label:'fa 3 dies \u2192 x\u00a0=\u00a0\u22123' },
        btnStates: ['','','',''],
        focus:     'graph',
      },
      {
        icon:      '👁️',
        narration: 'Veus el punt sobre x\u00a0=\u00a0−3? Quina altura li correspon?<br>Arriba a <b>y\u00a0=\u00a05</b>.',
        highlight: { type:'point', x:-3, y:5 },
        btnStates: ['','','',''],
        focus:     'graph',
      },
      {
        icon:      '❌',
        narration: 'Si haguessis triat <b>−1\u00a0ºC</b>, seria incorrecte.<br>Quan x\u00a0=\u00a0−3, veiem que y\u00a0=\u00a05',
        highlight: { type:'point', x:-3, y:5 },
        btnStates: ['','','','wrong'],
        focus:     'option-3',
      },
      {
        icon:      '✅',
        narration: '<b>5\u00a0ºC és la resposta correcta.</b> El punt és (−3,\u00a05): fa 3 dies tenim 5 graus sobre zero.',
        highlight: { type:'point-correct', x:-3, y:5 },
        btnStates: ['correct','','','wrong'],
        focus:     'option-0',
      },
    ],
  },

  // ----------------------------------------------------------------
  // EXEMPLE 2 — Q4: Selecciona la frase correcta
  // Cloud: [(-2,-1), (-1,0), (0,2), (1,4), (3,1)]
  // Opció 0 és l'única correcta
  // ----------------------------------------------------------------
  {
    chip:     'Exemple 2 \u00b7 Frase correcta',
    question: 'Selecciona la frase correcta:',
    cloud:    [[-2,-1],[-1,0],[0,2],[1,4],[3,1]],
    yRange:   { min:-6, max:6, majorStep:1 },
    options: [
      { text: 'Avui, la temperatura és de 2 graus sobre zero'              },  // idx 0 — CERTA
      { text: 'Ahir, la temperatura va ser de 2 graus sota zero'           },  // idx 1 — falsa
      { text: 'D\'aquí 3 dies, la temperatura serà de 4 graus sobre zero'  },  // idx 2 — falsa
      { text: 'Entre avui i demà, la temperatura baixarà'                  },  // idx 3 — falsa
    ],
    steps: [
      {
        icon:      '📋',
        narration: 'Hi ha <b>4 frases</b>. Hem d\'analitzar cadascuna i comprovar-la al gràfic.<br>Observa com ho fem. Només n\'hi ha una de certa.',
        highlight: null,
        btnStates: ['','','',''],
        focus:     'options',
      },
      {
        icon:      '❌',
        narration: 'Frase 3: <b>«D\'aquí 3 dies, 4\u00a0ºC.»</b> Comprova x\u00a0=\u00a03: el punt és a y\u00a0=\u00a01, no a y\u00a0=\u00a04. <b>Fals!</b>',
        highlight: { type:'point', x:3, y:1 },
        btnStates: ['','','wrong',''],
        focus:     'option-2',
      },
      {
        icon:      '✅',
        narration: 'Frase 1: <b>«Avui, 2 graus sobre zero.»</b> Comprova x\u00a0=\u00a00: el punt és a y\u00a0=\u00a02. <b>Cert!</b><br>Les altres tres frases son totes falses.',
        highlight: { type:'point-correct', x:0, y:2 },
        btnStates: ['correct','wrong','wrong','wrong'],
        focus:     'option-0',
      },
    ],
  },

];

const TOTAL_STEPS = TUTORIAL.reduce((n, ex) => n + ex.steps.length, 0);

/* ================================================================
   ESTAT
   ================================================================ */
let exIdx   = 0;
let stepIdx = 0;

/* ================================================================
   TIMER  —  10 s per pas, amb pausa
   ================================================================ */
const STEP_MS    = 10000;
let timerElapsed = 0;
let timerLastMs  = null;
let timerIntv    = null;
let isPaused     = false;

function startTimer() {
    clearInterval(timerIntv);
    timerElapsed = 0;
    timerLastMs  = Date.now();
    isPaused     = false;
    _setPauseIcon();
    _setFill(0);
    timerIntv = setInterval(_tick, 60);
}

function _tick() {
    if (isPaused) return;
    const now = Date.now();
    timerElapsed += now - timerLastMs;
    timerLastMs   = now;
    _setFill(Math.min(100, timerElapsed / STEP_MS * 100));
    if (timerElapsed >= STEP_MS) { clearInterval(timerIntv); _advance(); }
}

function _setFill(pct) {
    document.getElementById('timer-fill').style.width = pct + '%';
}

function togglePause() {
    if (isPaused) { isPaused = false; timerLastMs = Date.now(); }
    else          { isPaused = true; }
    _setPauseIcon();
}

function _setPauseIcon() {
    document.getElementById('btn-pause').textContent = isPaused ? '▶' : '⏸';
}

/* ================================================================
   NAVEGACIÓ
   ================================================================ */
function _globalStep() {
    let n = 0;
    for (let i = 0; i < exIdx; i++) n += TUTORIAL[i].steps.length;
    return n + stepIdx;
}

function _advance() {
    clearInterval(timerIntv);
    const ex         = TUTORIAL[exIdx];
    const isLastStep = stepIdx === ex.steps.length - 1;
    const isLastEx   = exIdx   === TUTORIAL.length  - 1;

    if (isLastStep && isLastEx) {
        // Fade-out 2s, llavors navega
        const overlay = document.getElementById('fade-overlay');
        overlay.style.pointerEvents = 'all';
        overlay.style.opacity       = '1';
        setTimeout(() => { window.location.href = 'recta-numerica.html'; }, 2000);
        return;
    }

    if (isLastStep) { exIdx++; stepIdx = 0; }
    else            { stepIdx++; }
    _transition();
}

function _transition() {
    const body = document.getElementById('game-body');
    body.classList.add('fading');
    setTimeout(() => {
        render();
        body.classList.remove('fading');
        setTimeout(() => {
            _showNarration();
            startTimer();
        }, 800);
    }, 220);
}

/* ================================================================
   FOCUS  —  ressalta un element, atenua la resta
   ================================================================ */
function applyFocus(focus) {
    const graphEl    = document.getElementById('tut-graph');
    const leftEl     = document.getElementById('game-left');
    const questionEl = document.getElementById('tut-question');
    const hintEl     = document.getElementById('tut-hint');
    const optListEl  = document.getElementById('tut-options');
    const opts       = optListEl.querySelectorAll('.btn-option');

    // Reset
    graphEl.classList.remove('dim');
    leftEl.classList.remove('dim');
    questionEl.style.opacity = '';
    hintEl.style.opacity     = '';
    optListEl.classList.remove('dim');
    opts.forEach(o => o.classList.remove('dim'));

    if (!focus) return;

    if (focus === 'question') {
        graphEl.classList.add('dim');
        optListEl.classList.add('dim');

    } else if (focus === 'graph') {
        questionEl.style.opacity = '0.15';
        hintEl.style.opacity     = '0.15';
        optListEl.classList.add('dim');

    } else if (focus === 'options') {
        graphEl.classList.add('dim');
        questionEl.style.opacity = '0.15';
        hintEl.style.opacity     = '0.15';

    } else if (focus.startsWith('option-')) {
        const idx = parseInt(focus.split('-')[1]);
        // El gràfic resta visible: la narració demana verificar-hi un punt
        questionEl.style.opacity = '0.15';
        hintEl.style.opacity     = '0.15';
        opts.forEach((o, i) => { if (i !== idx) o.classList.add('dim'); });
    }
}

/* ================================================================
   RENDER
   ================================================================ */
function render() {
    const ex   = TUTORIAL[exIdx];
    const step = ex.steps[stepIdx];

    const gs   = _globalStep();
    const pct  = [0, 15, 30, 45, 60, 75, 90, 100][gs] ?? 100;
    document.getElementById('step-counter').textContent = `Completat: ${pct}%`;
    document.getElementById('example-chip').textContent = ex.chip;
    document.getElementById('tut-question').textContent = ex.question;
    document.getElementById('tut-hint').textContent     = '';

    // Opcions
    const optEl = document.getElementById('tut-options');
    optEl.innerHTML = '';
    ex.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        const st = step.btnStates[i];
        if (st === 'wrong')   btn.classList.add('wrong');
        if (st === 'correct') btn.classList.add('correct');
        btn.style.animationDelay = `${i * 50}ms`;
        btn.textContent = opt.text;
        optEl.appendChild(btn);
    });

    // Gràfic
    document.getElementById('tut-graph').innerHTML = buildSVG(ex.cloud, ex.yRange, step.highlight);

    // Narrador — sempre invisible en renderitzar; _showNarration() el fa apareixer
    const narrationBox = document.querySelector('.narration-box');
    narrationBox.style.transition = 'none';
    narrationBox.style.opacity    = '0';
    document.getElementById('narration-icon').textContent = step.icon;
    document.getElementById('narration-text').innerHTML   = step.narration;

    // Focus
    applyFocus(step.focus);

    // Botó Següent
    const isLastStep = stepIdx === ex.steps.length - 1;
    const isLastEx   = exIdx   === TUTORIAL.length  - 1;
    const btn = document.getElementById('btn-next');
    if      (isLastStep && isLastEx) { btn.textContent = '🎮 Ves a jugar!';              btn.className = 'btn-next btn-finish';  }
    else if (isLastStep)             { btn.textContent = 'Exemple seg\u00fcent \u2192';  btn.className = 'btn-next btn-next-ex'; }
    else                             { btn.textContent = 'Seg\u00fcent \u2192';          btn.className = 'btn-next';             }
    btn.blur();   // evita que la barra espaiadora el dispari involuntàriament
}

function _showNarration() {
    const box = document.querySelector('.narration-box');
    box.style.transition = 'opacity 0.4s ease';
    box.style.opacity    = '1';
}

/* ================================================================
   GENERACIÓ SVG
   ================================================================ */
function buildSVG(cloudPts, yr, hl) {
    const W=560, H=420, ml=20, mr=20, mt=20, mb=20;
    const pw=W-ml-mr, ph=H-mt-mb;
    const xMin=-5, xMax=5;
    const f   = n => (+n).toFixed(1);
    const tx  = x => ml + (x-xMin)/(xMax-xMin)*pw;
    const ty  = y => mt + ph - (y-yr.min)/(yr.max-yr.min)*ph;
    const px0 = tx(0);
    const py0 = (yr.min<=0 && yr.max>=0) ? ty(0) : mt+ph;
    const s   = [];

    s.push(`<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#800020"/></marker></defs>`);
    s.push(`<rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="#fff"/>`);

    // Columna destacada
    if (hl && hl.type==='column') {
        const cw = pw/(xMax-xMin);
        s.push(`<rect x="${f(tx(hl.x)-cw/2)}" y="${mt}" width="${f(cw)}" height="${ph}" fill="#6b7c2e" opacity="0.09" rx="3"/>`);
        s.push(`<text x="${f(tx(hl.x))}" y="${mt+14}" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="11" font-weight="700" fill="#6b7c2e">${hl.label||`x=${hl.x}`}</text>`);
    }

    // Grid
    for (let x=xMin; x<=xMax; x++)
        s.push(`<line x1="${f(tx(x))}" y1="${mt}" x2="${f(tx(x))}" y2="${mt+ph}" stroke="#cdd9b0" stroke-width="0.7"/>`);
    for (let y=yr.min; y<=yr.max; y+=yr.majorStep)
        s.push(`<line x1="${ml}" y1="${f(ty(y))}" x2="${ml+pw}" y2="${f(ty(y))}" stroke="#b5c47a" stroke-width="1"/>`);

    // Eixos
    s.push(`<line x1="${ml}" y1="${f(py0)}" x2="${ml+pw}" y2="${f(py0)}" stroke="#000" stroke-width="2"/>`);
    s.push(`<line x1="${f(px0)}" y1="${mt}" x2="${f(px0)}" y2="${mt+ph}" stroke="#000" stroke-width="2"/>`);

    // Etiquetes Y
    for (let y=yr.min; y<=yr.max; y+=yr.majorStep) {
        if (y===0) continue;
        const py=ty(y);
        s.push(`<line x1="${f(px0-4)}" y1="${f(py)}" x2="${f(px0+4)}" y2="${f(py)}" stroke="#000" stroke-width="1.5"/>`);
        s.push(`<text x="${f(px0-8)}" y="${f(py+5)}" text-anchor="end" font-family="'Barlow',sans-serif" font-size="14" font-weight="500" fill="#000">${y}</text>`);
    }
    // Etiquetes X
    for (let x=xMin; x<=xMax; x++) {
        if (x===0) continue;
        const px=tx(x);
        s.push(`<line x1="${f(px)}" y1="${f(py0-4)}" x2="${f(px)}" y2="${f(py0+4)}" stroke="#000" stroke-width="1.5"/>`);
        s.push(`<text x="${f(px)}" y="${f(py0+20)}" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="14" font-weight="500" fill="#000">${x}</text>`);
    }
    s.push(`<text x="${f(px0-8)}" y="${f(py0+20)}" text-anchor="end" font-family="'Barlow',sans-serif" font-size="14" font-weight="500" fill="#000">0</text>`);

    // Títols eixos
    s.push(`<text x="${f(px0+6)}" y="15" text-anchor="start" font-family="'Barlow',sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#000">y: temperatura (ºC)</text>`);
    s.push(`<text x="${f(ml+pw)}" y="${f(py0-7)}" text-anchor="end" font-family="'Barlow',sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#000">x: temps (dies)</text>`);

    // Punts del núvol
    cloudPts.forEach(([cx,cy]) => {
        s.push(`<circle cx="${f(tx(cx))}" cy="${f(ty(cy))}" r="7" fill="#6b7c2e" stroke="white" stroke-width="2.5"/>`);
    });

    // Línies de projecció
    const PROJ = ['point','point-correct','point-wrong'];
    if (hl && PROJ.includes(hl.type)) {
        const hx=tx(hl.x), hy=ty(hl.y);
        const c = { point:'#6b7c2e', 'point-correct':'#059669', 'point-wrong':'#dc2626' }[hl.type];
        s.push(`<line x1="${ml}" y1="${f(hy)}" x2="${f(hx)}" y2="${f(hy)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.55"/>`);
        s.push(`<line x1="${f(hx)}" y1="${f(hy)}" x2="${f(hx)}" y2="${f(py0)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.55"/>`);
    }

    // Punt pulsant
    if (hl && hl.type==='point') {
        const hx=tx(hl.x), hy=ty(hl.y);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="10" fill="none" stroke="#8fa840" stroke-width="2.5"><animate attributeName="r" from="9" to="23" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.75" to="0" dur="1.2s" repeatCount="indefinite"/></circle>`);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="8" fill="#8fa840" stroke="white" stroke-width="2.5"/>`);
    }

    // Punt incorrecte
    if (hl && hl.type==='point-wrong') {
        const hx=tx(hl.x), hy=ty(hl.y), d=4.5;
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>`);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="8"  fill="#dc2626" stroke="white"  stroke-width="2.5"/>`);
        s.push(`<line x1="${f(hx-d)}" y1="${f(hy-d)}" x2="${f(hx+d)}" y2="${f(hy+d)}" stroke="white" stroke-width="2.5" stroke-linecap="round"/>`);
        s.push(`<line x1="${f(hx+d)}" y1="${f(hy-d)}" x2="${f(hx-d)}" y2="${f(hy+d)}" stroke="white" stroke-width="2.5" stroke-linecap="round"/>`);
    }

    // Punt correcte
    if (hl && hl.type==='point-correct') {
        const hx=tx(hl.x), hy=ty(hl.y);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="15" fill="#d1fae5" stroke="#059669" stroke-width="2"/>`);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="8"  fill="#059669" stroke="white"  stroke-width="2.5"/>`);
        s.push(`<polyline points="${f(hx-5)},${f(hy+1)} ${f(hx-1)},${f(hy+4.5)} ${f(hx+5)},${f(hy-4)}" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`);
    }

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" overflow="visible" style="width:90%;height:auto;display:block">${s.join('')}</svg>`;
}

/* ================================================================
   EVENTS
   ================================================================ */
document.getElementById('btn-next').addEventListener('click', () => {
    clearInterval(timerIntv);
    _advance();
});
document.getElementById('btn-pause').addEventListener('click', togglePause);

document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
        e.preventDefault();
        togglePause();
    }
});

/* ================================================================
   ARRENCADA
   ================================================================ */
render();
setTimeout(() => {
    _showNarration();
    startTimer();
}, 800);
</script>
