<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curs de Karel</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="curs.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     CAPÇALERA
     ══════════════════════════════════════════════════════ -->
<header class="curs-header">
  <a href="index.html" class="curs-header-logo" aria-label="Inici del curs">
    <span class="logo-icon"></span>
    Karel
  </a>

  <span class="curs-header-title">Curs de programació</span>

  <div class="curs-header-actions">
    <a href="../index.html" class="btn-curs-theme btn-curs-sim"
       title="Obre el simulador lliure">Simulador →</a>
    <button id="btn-curs-theme" class="btn-curs-theme"
            onclick="toggleCursTheme()" title="Canvia el tema" aria-label="Canvia el tema"></button>
  </div>
</header>


<!-- ══════════════════════════════════════════════════════
     HERO
     ══════════════════════════════════════════════════════ -->
<div class="curs-index-hero">
  <h1>Aprèn a programar<br>amb en Karel</h1>
  <p>
    Deu capítols per descobrir la programació des de zero.
    Llegeix, executa exemples i resol exercicis — tot des del navegador.
  </p>
</div>


<!-- ══════════════════════════════════════════════════════
     LLISTA DE CAPÍTOLS
     ══════════════════════════════════════════════════════ -->
<ul class="capitols-list" id="capitols-list" aria-label="Llista de capítols">
  <!-- Omplerta per capitols.js -->
</ul>


<!-- ══════════════════════════════════════════════════════
     Scripts
     ══════════════════════════════════════════════════════ -->
<script src="capitols.js"></script>
<script>
  // Injecta el logo de la medusa al header (font única de veritat)
  injectCursLogo();

  // Genera la llista de capítols a partir de CAPITOLS_DATA
  (function renderIndex() {
    const list = document.getElementById('capitols-list');
    if (!list) return;

    // Capítols disponibles (arxius ja creats). Actualitzar quan s'afegeixin capítols reals.
    const DISPONIBLES = new Set([/* p.ex: 1, 2, 3 */]);

    let html = '';
    for (const c of CAPITOLS_DATA) {
      const disponible = DISPONIBLES.has(c.num);
      const cardClass  = disponible ? 'capitol-card' : 'capitol-card capitol-card--pendent';
      const href       = disponible ? c.arxiu : '#';

      html += `
        <li class="${cardClass}">
          <a href="${href}" ${!disponible ? 'aria-disabled="true" tabindex="-1"' : ''}>
            <span class="capitol-card-num">${c.num}</span>
            <span class="capitol-card-info">
              <span class="capitol-card-titol">${c.titol}</span>
              <span class="capitol-card-sub">${c.subtitol}</span>
            </span>
            <span class="capitol-card-arrow">${disponible ? '→' : '···'}</span>
          </a>
        </li>`;
    }
    list.innerHTML = html;
  })();

  // Aplica la icona del botó tema via la funció de capitols.js
  updateCursThemeBtn();
</script>

</body>
</html>
