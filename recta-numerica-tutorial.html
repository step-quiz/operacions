<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial — Lectura de Gràfiques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:       #0077b6;
      --primary-light: #e0f4ff;
      --primary-dark:  #023e8a;
      --accent:        #00b4d8;
      --bg:            #f0f9ff;
      --panel:         #ffffff;
      --text:          #0f172a;
      --muted:         #64748b;
      --border:        #e2e8f0;
      --success:       #059669;
      --success-light: #d1fae5;
      --danger:        #dc2626;
      --danger-light:  #fee2e2;
      --radius:        10px;
      --burgundy:      #800020;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px 10px;
    }

    .title-row {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 10px;
      width: 100%; max-width: 80vw;
      justify-content: center;
    }
    .title-row h1 {
      font-size: 1.35em; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--primary-dark);
    }
    .home-icon-link {
      width: 42px; height: 42px; opacity: 0.7;
      transition: opacity 0.2s; display: block; flex-shrink: 0;
    }
    .home-icon-link:hover { opacity: 1; }
    .home-icon-link img   { width: 100%; height: 100%; object-fit: contain; }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      width: 100%; max-width: 80vw;
      overflow: hidden;
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---- CAPÇALERA ---- */
    .tut-header {
      background: var(--primary-dark);
      color: white;
      padding: 9px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }
    .tut-header-left { display: flex; align-items: center; gap: 9px; }
    #btn-next-wrap {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    #btn-next { display: block; }

    .rec-dot {
      width: 10px; height: 10px;
      background: #ef4444; border-radius: 50%;
      animation: rec-blink 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes rec-blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.2; }
    }
    #example-label {
      font-size: 1.056em; font-weight: 600; letter-spacing: 0.3px;
    }

    .progress-track { height: 4px; background: var(--border); flex-shrink: 0; }
    .progress-fill  {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
      width: 0%;
    }

    /* ---- COS ---- */
    .game-body {
      display: flex; flex-direction: row;
      flex: 1 1 0; min-height: 0;
    }
    .game-left {
      width: 30%; flex-shrink: 0;
      display: flex; flex-direction: column;
      padding: 14px 12px 14px 18px;
      border-right: 1px solid var(--border);
      overflow-y: auto; min-height: 0;
    }
    .game-right {
      width: 70%; flex-shrink: 0;
      display: flex; align-items: flex-start;
      padding: 10px 14px 10px 10px;
      overflow-y: auto; min-height: 0;
    }

    .example-chip {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 0.72em; font-weight: 800;
      padding: 3px 10px; border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 0.6px;
      align-self: flex-start;
    }
    .question-prompt {
      font-size: 1.04em; font-weight: 600;
      color: var(--primary-dark); line-height: 1.45;
      margin-bottom: 12px;
      min-height: calc(1.04em * 1.45 * 4);
      display: flex; align-items: flex-start;
    }
    .question-hint {
      font-size: 0.85em; font-weight: 500;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    /* ---- OPCIONS ---- */
    .options-list { display: flex; flex-direction: column; gap: 7px; }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-5px); }
      75%     { transform: translateX(5px); }
    }

    .btn-option {
      padding: 10px 12px;
      font-family: 'Barlow', sans-serif; font-size: 0.97em; font-weight: 600;
      border-radius: var(--radius); border: 2px solid var(--border);
      background: white; color: var(--text);
      cursor: default;
      text-align: left; line-height: 1.35;
      transition: background 0.15s, border-color 0.15s;
      opacity: 0;
      animation: popIn 0.25s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
      min-height: 46px;
      display: flex; align-items: center;
      gap: 10px; padding-left: 11px;
    }
    .btn-option::before {
      content: ''; flex-shrink: 0;
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--border); background: white;
    }
    .btn-option.correct {
      background: var(--success-light) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }
    .btn-option.correct::before {
      border-color: var(--success) !important;
      background: var(--success) !important;
    }
    .btn-option.wrong {
      background: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      opacity: 1 !important;
      animation: shake 0.28s forwards !important;
    }
    .btn-option.wrong::before {
      border-color: var(--danger) !important;
      background: var(--danger) !important;
    }

    /* ---- GRÀFIC + BOMBOLLA ---- */
    #graph-wrap {
      position: relative; width: 100%;
    }
    #graph-wrap svg { display: block; width: 100%; height: auto; }

    /* ================================================================
       BOMBOLLA DE NARRACIÓ
       Ara situada als quadrants Q2 (dalt-esquerra) i Q3 (baix-esquerra)
       La fletxa decorativa apunta cap a la DRETA (cap al contingut)
       ================================================================ */
    .narration-bubble {
      position: absolute;
      width: 36%;
      background: white;
      border: 2px solid var(--primary);
      border-right: 5px solid var(--primary);
      border-radius: 10px;
      padding: 11px 12px 11px 13px;
      box-shadow: 0 5px 22px rgba(0,119,182,0.18);
      font-size: 0.87em; line-height: 1.55;
      color: var(--text);
      z-index: 20;
      transition:
        top    0.45s cubic-bezier(0.25,0.8,0.25,1),
        opacity 0.22s ease,
        transform 0.22s ease;
    }
    /* Fletxa apuntant cap a la dreta */
    .narration-bubble::before {
      content: ''; position: absolute;
      right: -10px; left: auto; top: 20px;
      border: 5px solid transparent;
      border-left-color: var(--primary);
    }
    .narration-bubble::after {
      content: ''; position: absolute;
      right: -6px; left: auto; top: 22px;
      border: 3px solid transparent;
      border-left-color: white;
    }
    .narration-bubble.fade-out {
      opacity: 0; transform: translateY(-7px);
    }
    /* Q2: dalt-esquerra  /  Q3: baix-esquerra */
    .narration-bubble.pos-left-top    { top:  3%; left: 2%; }
    .narration-bubble.pos-left-bottom { top: 57%; left: 2%; }

    .bubble-icon { display: block; font-size: 1.15em; margin-bottom: 4px; }
    .narration-bubble b { color: var(--primary-dark); }

    /* ---- BOTÓ SEGÜENT ---- */
    @keyframes blink-shake {
      0%              { opacity: 1;    transform: translateX(0); }
      8%, 24%, 40%    { transform: translateX(-5px); }
      16%, 32%, 48%   { transform: translateX(5px); }
      56%             { transform: translateX(-3px); }
      64%             { transform: translateX(3px); }
      72%, 100%       { opacity: 1;    transform: translateX(0); }
      10%, 30%, 50%, 70%  { opacity: 0.35; }
      20%, 40%, 60%, 80%  { opacity: 1; }
    }
    .btn-next-step.attention {
      animation: blink-shake 3s ease-in-out forwards;
    }
    .btn-next-step {
      padding: 8px 20px;
      background: white; color: #0f172a;
      font-family: 'Barlow', sans-serif; font-size: 0.97em; font-weight: 700;
      border: none; border-radius: 7px; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .btn-next-step:hover  { background: #e2e8f0; }
    .btn-next-step:active { transform: scale(0.97); }
    .btn-next-step.btn-finish              { background: #d1fae5; color: #065f46; }
    .btn-next-step.btn-finish:hover        { background: #a7f3d0; }
    .btn-next-step.btn-next-example        { background: #ede9fe; color: #4c1d95; }
    .btn-next-step.btn-next-example:hover  { background: #ddd6fe; }

    /* ---- RESPONSIU ---- */
    @media (max-width: 780px) {
      body { overflow: auto; height: auto; }
      .game-body { flex-direction: column-reverse; }
      .game-left, .game-right { width: 100%; border-right: none; }
      .game-left  { border-top: 1px solid var(--border); padding: 12px; }
      .game-right { padding: 10px 10px 2px; }
      #graph-wrap { position: relative; }
      .narration-bubble {
        position: relative !important;
        width: 100% !important;
        top: auto !important; left: auto !important;
        margin-top: 10px;
        border-right-width: 2px;
      }
      .narration-bubble::before,
      .narration-bubble::after { display: none; }
    }
    @media (max-width: 600px) {
      body { padding: 8px 8px 16px; }
      .title-row h1 { font-size: 1.1em; }
      .tut-header   { padding: 8px 12px; }
    }
  </style>
</head>

<div class="title-row">

<script>

/* ================================================================

const TEXTS = {

  e3_s1: 'Llegim les frases que veiem a l\'esquerra i hem d\'escollir quina és certa.<br>Només n\'hi ha una!',
  e3_s2: 'La primera frase és <b>falsa</b>!<br>No és cert que demà estiguem a 1ºC.',
  e3_s3: 'La segona frase diu que <b>avui</b> estem a 2ºC. És cert?',
  e3_s4: '<b>✅ Correcte!</b> El punt és (0, 2).<br>Avui la temperatura és de <b>2 graus sobre zero</b>.<br>La frase és certa!',

};


/* ================================================================
   DADES DEL TUTORIAL
   Cada exemple té: chip, question, cloud, yRange, options i steps.
   Cada step té: narration, highlight, btnStates, pos, icon.
   ================================================================ */
const TUTORIAL = [

  // ================================================================
  // EXEMPLE 1 — Q1: Temperatura avui

      {

  // ================================================================
  // EXEMPLE 2 — Q2: Temperatura d'un altre dia
  // Cloud: [(-3,-2),(-1,3),(0,1),(2,4)]

/* ================================================================
   GENERACIÓ SVG
   ================================================================ */
function buildSVG(cloudPts, yr, hl) {
    const W=560, H=420, ml=20, mr=20, mt=20, mb=20;
    const pw=W-ml-mr, ph=H-mt-mb;
    const xMin=-5, xMax=5;
    const f  = n => (+n).toFixed(1);
    const tx = x => ml + (x-xMin)/(xMax-xMin)*pw;
    const ty = y => mt + ph - (y-yr.min)/(yr.max-yr.min)*ph;
    const px0 = tx(0);
    const py0 = (yr.min<=0&&yr.max>=0) ? ty(0) : mt+ph;

    const s = [];

    s.push(`<defs>
        <marker id="arrow-burgundy" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L9,3.5 z" fill="#800020"/>
        </marker>
    </defs>`);

    s.push(`<rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="#fff"/>`);

    // --- Columna destacada ---
    if (hl?.type==='column') {
        const cw = pw/(xMax-xMin);
        s.push(`<rect x="${f(tx(hl.x)-cw/2)}" y="${mt}" width="${f(cw)}" height="${ph}" fill="#0077b6" opacity="0.09" rx="3"/>`);
        s.push(`<text x="${f(tx(hl.x)-18)}" y="${mt+15}" text-anchor="end" font-family="'Barlow',sans-serif" font-size="11.5" font-weight="700" fill="#0077b6">${hl.label||`x=${hl.x}`}</text>`);
        const [ox, oy] = hl.arrowOrigin || [hl.x + 1.2, 2];
        const [atx, aty] = hl.arrowTarget || [hl.x, 0];
        s.push(`<line x1="${f(tx(ox))}" y1="${f(ty(oy))}" x2="${f(tx(atx))}" y2="${f(ty(aty))}" stroke="#800020" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#arrow-burgundy)" opacity="0.9"/>`);
    }

    // --- Segments convergents ---
    if (hl?.type==='arrows-to') {
        const tx2 = f(tx(hl.x)), ty2 = f(ty(hl.y));
        const origins = [
            [hl.x - 1.8, hl.y + 2.2],
            [hl.x + 0.0, hl.y + 2.5],
            [hl.x + 1.8, hl.y + 2.2],
        ];
        origins.forEach(([ox, oy]) => {
            s.push(`<line x1="${f(tx(ox))}" y1="${f(ty(oy))}" x2="${tx2}" y2="${ty2}" stroke="#800020" stroke-width="2.2" stroke-dasharray="6,3" opacity="0.85"/>`);
        });
    }

    // --- Fletxa lliure ---
    if (hl?.type==='arrow') {
        s.push(`<line x1="${f(tx(hl.x1))}" y1="${f(ty(hl.y1))}" x2="${f(tx(hl.x2))}" y2="${f(ty(hl.y2))}" stroke="#800020" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#arrow-burgundy)" opacity="0.9"/>`);
    }

    // --- Grid ---
    for (let x=xMin; x<=xMax; x++)
        s.push(`<line x1="${f(tx(x))}" y1="${mt}" x2="${f(tx(x))}" y2="${mt+ph}" stroke="#c8d6e0" stroke-width="0.7"/>`);
    for (let y=yr.min; y<=yr.max; y+=yr.majorStep)
        s.push(`<line x1="${ml}" y1="${f(ty(y))}" x2="${ml+pw}" y2="${f(ty(y))}" stroke="#9aaab8" stroke-width="1"/>`);

    // --- Eixos ---
    s.push(`<line x1="${ml}" y1="${f(py0)}" x2="${ml+pw}" y2="${f(py0)}" stroke="#000" stroke-width="2"/>`);
    s.push(`<line x1="${f(px0)}" y1="${mt}" x2="${f(px0)}" y2="${mt+ph}" stroke="#000" stroke-width="2"/>`);

    // --- Etiquetes Y ---
    for (let y=yr.min; y<=yr.max; y+=yr.majorStep) {
        if (y===0) continue;
        const py=ty(y);
        s.push(`<line x1="${f(px0-4)}" y1="${f(py)}" x2="${f(px0+4)}" y2="${f(py)}" stroke="#000" stroke-width="1.5"/>`);
        s.push(`<text x="${f(px0-8)}" y="${f(py+5)}" text-anchor="end" font-family="'Barlow',sans-serif" font-size="14" font-weight="500" fill="#000">${y}</text>`);
    }
    // --- Etiquetes X ---
    for (let x=xMin; x<=xMax; x++) {
        if (x===0) continue;
        const px=tx(x);
        s.push(`<line x1="${f(px)}" y1="${f(py0-4)}" x2="${f(px)}" y2="${f(py0+4)}" stroke="#000" stroke-width="1.5"/>`);
        s.push(`<text x="${f(px)}" y="${f(py0+20)}" text-anchor="middle" font-family="'Barlow',sans-serif" font-size="14" font-weight="500" fill="#000">${x}</text>`);
    }
    s.push(`<text x="${f(px0-8)}" y="${f(py0+20)}" text-anchor="end" font-family="'Barlow',sans-serif" font-size="14" font-weight="500" fill="#000">0</text>`);

    // --- Punts ---
    cloudPts.forEach(([cx,cy]) => {
        s.push(`<circle cx="${f(tx(cx))}" cy="${f(ty(cy))}" r="7" fill="#0077b6" stroke="white" stroke-width="2.5"/>`);
    });

    // --- Línies de projecció ---
    const PROJ_TYPES = ['point','point-correct','point-wrong'];
    if (hl && PROJ_TYPES.includes(hl.type)) {
        const hx=tx(hl.x), hy=ty(hl.y);
        const cols = { 'point':'#0077b6', 'point-correct':'#059669', 'point-wrong':'#dc2626' };
        const c = cols[hl.type];
        s.push(`<line x1="${ml}" y1="${f(hy)}" x2="${f(hx)}" y2="${f(hy)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>`);
        s.push(`<line x1="${f(hx)}" y1="${f(hy)}" x2="${f(hx)}" y2="${f(py0)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>`);
    }

    // --- Overlay: punt blau pulsant ---
    if (hl?.type==='point') {
        const hx=tx(hl.x), hy=ty(hl.y);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="10" fill="none" stroke="#00b4d8" stroke-width="2.5">
            <animate attributeName="r"       from="9"   to="23"  dur="1.25s" repeatCount="indefinite"/>
            <animate attributeName="opacity" from="0.8" to="0"   dur="1.25s" repeatCount="indefinite"/>
        </circle>`);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="8" fill="#00b4d8" stroke="white" stroke-width="2.5"/>`);
    }

    // --- Overlay: punt erroni ---
    if (hl?.type==='point-wrong') {
        const hx=tx(hl.x), hy=ty(hl.y);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>`);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="8"  fill="#dc2626" stroke="white"  stroke-width="2.5"/>`);
        const d=4.5;
        s.push(`<line x1="${f(hx-d)}" y1="${f(hy-d)}" x2="${f(hx+d)}" y2="${f(hy+d)}" stroke="white" stroke-width="2.5" stroke-linecap="round"/>`);
        s.push(`<line x1="${f(hx+d)}" y1="${f(hy-d)}" x2="${f(hx-d)}" y2="${f(hy+d)}" stroke="white" stroke-width="2.5" stroke-linecap="round"/>`);
    }

    // --- Overlay: punt correcte ---
    if (hl?.type==='point-correct') {
        const hx=tx(hl.x), hy=ty(hl.y);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="15" fill="#d1fae5" stroke="#059669" stroke-width="2"/>`);
        s.push(`<circle cx="${f(hx)}" cy="${f(hy)}" r="8"  fill="#059669" stroke="white"  stroke-width="2.5"/>`);
        s.push(`<polyline points="${f(hx-5)},${f(hy+1)} ${f(hx-1)},${f(hy+4.5)} ${f(hx+5)},${f(hy-4)}" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`);
    }

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" overflow="visible" style="width:100%;height:auto;display:block">${s.join('')}</svg>`;
}


/* ================================================================
   ESTAT I NAVEGACIÓ
   ================================================================ */
let exIdx   = 0;
let stepIdx = 0;

const TOTAL_STEPS = TUTORIAL.reduce((n, ex) => n + ex.steps.length, 0);

function globalStep() {
    let n = 0;
    for (let i = 0; i < exIdx; i++) n += TUTORIAL[i].steps.length;
    return n + stepIdx;
}


/* ================================================================
   RENDER
   ================================================================ */
function render() {
    const ex   = TUTORIAL[exIdx];
    const step = ex.steps[stepIdx];
    const gs   = globalStep();

    document.getElementById('example-label').textContent = `Exemple ${exIdx+1} de ${TUTORIAL.length}`;
    document.getElementById('progress-fill').style.width = Math.round(gs / TOTAL_STEPS * 100) + '%';

    document.getElementById('example-chip').textContent      = ex.chip;
    document.getElementById('tut-question').textContent      = ex.question;
    document.getElementById('tut-question-hint').textContent = ex.hint || '';

    const optEl = document.getElementById('tut-options');
    optEl.innerHTML = '';
    ex.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        const st = step.btnStates[i];
        if (st === 'wrong')   btn.classList.add('wrong');
        if (st === 'correct') btn.classList.add('correct');
        btn.style.pointerEvents  = 'none';
        btn.style.animationDelay = `${i * 55}ms`;
        btn.textContent = opt.text;
        optEl.appendChild(btn);
    });

    document.getElementById('tut-graph').innerHTML = buildSVG(ex.cloud, ex.yRange, step.highlight);

    const bubble  = document.getElementById('narration-bubble');
    const textEl  = document.getElementById('narration-text');
    const iconEl  = document.getElementById('bubble-icon');

    bubble.classList.add('fade-out');
    setTimeout(() => {
        textEl.innerHTML   = step.narration;
        iconEl.textContent = step.icon;
        bubble.className   = `narration-bubble pos-${step.pos}`;
    }, 210);

    const isLastStep = stepIdx === ex.steps.length - 1;
    const isLastEx   = exIdx   === TUTORIAL.length  - 1;
    const btnNext    = document.getElementById('btn-next');

    if (isLastStep && isLastEx) {
        btnNext.textContent = '🎮 Ves a jugar!';
        btnNext.className   = 'btn-next-step btn-finish';
    } else if (isLastStep) {
        btnNext.textContent = 'Exemple següent →';
        btnNext.className   = 'btn-next-step btn-next-example';
    } else {
        btnNext.textContent = 'Següent →';
        btnNext.className   = 'btn-next-step';
    }
}


/* ================================================================
   CLIC AL BOTÓ SEGÜENT
   ================================================================ */
document.getElementById('btn-next').addEventListener('click', () => {
    const ex = TUTORIAL[exIdx];
    if (stepIdx < ex.steps.length - 1) {
        stepIdx++;
    } else if (exIdx < TUTORIAL.length - 1) {
        exIdx++;
        stepIdx = 0;
    } else {
        window.location.href = 'recta-numerica.html';
        return;
    }
    render();
});


/* ================================================================
   ARRENCADA
   ================================================================ */
render();

function triggerAttention() {
    const btn = document.getElementById('btn-next');
    btn.classList.remove('attention');
    void btn.offsetWidth;
    btn.classList.add('attention');
    btn.addEventListener('animationend', () => btn.classList.remove('attention'), { once: true });
}

setTimeout(triggerAttention, 4000);

document.addEventListener('click', (e) => {
    const btn = document.getElementById('btn-next');
    if (!btn.contains(e.target)) triggerAttention();
});
</script>
