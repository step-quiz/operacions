<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Activitat interactiva de matemàtiques — Step Quiz">
    <link rel="icon" href="icon.png">
    <title>Diners i canvi</title>

    <!--
    ============================================================
    FITXER: diners.html
    ROL: Activitat de càlcul amb decimals en context de compra.
         Suma de preus, càlcul de canvi i selecció de bitllet.

    NIVELLS (via ?nivell=):
      Nivell 1: 1 producte, cèntims variats, bitllet 5 € o 10 €.
                Un pas: calcular canvi.
      Nivell 2: 2–3 productes, cèntims variats, bitllet 10 € o 20 €.
                Dos passos: total → canvi.  (default)
      Nivell 3: 2–3 productes, cèntims variats.
                Tres passos: total → triar bitllet òptim → canvi.
      Nivell 4: Quantitats (ex: "2 × Llet a 1,35 €") + total → canvi.
                Bitllet 20 € o 50 €.

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 6)
      ?maxintents=N       (default 3)
      ?maxenllocmitjana=  (default 1)

    JAVASCRIPT: js/decimals/decimals.js (mòdul ES; importa utils, config i game-core)
    ============================================================
    -->

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    6,
            defaultIntents:       3,
            defaultEnllocMitjana: 1
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">

    <style>
        :root {
            --bg-color:      #f8fafc;
            --primary:       #0369a1;
            --primary-light: #e0f2fe;
            --primary-hover: #2563eb;
        }

        /* ── BOTIGA: productes + bitllet ─────────────────────── */
        .shop-display {
            padding: 24px 20px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .products-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 18px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            min-width: 100px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .product-emoji { font-size: 2.5em; line-height: 1; }
        .product-name  { font-size: 0.95em; color: var(--text-muted); font-weight: 600; }
        .product-price {
            font-size: 1.4em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #1e293b;
        }
        /* Quantitat (nivell 4) */
        .product-qty {
            font-size: 0.85em;
            color: var(--primary);
            font-weight: 700;
        }

        .products-plus {
            font-size: 1.6em;
            font-weight: bold;
            color: #94a3b8;
            align-self: center;
        }

        .bill-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            color: #166534;
        }
        .bill-emoji { font-size: 1.5em; }

        /* ── PANELL DE RESOLUCIÓ ─────────────────────────────── */
        .resolution-panel {
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 24px 20px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        /* Pas completat (feedback inline) */
        .step-done {
            color: var(--success);
            font-weight: 700;
            font-size: 1.05em;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .step-prompt {
            font-size: 1.15em;
            font-weight: 700;
            color: #334155;
            text-align: center;
        }

        /* ── PAS: INPUT NUMÈRIC ──────────────────────────────── */
        .step-container { display: none; flex-direction: column; align-items: center; width: 100%; gap: 12px; animation: fadeIn 0.3s; }
        .step-container.active { display: flex; }

        /* CANVI UX: input + € + OK + feedback en una sola fila horitzontal.
           align-items: center assegura l'alineació vertical correcta del botó. */
        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.8em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        input[type="text"]#value-input {
            width: 140px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]#value-input:focus {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        /* CANVI UX: estat error-val — mostra en vermell el text incorrecte
           que l'alumne ha escrit, mentre es llegeix el missatge pedagògic.
           Es neteja automàticament quan l'alumne modifica/esborra el contingut. */
        input[type="text"]#value-input.error-val {
            border-color: var(--danger) !important;
            background: #fef2f2 !important;
            color: var(--danger);
        }

        .answer-unit {
            color: var(--text-muted);
            font-size: 0.75em;
        }

        /* ── PAS: SELECCIÓ DE BITLLET (nivell 3) ─────────────── */
        .bill-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .bill-option-btn {
            background: #ffffff;
            border: 2px solid var(--border-heavy);
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 1.2em;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            color: #334155;
        }
        .bill-option-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .bill-option-btn:active { transform: scale(0.95); }
        @media (hover: hover) {
            .bill-option-btn:hover {
                background: var(--primary-light);
                border-color: var(--primary);
                color: var(--primary);
            }
        }
        .bill-option-btn.error-shake {
            background-color: var(--danger-light) !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
            animation: shake 0.2s;
        }
        .bill-option-btn.correct {
            background: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }

        /* ── MISSATGE PEDAGÒGIC D'ERROR (diners-feedback.js) ────
         * Apareix sota l'input quan hi ha un patró d'error reconegut.
         * Es neteja en cada nova operació o en avançar al pas següent. */
        #step-hint {
            min-height: 1.4em;   /* reserva espai per evitar salts de layout */
            font-size: 0.95em;
            font-weight: 600;
            color: #92400e;
            background: #fffbeb;
            border: 1.5px solid #fde68a;
            border-radius: 8px;
            padding: 6px 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        #step-hint.visible { display: block; }

        /* ── FEEDBACK INLINE (dins answer-row, a la dreta del botó OK) ──
         * CANVI UX: substitueix el mini-overlay de game-core.
         * Ara viu dins la mateixa fila que l'input i el botó OK. */
        #inline-feedback {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.55em;   /* relatiu al font-size 1.8em d'answer-row */
            font-weight: 700;
            white-space: nowrap;
            animation: fadeIn 0.2s ease;
        }
        #inline-feedback.visible { display: flex; }
        #inline-feedback.success { color: var(--success); }
        #inline-feedback.failure { color: var(--danger); }

        /* ── RESPONSIU ────────────────────────────────────────── */
        @media (max-width: 480px) {
            .shop-display     { padding: 16px 12px 12px; gap: 10px; }
            .product-card     { padding: 10px 12px; min-width: 80px; }
            .product-emoji    { font-size: 2em; }
            .product-price    { font-size: 1.2em; }
            .answer-row       { font-size: 1.5em; }
            input[type="text"]#value-input { width: 110px; padding: 10px; }
            .resolution-panel { padding: 16px 14px 18px; gap: 12px; }
            .step-prompt      { font-size: 1.05em; }
            .bill-option-btn  { padding: 10px 16px; font-size: 1.05em; }
        }
        @media (max-width: 350px) {
            .product-emoji { font-size: 1.6em; }
            .product-card  { min-width: 70px; padding: 8px 10px; }
        }

        /* ── BOTÓ "PASSAR AL NIVELL X" ───────────────────────────
         * Apareix a l'esquerra del comptador d'intents, a la capçalera.
         * Només visible quan NIVELL < 4 (no es pot pujar del nivell màxim).
         * En mòbil ocupa tota l'amplada per coherència amb la capçalera
         * en mode columna (flex-direction: column a @480px de shared.css).
         * ────────────────────────────────────────────────────────── */
        #btn-next-level {
            display: none;          /* ocult per defecte; JS el mostra si NIVELL < 4 */
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            font-size: 0.85em;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        #btn-next-level.visible { display: inline-flex; }
        @media (hover: hover) {
            #btn-next-level:hover { background: #bae6fd; }
        }
        #btn-next-level:active { transform: scale(0.96); }
        @media (max-width: 480px) {
            #btn-next-level { width: 100%; justify-content: center; }
        }
    </style>
    <link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Diners i canvi</h1>
</div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">

        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display">Sessió 1 de 1</div>
                <div class="level-text"   id="lvl-display">Compra 1 de 6</div>
            </div>
            <div class="score-text" id="score-display">Punts: 0</div>
            <!-- CANVI UX: botó per pujar de nivell (mai baixar).
                 Es mostra a l'esquerra dels intents, només si NIVELL < 4. -->
            <button id="btn-next-level" aria-label="Passar al nivell següent"></button>
            <div id="attempts-display" class="attempts-counter">Intents: 3</div>
        </div>

        <!-- Botiga -->
        <div class="shop-display" id="shop-display"></div>

        <!-- Panell de resolució (passos encadenats) -->
        <div class="resolution-panel" id="resolution-panel">

            <!-- Indicadors de passos completats -->
            <div id="steps-done"></div>

            <!-- Pas actiu: pregunta + input o botons -->
            <div class="step-container active" id="step-active">
                <div class="step-prompt" id="step-prompt"></div>

                <!-- CANVI UX: input, €, OK i feedback inline tots en una sola fila.
                     Evita el scroll vertical en pantalles PC. -->
                <div class="answer-row" id="answer-row">
                    <input type="text" id="value-input" autocomplete="off"
                           aria-label="Escriu la resposta">
                    <span class="answer-unit">€</span>
                    <button class="btn-submit" id="btn-submit-val" onclick="checkValue()">OK</button>
                    <div id="inline-feedback" aria-live="assertive"></div>
                </div>

                <!-- Missatge pedagògic d'error (diners-feedback.js).
                     Apareix sota l'input quan l'alumne s'equivoca i hi ha
                     un patró reconegut. S'esborra en cada nova operació. -->
                <div id="step-hint" aria-live="polite"></div>

                <!-- Botons de bitllet (nivell 3, pas 2) -->
                <div class="bill-options" id="bill-options" style="display:none;"></div>
            </div>

        </div>

    </div>
</div>


<script type="module" src="js/decimals/decimals.js"></script>
</body>
</html>
