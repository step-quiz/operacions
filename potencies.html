<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Activitat interactiva de matemàtiques — Potències">
    <link rel="icon" href="icon.png">
    <title>Potències — ESO</title>

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    4,
            defaultIntents:       4,
            defaultEnllocMitjana: 1
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">

    <style>
        /* ── Variables de color ─────────────────────────────── */
        :root {
            --primary:       #4f46e5;
            --primary-light: #e0e7ff;
            --primary-hover: #4338ca;
            --primary-dark:  #3730a3;
            --bg-color:      #f5f3ff;
        }

        /* ── Overrides de shared.css ────────────────────────── */
        h1           { color: var(--primary-dark); }
        .header-info { background-color: #eef2ff; }
        .level-text  { color: var(--primary-dark); }
        .score-text  { color: var(--primary); }
        .panel       { border-top-color: var(--primary); }

        /* ── PANTALLA DE SELECCIÓ ────────────────────────────── */
        #selection-screen    { padding: 30px 20px; text-align: center; }
        #selection-screen h2 { color: #334155; font-size: 1.4em; margin-bottom: 20px; }
        .selection-cards {
            display: flex; flex-direction: column; gap: 12px;
            max-width: 440px; margin: 0 auto;
        }
        .selection-card {
            background: white; border: 2px solid var(--border-heavy); border-radius: 10px;
            padding: 20px 18px; cursor: pointer; transition: all .2s; text-align: left;
            display: flex; align-items: center; gap: 16px; font-family: inherit; width: 100%;
        }
        .selection-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .selection-card:active { transform: scale(0.97); }
        @media (hover:hover) {
            .selection-card:hover {
                border-color: var(--primary); background: var(--primary-light);
                transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,70,229,.15);
            }
        }
        /* [ROUND 1 — .selection-icon eliminat; fonts +40%] */
        .selection-text h3  { margin: 0 0 4px 0; color: #334155; font-size: 1.47em; }
        .selection-text p   { margin: 0; color: var(--text-muted); font-size: 1.26em; }

        /* ── EXPRESSION BOX ──────────────────────────────────── */
        .expression-box {
            padding: 35px 20px; text-align: center;
            display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 6px;
            font-size: 2em; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; min-height: 115px; line-height: 1.8;
        }
        .expr-sup  { font-size: .52em; vertical-align: super; line-height: 0; }
        .expr-op   { padding: 0 6px; color: #475569; }
        .expr-eq   { padding: 0 10px; color: var(--text-muted); }
        .expr-frac {
            display: inline-flex; flex-direction: column; align-items: center;
            vertical-align: middle; font-size: .8em; gap: 0;
        }
        .expr-frac-num { padding: 2px 8px 4px; border-bottom: 3px solid currentColor; }
        .expr-frac-den { padding: 4px 8px 2px; }
        .expr-result   { color: var(--success); }

        /* [ROUND 2 — input com a exponent real dins l'expression-box] */
        .expr-base-sup { display: inline-block; position: relative; }
        .expr-sup-input {
            position: absolute;
            top: -0.45em;          /* puja l'input com un exponent real */
            left: 100%;
            width: 42px; height: 36px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.48em;     /* ~0.96em a nivell de body */
            font-weight: bold; text-align: center;
            border: 2.5px solid var(--primary); border-radius: 6px;
            background: var(--primary-light); outline: none; color: #1e293b;
            -moz-appearance: textfield;
        }
        .expr-sup-input:focus { background: #c7d2fe; box-shadow: 0 0 0 3px rgba(79,70,229,.25); }
        .expr-sup-input::-webkit-inner-spin-button,
        .expr-sup-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .expr-sup-input.error-flash {
            border-color: var(--danger); background: var(--danger-light); animation: shake .25s;
        }
        /* Espai extra a la dreta de la base per no solapar l'input */
        .expr-base-sup-pad { margin-right: 2.2em; }

        /* [ROUND 5 — input inline per al resultat numèric directe (Repte 2, pas 2)] */
        .expr-inline-input {
            display: inline-block;
            width: 90px; height: 52px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75em; font-weight: bold; text-align: center;
            border: 2.5px solid var(--primary); border-radius: 8px;
            background: var(--primary-light); outline: none; color: #1e293b;
            vertical-align: middle; margin-left: 6px;
            -moz-appearance: textfield;
        }
        .expr-inline-input:focus { background: #c7d2fe; box-shadow: 0 0 0 3px rgba(79,70,229,.25); }
        .expr-inline-input::-webkit-inner-spin-button,
        .expr-inline-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .expr-inline-input.error-flash {
            border-color: var(--danger); background: var(--danger-light); animation: shake .25s;
        }

        /* ── SCHEMA ROW ──────────────────────────────────────── */
        .schema-row {
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
            gap: 6px; font-family: 'Courier New', Courier, monospace; font-weight: bold;
            font-size: 1.5em; margin-bottom: 12px; animation: fadeIn .3s;
            min-height: 60px;
        }
        .schema-text     { color: #334155; white-space: nowrap; }
        .schema-text sup { font-size: .52em; vertical-align: super; line-height: 0; }
        .schema-eq       { padding: 0 8px; color: var(--text-muted); }
        .schema-input {
            width: 60px; height: 50px;
            font-family: 'Courier New', Courier, monospace; font-size: .9em; font-weight: bold;
            text-align: center; border: 3px solid var(--primary); border-radius: 8px;
            background: var(--primary-light); outline: none; color: #1e293b;
            -moz-appearance: textfield;
        }
        .schema-input:focus { background: #c7d2fe; box-shadow: 0 0 0 3px rgba(79,70,229,.25); }
        .schema-input::-webkit-inner-spin-button,
        .schema-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .schema-input.error-flash {
            border-color: var(--danger); background: var(--danger-light); animation: shake .25s;
        }

        /* ── BOTONS DE SELECCIÓ (dins el pas) ────────────────── */
        .schema-btns {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
            margin: 4px 0 12px;
        }
        .schema-btn {
            padding: 11px 22px; border: 2.5px solid var(--primary); border-radius: 8px;
            background: white; color: var(--primary); font-weight: bold; font-size: .95em;
            cursor: pointer; transition: all .15s; font-family: inherit; touch-action: manipulation;
        }
        .schema-btn:active { transform: scale(.95); }
        @media (hover:hover) { .schema-btn:hover { background: var(--primary); color: white; } }
        .schema-btn.selected { background: var(--primary); color: white; border-color: var(--primary-dark); }
        .schema-btn.error-flash {
            border-color: var(--danger); background: var(--danger-light); color: var(--danger);
            animation: shake .25s;
        }

        /* ── PANELL DE RESOLUCIÓ ─────────────────────────────── */
        .resolution-panel {
            background-color: var(--bg-color); border-top: 1px solid var(--border-color);
            padding: 25px 20px; display: none; flex-direction: column; align-items: center;
            width: 100%;
        }
        .step-container       { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn .3s; }
        .step-container.active { display: flex; }
        .step-title {
            font-size: 1.05em; color: #475569; margin-bottom: 12px;
            font-weight: bold; text-align: center; line-height: 1.45;
            max-width: 560px;
        }
        #step-feedback {
            margin-top: 6px; font-size: .95em; color: var(--text-muted);
            text-align: center; min-height: 1.3em;
        }
        #step-feedback.important { color: #b45309; font-weight: bold; }
        #step-feedback.error     { color: #dc2626; font-weight: bold; }

        .btn-submit-schema {
            background-color: #475569; color: white; border: none;
            padding: 12px 28px; font-size: 1em; font-weight: bold; border-radius: 6px;
            cursor: pointer; text-transform: uppercase; touch-action: manipulation; margin-top: 14px;
        }
        .btn-submit-schema:active { transform: scale(.95); }
        @media (hover:hover) { .btn-submit-schema:hover { background-color: #334155; } }
        .btn-submit-schema.error-shake { background-color: var(--danger); animation: shake .25s; }

        /* ── MISC ────────────────────────────────────────────── */
        .attempts-counter.blink { animation: attemptsBlink .2s linear 5; }
        @keyframes attemptsBlink {
            0%, 100% { background-color: #fef3c7; border-color: #d1d5db; color: #334155; }
            50%      { background-color: #e5e7eb; border-color: #f59e0b; color: #334155; }
        }
        /* [ROUND 4 — overlay posicionat sota l'expression-box; no tapa l'expressió] */
        #mini-victory-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: auto;
            background: transparent; z-index: 100;
            justify-content: center; align-items: flex-end;
            padding: 0 20px 24px; pointer-events: none;
            border-radius: 0 0 8px 8px; border-top: none;
        }

        /* ── RESPONSIU ───────────────────────────────────────── */
        @media (max-width: 480px) {
            .expression-box { font-size: 1.6em; padding: 28px 12px; min-height: 90px; }
            .schema-row     { font-size: 1.25em; }
            .schema-input   { width: 50px; height: 44px; }
            .selection-btn     { padding: 9px 16px; font-size: .88em; }
        }
        @media (max-width: 350px) {
            .expression-box { font-size: 1.35em; }
            .schema-row     { font-size: 1.1em; }
            .schema-input   { width: 44px; height: 40px; }
        }
    </style>
<link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Potències</h1>
</div>


<div class="panel" id="main-panel">

    <!-- ── PANTALLA DE SELECCIÓ ── -->
    <div id="selection-screen">
        <h2>Selecciona un repte</h2>
        <div class="selection-cards">

            <button class="selection-card" onclick="selectRepte(1)">
                <div class="selection-text">
                    <h3>Propietats de les potències</h3>
                    <p>Producte, quocient i potència de potència</p>
                </div>
            </button>

            <button class="selection-card" onclick="selectRepte(2)">
                <div class="selection-text">
                    <h3>Base negativa</h3>
                    <p>Distingeix (−a)<sup>n</sup> de −a<sup>n</sup></p>
                </div>
            </button>

            <button class="selection-card" onclick="selectRepte(3)">
                <div class="selection-text">
                    <h3>Notació científica</h3>
                    <p>Passa nombres a notació científica i viceversa</p>
                </div>
            </button>

        </div>
    </div>

    <!-- ── PANTALLA DE JOC ── -->
    <div id="game-screen" style="display:none;">
        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display"></div>
                <div class="level-text"   id="lvl-display"></div>
            </div>
            <div class="score-text"    id="score-display">Punts: 0</div>
            <div id="attempts-display" class="attempts-counter"></div>
        </div>

        <div class="expression-box" id="expression-box"></div>

        <div class="resolution-panel" id="resolution-panel">
            <div class="step-container" id="current-step">
                <div  class="step-title" id="step-title"></div>
                <div  class="schema-row" id="step-schema"></div>
                <div  id="step-btns"></div>
                <div  id="step-feedback"></div>
                <button class="btn-submit-schema" id="btn-submit-step" onclick="checkStep()">OK</button>
            </div>
        </div>
    </div>
    <!-- #mini-victory-overlay, #session-end-screen, #final-screen → injectats per injectSharedHTML() -->
</div>

<script type="module" src="js/potencies/potencies.js"></script>
</body>
</html>
