<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sessions fixes (?fixed=A/B/C): ha de ser el PRIMER script -->
    <meta name="description" content="Activitat interactiva de matemàtiques — Step Quiz">
    <link rel="icon" href="icon.png">
    <title>Regla de Ruffini</title>
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #ede9fe;
            --gris: #64748b;
            --gris-fosc: #334155;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;

            /* ════ TEMPS CSS ════════════════════════════════════════════════
               Sincronitza amb les constants JS T_* al principi del <script>  */
            --t-anim-pop:    0.35s;   /* pop-in d'una cel·la confirmada      */
            --t-anim-shake:  0.30s;   /* shake d'una cel·la incorrecta       */
            --t-anim-flash:  0.60s;   /* flash verd→blanc quan residu = 0    */
            --t-attract-dur: 0.70s;   /* durada del blink-shake candidats    */
            --t-fade-out:    0.50s;   /* fade-out del missatge "arrel"       */
            /* ═══════════════════════════════════════════════════════════════ */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh; min-height: 100dvh; /* [FIX BUG4] */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            color: var(--gris-fosc);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #1e293b;
            text-align: center;
            margin: 8px 0 16px;
        }

        .title-row { display:flex; align-items:center; justify-content:center; gap:14px; }
        .home-icon-link { display:block; width:58px; height:58px; flex-shrink:0; opacity:.75; transition:opacity .2s ease; }
        .home-icon-link:hover { opacity:1; }
        .home-icon-link img { width:100%; height:100%; object-fit:contain; }

        .toolbar {
            display: flex;
            gap: 2rem;
            font-size: 0.85rem;
            color: var(--gris);
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
        .toolbar select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-heavy);
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .app-card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 28px 36px;
            width: 100%;
            max-width: 820px;
        }

        .poly-display {
            text-align: center;
            font-size: 1.12rem;   /* 1.6rem × 0.70 ≈ 1.12rem */
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .poly-display sup { font-size: 0.7em; }

        /* Fila polinomi + comptador d'errors */
        .poly-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .poly-row .poly-display { margin-bottom: 0; }

        .btn-errors {
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1.5px solid #cbd5e1;
            background: #f1f5f9;
            color: var(--gris);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: default;
            white-space: nowrap;
        }
        .btn-errors.finished {
            background: var(--primary);
            border-color: var(--primary-dark);
            color: white;
        }

        .hint-box {
            background: var(--primary-light);
            border: 1px solid #c4b5fd;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-bottom: 18px;
            text-align: center;
        }
        .hint-box strong { font-weight: 700; }

        .candidates-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            margin-bottom: 4px;
        }
        #nextStepSlot { flex-shrink: 0; }
        .candidates-right { display: flex; flex-direction: column; align-items: center; }
        .candidates-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gris);
            margin-bottom: 8px;
        }
        .candidates-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 24px;
            align-items: center;
        }
        .candidates-grid {
            display: inline-grid;
            row-gap: 6px;
            column-gap: 8px;
        }

        @keyframes candidates-attract {
            0%   { transform: translateX(0);    box-shadow: 0 0 0 0px var(--primary-light); }
            15%  { transform: translateX(-2px); box-shadow: 0 0 0 6px var(--primary-light); }
            30%  { transform: translateX(2px);  box-shadow: 0 0 0 0px var(--primary-light); }
            45%  { transform: translateX(-2px); box-shadow: 0 0 0 6px var(--primary-light); }
            60%  { transform: translateX(2px);  box-shadow: 0 0 0 0px var(--primary-light); }
            75%  { transform: translateX(-1px); box-shadow: 0 0 0 6px var(--primary-light); }
            90%  { transform: translateX(1px);  box-shadow: 0 0 0 0px var(--primary-light); }
            100% { transform: translateX(0);    box-shadow: 0 0 0 0px var(--primary-light); }
        }
        .candidates-attract {
            border-radius: 12px;
            animation: candidates-attract var(--t-attract-dur) ease-in-out;
        }
        .btn-candidate {
            min-width: 44px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 2px solid var(--border-heavy);
            background: white;
            font-size: 1rem;
            font-weight: 700;
            color: var(--gris-fosc);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-candidate:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
        .btn-candidate:disabled { opacity: 0.35; cursor: default; }
        .btn-candidate.tried-wrong {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #b91c1c;
            text-decoration: line-through;
        }
        .btn-candidate.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .ruffini-wrapper {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        .ruffini-table {
            border-collapse: separate;
            border-spacing: 0;
            margin: 0 auto;
        }
        .ruffini-table td {
            text-align: center;
            vertical-align: middle;
            padding: 0;
            height: 52px;
        }
        .cell-root {
            width: 54px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            border-right: 3px solid #1e293b;
            padding-right: 10px;
        }
        .cell-coef {
            width: 70px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
        }
        .cell-prod {
            width: 70px;
            font-size: 1.1rem;
            color: var(--gris);
            font-style: italic;
            height: 30px;
            vertical-align: bottom;
            padding-bottom: 2px;
        }
        .row-divider td {
            border-top: 2.5px solid #1e293b;
            padding-top: 6px;
        }
        .cell-result { width: 70px; height: 52px; }
        .cell-input {
            width: 58px;
            height: 44px;
            text-align: center;
            border: 2.5px solid var(--border-heavy);
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            background: #f8fafc;
            transition: border-color 0.2s, background 0.2s;
        }
        .cell-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .cell-input:disabled {
            background: white;
            border-color: transparent;
            color: #1e293b;
            cursor: default;
        }
        .cell-input.confirmed {
            background: white;
            border-color: transparent;
            color: #1e293b;
        }
        .cell-input.confirmed-root { color: #1e293b; }
        .cell-input.kb-selected {
            background: var(--primary);
            border-color: var(--primary-dark);
            color: white;
        }
        .cell-remainder .cell-input { border-style: solid; border-width: 2.5px; }
        .cell-remainder .cell-input.confirmed { border-color: transparent; }

        @keyframes pop-in {
            0%   { transform: scale(0.5); opacity: 0; }
            70%  { transform: scale(1.1); }
            100% { transform: scale(1);   opacity: 1; }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%     { transform: translateX(-6px); }
            75%     { transform: translateX(6px); }
        }
        @keyframes flash-green {
            0%   { background: var(--success-light); border-color: var(--success); }
            100% { background: white; border-color: transparent; }
        }
        .anim-pop   { animation: pop-in      var(--t-anim-pop)   cubic-bezier(0.34,1.56,0.64,1); }
        .anim-shake { animation: shake       var(--t-anim-shake) ease-in-out; }
        .anim-flash { animation: flash-green var(--t-anim-flash) ease-out forwards; }

        .feedback {
            min-height: 2rem;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 8px;
            margin-bottom: 16px;
            transition: opacity var(--t-fade-out) ease;
        }
        .feedback.fade-out { opacity: 0; }

        .btn-check {
            display: block;
            margin: 0 auto;
            padding: 14px 36px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
            transition: 0.1s;
        }
        .btn-check:hover  { background: var(--primary-dark); }
        .btn-check:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--primary-dark); }

        .btn-check-sm {
            display: block;
            padding: 8px 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--primary-dark);
            transition: 0.1s;
            white-space: nowrap;
        }
        .btn-check-sm:hover  { background: var(--primary-dark); }
        .btn-check-sm:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary-dark); }

        .btn-mini {
            display: block;
            margin: 10px auto 0;
            padding: 8px 20px;
            background: #e2e8f0;
            color: var(--gris-fosc);
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-mini:hover { background: #cbd5e1; }

        .result-box {
            background: var(--success-light);
            border: 2px solid #86efac;
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
            margin-top: 16px;
        }
        .result-box .result-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 6px;
        }
        .result-box .result-expr {
            font-size: 1.3rem;
            font-weight: 700;
            color: #166534;
        }

        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }

        #customKeyboard {
            display: none;
            background: #f1f5f9;
            border: 2px solid var(--border-heavy);
            border-radius: 12px;
            padding: 12px 12px 16px;
            margin-top: 12px;
        }
        #customKeyboard.kb-visible { display: block; }
        .kb-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .kb-row:last-child { margin-bottom: 0; }
        .kb-btn {
            width: 58px; height: 52px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            background: white;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            box-shadow: 0 2px 0 #cbd5e1;
            transition: 0.08s;
            display: flex; align-items: center; justify-content: center;
        }
        .kb-btn:active { transform: translateY(2px); box-shadow: none; }
        .kb-btn.kb-enter {
            width: 80px;
            background: var(--primary);
            border-color: var(--primary-dark);
            color: white;
            box-shadow: 0 2px 0 var(--primary-dark);
            font-size: 1.5rem;
        }
        .kb-btn.kb-minus { background: #f8fafc; color: var(--primary); }
        .kb-btn.kb-del {
            background: #fff1f2;
            border-color: #fca5a5;
            color: #b91c1c;
            font-size: 1.1rem;
        }

        .debug-box {
            background: #fef08a;
            border: 2px dashed #ca8a04;
            border-radius: 8px;
            padding: 6px 14px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #78350f;
            margin-bottom: 14px;
            text-align: center;
        }
        .debug-box strong { color: #92400e; }

        @media (max-width: 600px) {
            .app-card { padding: 18px 14px; }
            .cell-coef, .cell-prod, .cell-result, .cell-input { width: 56px; }
            .cell-root { width: 44px; font-size: 1.1rem; }
            .cell-input { width: 46px; height: 40px; font-size: 1rem; }
        }

        /* ── Mòbil horitzontal: compactar zones superiors i reduir teclat ── */
        @media (orientation: landscape) and (max-height: 500px) {
            h1 { font-size: 1.1rem; margin: 4px 0 8px; }
            .app-card { padding: 10px 14px; }
            .toolbar { padding-bottom: 8px; margin-bottom: 10px; gap: 1rem; }
            .debug-box { padding: 3px 10px; font-size: 0.78rem; margin-bottom: 6px; }
            .poly-display { font-size: 0.95rem; margin-bottom: 8px; }
            .hint-box { padding: 6px 12px; font-size: 0.78rem; margin-bottom: 10px; }
            .candidates-label { font-size: 0.7rem; margin-bottom: 4px; }
            .candidates-row { margin-bottom: 10px; }
            .btn-candidate { padding: 5px 10px; font-size: 0.85rem; }

            /* Teclat més petit */
            .kb-btn { width: 48px; height: 40px; font-size: 1.1rem; }
            .kb-btn.kb-enter { width: 64px; font-size: 1.2rem; }
            .kb-row { gap: 5px; margin-bottom: 5px; }
            #customKeyboard { padding: 7px 10px 10px; margin-top: 8px; }
            .kb-btn[style] { width: 107px !important; } /* botó 0 ample */
        }
    </style>
<link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="https://step-quiz.net" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Regla de Ruffini</h1>
</div>

<div class="app-card">
    <div class="toolbar">
        <label>Grau del polinomi:
            <select id="degreeSelect" onchange="initApp()">
                <option value="3" selected>Grau 3</option>
                <option value="4">Grau 4</option>
            </select>
        </label>
        <label>Tipus:
            <select id="monicSelect" onchange="initApp()">
                <option value="monic" selected>Polinomi mònic</option>
                <option value="nonmonic">Polinomi no mònic</option>
            </select>
        </label>
    </div>

    <div id="debugBox" class="debug-box"></div>
    <div class="poly-row">
        <button id="errorsBtn" class="btn-errors">errors: <span id="errorsCount">0</span></button>
        <div id="polyDisplay" class="poly-display"></div>
    </div>
    <div id="hintBox" class="hint-box"></div>

    <div class="candidates-area">
        <div id="nextStepSlot"></div>
        <div class="candidates-right">
            <div class="candidates-label">Escull un valor candidat a ser arrel:</div>
            <div id="candidatesRow" class="candidates-row"></div>
        </div>
    </div>

    <div id="rootFoundMsg" class="feedback"></div>

    <div class="ruffini-wrapper">
        <table class="ruffini-table" id="ruffiniTable"></table>
    </div>

    <!-- Teclat custom per a mòbil/tàctil — inline, just sota la taula -->
    <div id="customKeyboard">
        <div class="kb-row">
            <button class="kb-btn" data-key="7">7</button>
            <button class="kb-btn" data-key="8">8</button>
            <button class="kb-btn" data-key="9">9</button>
            <button class="kb-btn kb-del" data-key="del">⌫</button>
        </div>
        <div class="kb-row">
            <button class="kb-btn" data-key="4">4</button>
            <button class="kb-btn" data-key="5">5</button>
            <button class="kb-btn" data-key="6">6</button>
            <button class="kb-btn kb-minus" data-key="-">−</button>
        </div>
        <div class="kb-row">
            <button class="kb-btn" data-key="1">1</button>
            <button class="kb-btn" data-key="2">2</button>
            <button class="kb-btn" data-key="3">3</button>
            <button class="kb-btn kb-enter" data-key="enter">→</button>
        </div>
        <div class="kb-row">
            <button class="kb-btn" style="width:134px" data-key="0">0</button>
        </div>
    </div>

    <div id="feedback" class="feedback"></div>
    <div id="actionArea"></div>
    <div id="resultBox"></div>
</div>

<script type="module" src="js/ruffini/ruffini.js"></script>

</body>
</html>
