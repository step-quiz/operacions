<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Activitat interactiva de matemàtiques — Prioritat d'operacions (Step Quiz)">
    <link rel="icon" href="icon.png">
    <title>Prioritat d'Operacions</title>

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    10,
            defaultIntents:       2,
            defaultEnllocMitjana: 1
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">

    <style>
        /* ---- Variables de color específiques (paleta violeta, com vocabulari.html) ---- */
        :root {
            --bg-color:      #fafaf7;
            --primary:       #7c3aed;
            --primary-light: #ede9fe;
            --primary-hover: #6d28d9;
            --primary-dark:  #4c1d95;
            --dest:          #00008b; /* «destaca»: el darkblue del projecte combinades */
        }

        /* ---- Overrides de shared.css ---- */
        h1 { color: var(--primary-dark); }
        .header-info { background-color: #f5f3ff; }
        .level-text  { font-size: 1.1em; color: var(--primary-dark); }
        .score-text  { color: var(--primary); }
        .btn-submit  { background-color: var(--primary-dark); }
        @media (hover: hover) { .btn-submit:hover { background-color: var(--primary-hover); } }

        /* ══════════════════════════════════════════════
           EXPRESSIÓ MATEMÀTICA
        ══════════════════════════════════════════════ */
        .expression-box {
            padding: 34px 20px 18px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 1.9em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            min-height: 100px;
            line-height: 1.5;
            color: #1e293b;
        }
        .tok-op    { color: #334155; padding: 0 2px; }
        .tok-paren { color: #475569; }
        .expression-box .tok-lp { margin-right: -5px; }
        .expression-box .tok-rp { margin-left: -5px; }
        .tok-pow sup {
            font-size: 0.62em;
            position: relative;
            top: -0.15em;
            margin-left: 1px;
        }

        .step-instruction {
            padding: 0 20px 14px 20px;
            text-align: center;
            color: #475569;
            font-weight: 600;
            font-size: 1.1em;
        }
        .step-instruction:empty { display: none; }

        /* Missatge diagnòstic quan l'alumne s'equivoca */
        .feedback {
            margin: 0 auto 14px auto;
            padding: 10px 16px;
            max-width: 560px;
            width: calc(100% - 40px);
            text-align: center;
            color: #991b1b;
            background: var(--danger-light);
            border: 1px solid #fecaca;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.98em;
            line-height: 1.4;
            animation: fadeIn 0.3s;
        }
        .feedback:empty { display: none; }

        /* ══════════════════════════════════════════════
           ZONA DE JOC: casella + xips (patró de vocabulari.html)
        ══════════════════════════════════════════════ */
        #answer-zone-wrap {
            padding: 8px 20px 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .drop-zone {
            min-width: 130px;
            min-height: 64px;
            border: 3px dashed var(--border-heavy);
            border-radius: 12px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.6em;
            font-weight: bold;
            color: var(--text-muted);
            transition: all 0.2s;
            padding: 6px 18px;
        }
        .drop-zone .dz-placeholder { font-size: 0.5em; font-family: 'Segoe UI', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .drop-zone.dz-over    { background: var(--primary-light); border-color: var(--primary); border-style: solid; }
        .drop-zone.dz-correct { background: #d1fae5; border-color: var(--success); border-style: solid; color: #065f46; }
        .drop-zone.dz-wrong   { background: #fee2e2; border-color: var(--danger); border-style: solid; color: #991b1b; animation: shake 0.3s; }
        .drop-zone.dz-reveal  { background: #fef3c7; border-color: #f59e0b; border-style: solid; color: #92400e; }

        #chip-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            max-width: 620px;
        }

        .num-chip {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 12px 22px;
            min-height: 48px;
            min-width: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3em;
            font-weight: 700;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s, background 0.15s;
        }
        .num-chip:active   { cursor: grabbing; }
        .num-chip.dragging { opacity: 0.35; }
        .num-chip.used     { opacity: 0.2; pointer-events: none; }
        .num-chip.chip-wrong {
            opacity: 0.45;
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
            text-decoration: line-through;
            pointer-events: none;
        }
        .num-chip.chip-selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
            transform: scale(1.08);
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.45);
        }
        @media (hover: hover) {
            .num-chip:not(.used):not(.chip-wrong):not(.dragging):not(.chip-selected):hover {
                background: #e2e8f0;
                border-color: #94a3b8;
                color: #1e293b;
            }
        }

        /* Xip fantasma pel drag tàctil (mateix patró que vocabulari.html) */
        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            background: var(--primary);
            color: white;
            border-radius: 14px;
            padding: 10px 20px;
            font-size: 1.3em;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
            display: none;
            white-space: nowrap;
        }

        /* ══════════════════════════════════════════════
           RESOLUCIÓ PAS A PAS (es mostra en acabar)
        ══════════════════════════════════════════════ */
        .solution-box {
            display: none;
            margin: 0 auto 20px auto;
            padding: 12px 18px;
            max-width: 560px;
            width: calc(100% - 40px);
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            border-radius: 10px;
            animation: fadeIn 0.3s;
        }
        .solution-title {
            text-align: center;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }
        /* ══════════════════════════════════════════════
           RESOLUCIÓ «CENTRADA» (les opcions «centrat» i «destaca» del projecte combinades)
           Una columna per a cada nombre, signe, potència i parèntesi de l'enunciat:
           el resultat d'una operació queda centrat sota el que substitueix, i
           l'operació que es fa a la línia següent va en blau fosc i subratllada.
        ══════════════════════════════════════════════ */
        .taula-wrap {
            max-width: 100%;
            overflow-x: auto; /* una expressió massa llarga per a la pantalla es desplaça; no es trenca */
        }
        table.centrat {
            border-collapse: collapse;
            margin: 0 auto;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #1e293b;
        }
        table.centrat td {
            padding: 0;
            text-align: center;
            vertical-align: baseline;
            white-space: nowrap;
            line-height: 1.9;
        }
        table.centrat td.tok-op,
        table.centrat td.igual  { padding: 0 0.3em; }
        table.centrat td.igual  { color: var(--text-muted); }
        table.centrat td.tok-paren { color: #475569; }
        table.centrat sup {
            font-size: 0.62em;
            line-height: 0;
            position: relative;
            top: -0.15em;
            margin-left: 1px;
        }
        table.centrat td.dest   { color: var(--dest); border-bottom: 0.09em solid currentColor; }
        /* Les línies que no ha fet l'alumne (Pas a pas, sense intents) */
        table.centrat tr.auto td { color: var(--text-muted); }
        .solution-box table.centrat { font-size: 1.25em; }

        /* ══════════════════════════════════════════════
           MODALITAT «PAS A PAS» (?modalitat=passos)
           La taula és la zona de treball: a la línia de sota, els signes i
           les potències són botons.
        ══════════════════════════════════════════════ */
        .steps-box { display: none; padding: 28px 12px 14px 12px; }
        body.mode-passos .steps-box { display: block; }
        body.mode-passos .expression-box,
        body.mode-passos .drop-zone { display: none; }
        body.mode-passos .num-chip { cursor: pointer; touch-action: manipulation; }
        .steps-box table.centrat { font-size: 1.7em; }
        .tok-btn {
            font: inherit;
            color: inherit;
            line-height: 1.35;
            margin: 0;
            padding: 0 0.12em;
            min-width: 1.35em;
            background: var(--primary-light);
            border: 2px solid #c4b5fd;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .tok-btn:focus-visible { outline: 3px solid var(--primary-dark); outline-offset: 2px; }
        @media (hover: hover) { .tok-btn:hover { background: #ddd6fe; border-color: var(--primary); } }
        .tok-btn.hl-red   { border-color: var(--danger);  background: var(--danger-light);  color: #991b1b; }
        .tok-btn.hl-green { border-color: var(--success); background: var(--success-light); color: #065f46; }

        /* ---- Marques del diagnòstic sobre l'expressió ---- */
        .expression-box .hl-red, .expression-box .hl-green {
            border-radius: 8px;
            padding: 0 8px;
            border: 3px solid;
        }
        .expression-box .hl-red   { border-color: var(--danger);  background: #fee2e2; color: #991b1b; }
        .expression-box .hl-green { border-color: var(--success); background: #d1fae5; color: #065f46; }
        .fb-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 16px;
            margin-top: 8px;
            font-size: 0.92em;
            color: #334155;
            font-weight: 600;
        }
        .fb-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .lg-box { width: 16px; height: 16px; border-radius: 4px; border: 3px solid; display: inline-block; flex-shrink: 0; }
        .lg-red   { border-color: var(--danger);  background: #fee2e2; }
        .lg-green { border-color: var(--success); background: #d1fae5; }

        /* ---- Botó "Següent" ---- */
        .btn-next {
            display: block;
            margin: 14px auto 2px auto;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 13px 34px;
            min-height: 48px;
            font-size: 1.05em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            touch-action: manipulation;
            box-shadow: 0 3px 10px rgba(124, 58, 237, 0.3);
            animation: fadeIn 0.3s;
        }
        .btn-next:focus-visible { outline: 3px solid var(--primary-dark); outline-offset: 2px; }
        .btn-next:active        { transform: scale(0.96); }
        .btn-next:disabled      { opacity: 0.6; cursor: default; }
        @media (hover: hover) { .btn-next:hover:not(:disabled) { background-color: var(--primary-hover); } }

        .hint-text {
            text-align: center;
            font-size: 0.85em;
            color: var(--text-muted);
            padding: 0 20px 14px 20px;
        }

        /* ---- Animació intents ---- */
        .attempts-counter.blink-error { animation: blink-violet 0.25s step-end infinite; border-color: #a855f7; }
        @keyframes blink-violet {
            0%, 100% { background-color: #f3e8ff; color: #6b21a8; }
            50%      { background-color: white; color: var(--text-muted); }
        }

        /* ---- Responsiu ---- */
        @media (max-width: 480px) {
            .expression-box   { font-size: 1.45em; padding: 22px 8px 14px 8px; gap: 5px; min-height: 70px; }
            .step-instruction { font-size: 1em; padding: 0 12px 12px 12px; }
            .feedback         { width: calc(100% - 24px); font-size: 0.92em; padding: 8px 12px; }
            .drop-zone        { min-width: 100px; min-height: 54px; font-size: 1.3em; padding: 5px 12px; }
            .num-chip         { padding: 9px 16px; font-size: 1.15em; min-height: 44px; }
            .solution-box     { width: calc(100% - 24px); padding: 10px 12px; }
            .solution-box table.centrat { font-size: 1.05em; }
            .steps-box        { padding: 20px 4px 10px 4px; }
            .steps-box table.centrat { font-size: 1.3em; }
            .tok-btn          { min-width: 1.7em; padding: 0.1em 0.15em; } /* prou grans per al dit */
            table.centrat td.tok-op,
            table.centrat td.igual { padding: 0 0.2em; }
            .expression-box .hl-red, .expression-box .hl-green { padding: 0 5px; border-width: 2px; }
        }
        @media (max-width: 350px) {
            .expression-box { font-size: 1.2em; }
        }
    </style>
<link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Prioritat d'Operacions</h1>
</div>

<div class="panel" id="main-panel">

    <div id="game-screen" style="display:none;">
        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display">Sessió 1 de 1</div>
                <div class="level-text"   id="lvl-display">Operació 1 de 10</div>
            </div>
            <div class="score-text" id="score-display">Punts: 0</div>
            <div id="attempts-display" class="attempts-counter">Intents: 2</div>
        </div>

        <div class="expression-box" id="expression-box" role="group" aria-label="Expressió matemàtica"></div>
        <div class="steps-box" id="steps-box" role="group" aria-label="Resolució pas a pas"></div>
        <div class="step-instruction" id="step-instruction" aria-live="polite">Quant val aquesta expressió?</div>
        <div class="feedback" id="feedback" aria-live="polite"></div>

        <div id="answer-zone-wrap">
            <div class="drop-zone" id="drop-zone" aria-label="Zona per deixar el resultat"></div>
            <div id="chip-pool" role="group" aria-label="Possibles resultats"></div>
        </div>

        <div class="solution-box" id="solution-box" aria-live="polite"></div>
        <div class="hint-text" id="hint-text"></div>
    </div>
</div>

<!-- Ghost per al drag & drop tàctil (mateix patró que vocabulari.html) -->
<div id="drag-ghost"></div>


<script type="module" src="js/prioritat/prioritat.js"></script>
</body>
</html>
