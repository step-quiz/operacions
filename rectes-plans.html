<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sessions fixes (?fixed=A/B/C): ha de ser el PRIMER script -->
    <meta name="description" content="Activitat interactiva de matemàtiques — Step Quiz">
    <link rel="icon" href="icon.png">    
    <title>Equacions de rectes i plans a R³</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #ede9fe;
            --gris: #64748b;
            --gris-fosc: #334155;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --font-math: 'Times New Roman', 'Cambria Math', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .title-row { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
        .title-row h1 { font-size:1.5rem; font-weight:700; color:#334155; text-align:center; }
        .home-icon-link { display:block; width:58px; height:58px; flex-shrink:0; opacity:.75; transition:opacity .2s ease; }
        .home-icon-link:hover { opacity:1; }
        .home-icon-link img { width:100%; height:100%; object-fit:contain; }
        
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh; min-height: 100dvh; /* [FIX BUG4] */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 0.6rem;
            text-align: center;
        }
        
        .header h1 { font-size: clamp(0.9rem, 2.2vw, 1.2rem); }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem 1rem 0.5rem 1rem;
            flex-wrap: wrap; /* Per mòbils molt petits */
        }

        .nav-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-btn.active { background: var(--primary); color: white; }

        .content { padding: 1.2rem; width: 100%; }

        .problem-box {
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.2rem;
            display: inline-block; /* Canviat per evitar que es talli l'esquerra a l'scroll */
            font-family: var(--font-math);
            font-size: clamp(1.1rem, 3.5vw, 1.35rem);
            color: #000000;
            white-space: nowrap; 
        }

        .controls { text-align: center; margin-bottom: 1.2rem; }

        select.target-sel {
            padding: 0.6rem; border: 2px solid var(--border-heavy);
            border-radius: 0.5rem; font-family: inherit; outline: none;
            width: 100%; /* Adaptable a mòbil */
            max-width: 400px;
            cursor: pointer;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .sign-select {
            appearance: none;
            width: 36px;
            padding: 0.2rem 0;
            text-align: center;
            font-family: var(--font-math);
            font-size: 1.2rem;
            border: 2px solid var(--border-heavy);
            border-radius: 0.4rem;
            background: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sign-select:hover { background-color: #f1f5f9; }
        .sign-select:focus { border-color: #000; outline: none; }

        .math-input {
            width: 48px;
            padding: 0.5rem 0.1rem; 
            text-align: center;
            border: 2px solid var(--border-heavy); border-radius: 0.5rem;
            font-family: var(--font-math); font-size: 1.2rem; outline: none;
            transition: all 0.2s;
            background-color: white;
        }
        .math-input:hover { background-color: #f1f5f9; }
        .math-input:focus { border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }

        .eq-row {
            display: inline-flex; /* Canviat a inline-flex perquè el text-align el centri correctament */
            align-items: center;
            white-space: nowrap; /* Evita que la lletra grega salti a sota */
            gap: 0.3rem; /* Espaiat consistent */
            font-family: var(--font-math);
            font-size: 1.2rem;
        }
        .eq-col {
            display: flex;
            flex-direction: column;
            gap: 0.5rem; /* Espai vertical entre equacions x, y, z */
            text-align: left;
        }

        .correct { border-color: var(--success) !important; background-color: var(--success-light) !important; color: var(--success); }
        .incorrect { border-color: var(--danger) !important; background-color: var(--danger-light) !important; color: var(--danger); animation: shake 0.3s; }

        .fraction { display: inline-flex; flex-direction: column; align-items: center; margin: 0 0.3rem; }
        .fraction-line { width: 100%; height: 2px; background-color: var(--gris-fosc); }

        .system-brace { display: inline-flex; align-items: center; gap: 0.4rem; } /* Canviat a inline-flex */
        .system-brace::before {
            content: '{'; font-family: var(--font-math); color: var(--gris-fosc); line-height: 1;
        }
        .system-brace.lines-2::before { font-size: 3.5rem; transform: translateY(-3px); }
        .system-brace.lines-3::before { font-size: 5.5rem; transform: translateY(-4px); }
        .vec { display: inline-block; position: relative; padding: 0 0.1em; }
        .vec::before { content: '→'; position: absolute; top: -0.7em; left: 0; width: 100%; text-align: center; font-size: 0.7em; }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Permet als botons d'ajuda saltar si la pantalla és molt estreta */
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .btn-check-sm {
            background: var(--success); color: white; border: none;
            padding: 0.7rem 2rem; border-radius: 0.5rem; font-weight: bold;
            cursor: pointer; font-size: 1rem;
            margin: 0; /* Eliminem el marge original que trencava l'alineació flex */
        }
        .btn-check-sm:hover { background: #15803d; }
        .btn-next { background: var(--primary); display: none; margin: 0; }
        .btn-next:hover { background: var(--primary-dark); }
        
        .shake-long { animation: shake 1.2s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-4px);} 75% {transform: translateX(4px);} }
    </style>
<link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="https://step-quiz.net" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Equacions de rectes i plans</h1>
</div>

<div class="container">
    <div class="nav-buttons">
        <button class="nav-btn active" id="btn-rectes" onclick="switchTab('rectes')">Rectes a l'espai</button>
        <button class="nav-btn" id="btn-plans" onclick="switchTab('plans')">Plans a l'espai</button>
    </div>

    <div class="content" id="content-rectes" style="display: block;">
        <p id="instruction-text" style="margin-bottom: 1.2rem; text-align: center;"></p>
        <div style="overflow-x: auto; text-align: center; margin-bottom: 1rem;">
            <div class="problem-box" id="source-equation"></div>
        </div>

        <div class="controls">
            <select id="target-format" class="target-sel" onchange="renderWorkspace()">
                <option value="" disabled selected>Expressa la mateixa recta (selecciona)</option>
                <option value="vectorial">Equació vectorial</option>
                <option value="parametriques">Equacions paramètriques</option>
                <option value="continues">Equacions contínues</option>
                <option value="implicites">Equacions implícites</option>
            </select>
        </div>

        <div id="workspace" style="overflow-x:auto; text-align:center; padding: 0.5rem 0; width: 100%;"></div>

        <div style="text-align: center;">
            <div class="action-buttons">
                <button class="btn-check-sm btn-next" id="btn-next" onclick="initProblem()">Practicar un altre exemple</button>
                <button class="btn-check-sm" id="btn-check" onclick="checkAnswer()" style="display: none;">Comprovar</button>
                <button class="btn-check-sm" id="btn-help" onclick="handleLevel1Help()" style="display: none; background: #F0CB90; color: #000;">Ajuda</button>
                <button class="btn-check-sm" id="btn-more-help" onclick="handleLevel2Help()" style="display: none; background: #F0A226; color: #000;">Més ajuda</button>
            </div>
            <div id="error-box" style="display:none; margin: 1rem auto; max-width: 650px; padding: 1rem; background: #e2e8f0; color: #000; border: 2px solid #000; border-radius: 0.5rem; font-size: 0.95rem; text-align: left; line-height: 1.6; font-weight: 500;"></div>
            <div id="help-box" style="display:none; margin: 1rem auto; max-width: 650px; padding: 1rem; background: #fefce8; border: 1px solid #fef08a; border-radius: 0.5rem; font-size: 0.95rem; text-align: left; line-height: 1.6;"></div>
        </div>
    </div>

<div class="content" id="content-plans" style="display: none;">
        <p id="instruction-text-plans" style="margin-bottom: 1.2rem; text-align: center;"></p>
        <div style="overflow-x: auto; text-align: center; margin-bottom: 1rem;">
            <div class="problem-box" id="source-equation-plans"></div>
        </div>

        <div class="controls">
            <select id="target-format-plans" class="target-sel" onchange="renderWorkspacePlans()">
                <option value="" disabled selected>Expressa el mateix pla (selecciona)</option>
                <option value="vectorial">Equació vectorial</option>
                <option value="parametriques">Equacions paramètriques</option>
                <option value="general">Equació general o implícita</option>
            </select>
        </div>

        <div id="workspace-plans" style="overflow-x:auto; text-align:center; padding: 0.5rem 0; width: 100%;"></div>

        <div style="text-align: center;">
            <div class="action-buttons">
                <button class="btn-check-sm btn-next" id="btn-next-plans" onclick="initProblemPlans()">Practicar un altre exemple</button>
                <button class="btn-check-sm" id="btn-check-plans" onclick="checkAnswerPlans()" style="display: none;">Comprovar</button>
                <button class="btn-check-sm" id="btn-help-plans" onclick="handleLevel1HelpPlans()" style="display: none; background: #F0CB90; color: #000;">Ajuda</button>
                <button class="btn-check-sm" id="btn-more-help-plans" onclick="handleLevel2HelpPlans()" style="display: none; background: #F0A226; color: #000;">Més ajuda</button>
            </div>
            <div id="error-box-plans" style="display:none; margin: 1rem auto; max-width: 750px; padding: 1rem; background: #e2e8f0; color: #000; border: 2px solid #000; border-radius: 0.5rem; font-size: 0.95rem; text-align: left; line-height: 1.6; font-weight: 500;"></div>
            <div id="help-box-plans" style="display:none; margin: 1rem auto; max-width: 750px; padding: 1rem; background: #fefce8; border: 1px solid #fef08a; border-radius: 0.5rem; font-size: 0.95rem; text-align: left; line-height: 1.6;"></div>
        </div>
    </div>  
    
</div>

<script type="module" src="js/rectes-plans/rectes-plans.js"></script>
</body>
</html>
