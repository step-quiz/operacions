<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descripció d'una gràfica</title>
    <script src="js/fixed-sessions.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg-color:      #f0f6ff;
    --primary:       #2563eb;
    --primary-light: #dbeafe;
    --primary-dark:  #1d4ed8;
    --primary-hover: #1e40af;
    --text-main:     #1e293b;
    --text-muted:    #64748b;
    --border-light:  #e2e8f0;
    --border-heavy:  #cbd5e1;
    --success:       #10b981;
    --danger:        #ef4444;
    --danger-light:  #fee2e2;
}

html { height: 100%; }
body {
    height: 100%;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    font-family: 'Barlow', sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    overflow: hidden;
}

.title-row {
    display: flex; align-items: center; justify-content: center;
    padding: 10px 0 6px;
}
.title-row h1 {
    font-size: clamp(.95rem, 1.8vw, 1.2rem);
    font-weight: 700; color: var(--primary-dark);
}
.home-icon-link { display:block; width:58px; height:58px; flex-shrink:0; opacity:.75; transition:opacity .2s; }
.home-icon-link:hover { opacity:1; }
.home-icon-link img { width:100%; height:100%; object-fit:contain; }

.panel {
    max-width: 98vw; width: 98vw; margin: 0 auto;
    background: #fff; border-radius: 14px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
    flex: 1 1 0; min-height: 0; overflow: hidden;
}

.header-info {
    display: flex; align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
}
.header-left { display:flex; align-items:center; gap:6px; }
.session-text { font-size:.98rem; font-weight:700; color:var(--text-muted); }
.level-text   { font-size:.9rem;  font-weight:600; color:var(--text-muted); }
.session-sep  { color:var(--border-heavy); font-size:1rem; }

#game-screen {
    display: flex; flex-direction: column; flex: 1 1 0; min-height: 0;
}

.game-body {
    display: flex; flex: 1 1 0; min-height: 0;
}

.game-left {
    width: 42%;
    display: flex; flex-direction: column;
    padding: 14px 12px 14px 16px;
    border-right: 1px solid var(--border-light);
    overflow-y: auto; gap: 0;
}

.game-right {
    width: 58%;
    display: flex; flex-direction: column;
    padding: 10px 14px; overflow: hidden; min-height: 0;
}

.question-badge {
    display: inline-block;
    font-size: .76rem; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; color: var(--primary);
    background: var(--primary-light);
    padding: 4px 12px; border-radius: 20px; margin-bottom: 8px;
    align-self: flex-start;
}

.function-box {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;
}
.function-label {
    font-size: 1.05rem; font-weight: 700; color: var(--text-main); line-height: 1.3;
}
.function-math {
    font-size: 1em; color: #111;
    padding: 10px 14px; background: #f0f6ff;
    border-radius: 10px; border: 2px solid var(--border-light);
    overflow-x: auto;
}

.options-list {
    display: flex; flex-direction: column; gap: 8px; width: 100%;
}

@keyframes popIn {
    0%   { opacity:0; transform:scale(.97) translateY(4px); }
    100% { opacity:1; transform:scale(1) translateY(0); }
}
@keyframes shake {
    0%,100% { transform:translateX(0); }
    25%     { transform:translateX(-5px); }
    75%     { transform:translateX(5px); }
}

.btn-option {
    padding: 11px 14px;
    font-size: .93em; font-family: 'Barlow', sans-serif; font-weight: 500;
    border-radius: 10px; border: 2px solid var(--border-heavy);
    background: white; color: var(--text-main); cursor: pointer;
    transition: background .15s, border-color .15s;
    text-align: left; line-height: 1.4;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    opacity: 0;
    animation: popIn .25s cubic-bezier(.175,.885,.32,1.275) forwards;
}
@media (hover:hover) {
    .btn-option:hover:not([disabled]) {
        background: var(--primary-light); border-color: var(--primary);
    }
}
.btn-option:active { transform:scale(.98); }
.btn-option.correct {
    background: var(--success) !important; border-color: var(--success) !important;
    color: white !important; pointer-events: none;
}
.btn-option.wrong {
    background: var(--danger-light) !important; border-color: var(--danger) !important;
    color: var(--danger) !important; opacity: 1 !important;
    pointer-events: none; animation: shake .3s;
}

#missatge-feedback {
    font-size: .85rem; min-height: 24px;
    margin-top: 8px; color: var(--text-muted);
    transition: opacity .2s;
}
.feedback-correct { color: var(--success); font-weight: 700; }

#graph-canvas {
    width: 100%; flex: 1 1 0; min-height: 0;
    display: flex; align-items: center; justify-content: center;
}
#graph-canvas svg {
    display: block; width: 100% !important; height: 100% !important;
    max-height: 100%; border-radius: 6px;
}

/* End screen */
#session-summary {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; padding: 40px 20px; text-align: center;
}
.end-emoji  { font-size: 3em; margin-bottom: 12px; }
.end-title  { font-size: 1.6em; font-weight: 800; color: var(--primary-dark); margin-bottom: 6px; }
.end-sub    { font-size: 1rem; color: var(--text-muted); margin-bottom: 28px; }
.summary-continue-btn {
    display: inline-block; padding: 12px 36px;
    background: var(--primary); color: white; border: none; border-radius: 10px;
    font-family: 'Barlow', sans-serif; font-size: 1em; font-weight: 700;
    cursor: pointer; transition: background .2s, transform .15s;
}
.summary-continue-btn:hover  { background: var(--primary-hover); transform: translateY(-1px); }
.summary-continue-btn:active { transform: scale(.97); }

@media (max-width: 780px) {
    body { overflow: auto; }
    .game-body { flex-direction: column; }
    .game-left  { width: 100%; border-right: none; border-bottom: 1px solid var(--border-light); }
    .game-right { width: 100%; min-height: 260px; }
}
    </style>
    <link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="https://step-quiz.net" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Descripció d'una gràfica</h1>
</div>

<div class="panel">
    <div id="game-screen" style="display:none;">
        <div class="header-info">
            <div class="header-left">
                <span class="session-text" id="level-display">Nivell 1</span>
                <span class="session-sep">·</span>
                <span class="level-text" id="lvl-display">Pregunta 1 de 8</span>
            </div>
        </div>
        <div class="game-body">
            <div class="game-left">
                <div class="function-box">
                    <span class="question-badge" id="q-badge">Monotonia</span>
                    <div class="function-label" id="q-label">On és creixent i decreixent f(x)?</div>
                    <div id="fx-display" class="function-math"></div>
                </div>
                <div id="options-container" class="options-list"></div>
                <div id="missatge-feedback" style="opacity:0;"></div>
            </div>
            <div class="game-right">
                <div id="graph-canvas"></div>
            </div>
        </div>
    </div>
    <div id="session-summary" style="display:none;"></div>
</div>

<!-- =====================================================================
     FUNCTION ENGINE
     ===================================================================== -->
<script>
window.FunctionEngine = (() => {
    function _ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
    function _pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    // LaTeX helpers
    function _xa(a){
        if(a===0) return 'x';
        return a<0 ? `x + ${-a}` : `x - ${a}`;
    }
    function _xap(a){
        if(a===0) return 'x';
        return a<0 ? `(x + ${-a})` : `(x - ${a})`;
    }

    // ---- LINEAR  f(x) = m(x-a) ----
    function makeLinear(){
        const m=_pick([1,2,-1,-2]);
        const a=_ri(-4,4);
        let latex;
        if(m===1)       latex=`f(x) = ${_xa(a)}`;
        else if(m===-1) latex=a===0?`f(x) = -x`:`f(x) = -${_xap(a)}`;
        else            latex=a===0?`f(x) = ${m}x`:`f(x) = ${m}${_xap(a)}`;
        return {
            family:'linear', fn:x=>m*(x-a), latex,
            monBreaks:[], monParts:[m>0?'creixent':'decreixent'],
            signBreaks:[a], signParts:m>0?['negatiu','positiu']:['positiu','negatiu'],
            xRange:[a-5,a+5], yRange:[-8,8],
            keyPoints:[{x:a,y:0,type:'root'}]
        };
    }

    // ---- QUADRATIC: 2 distinct integer roots (same parity → integer vertex) ----
    function makeQuad2Roots(){
        const diff=_pick([2,4,6]);
        const r1=_ri(-4,4-diff);
        const r2=r1+diff;
        const v=(r1+r2)/2;              // integer vertex
        const sgn=_pick([1,-1]);
        const fn=sgn>0?x=>(x-r1)*(x-r2):x=>-(x-r1)*(x-r2);
        const vy=fn(v);
        const latex=sgn>0
            ?`f(x) = ${_xap(r1)}${_xap(r2)}`
            :`f(x) = -${_xap(r1)}${_xap(r2)}`;
        return {
            family:'quad2', fn, latex,
            monBreaks:[v], monParts:sgn>0?['decreixent','creixent']:['creixent','decreixent'],
            signBreaks:[r1,r2], signParts:sgn>0?['positiu','negatiu','positiu']:['negatiu','positiu','negatiu'],
            xRange:[r1-3,r2+3], yRange:[Math.min(vy,-1)-2,Math.max(-vy,1)+2],
            keyPoints:[{x:r1,y:0,type:'root'},{x:r2,y:0,type:'root'},{x:v,y:vy,type:'extremum'}]
        };
    }

    // ---- QUADRATIC: no real roots (always positive or always negative) ----
    function makeQuadNoRoots(){
        const h=_ri(-3,3);
        const k=_ri(2,5);
        const sgn=_pick([1,-1]);
        const fn=sgn>0?x=>(x-h)*(x-h)+k:x=>-(x-h)*(x-h)-k;
        const base=h===0?'x':_xap(h);
        const latex=sgn>0?`f(x) = ${base}^2 + ${k}`:`f(x) = -${base}^2 - ${k}`;
        return {
            family:'quadNoRoots', fn, latex,
            monBreaks:[h], monParts:sgn>0?['decreixent','creixent']:['creixent','decreixent'],
            signBreaks:[], signParts:[sgn>0?'positiu':'negatiu'],
            xRange:[h-5,h+5], yRange:sgn>0?[-2,k+5]:[-(k+5),2],
            keyPoints:[{x:h,y:sgn*k,type:'extremum'}]
        };
    }

    // ---- CUBIC monotonic: f(x) = ±(x-a)³ ----
    function makeCubicMono(){
        const a=_ri(-3,3);
        const sgn=_pick([1,-1]);
        const fn=sgn>0?x=>(x-a)**3:x=>-(x-a)**3;
        const base=a===0?'x':_xap(a);
        const latex=sgn>0?`f(x) = ${base}^3`:`f(x) = -${base}^3`;
        return {
            family:'cubicMono', fn, latex,
            monBreaks:[], monParts:[sgn>0?'creixent':'decreixent'],
            signBreaks:[a], signParts:sgn>0?['negatiu','positiu']:['positiu','negatiu'],
            xRange:[a-3,a+3], yRange:[-15,15],
            keyPoints:[{x:a,y:0,type:'root'}]
        };
    }

    // ---- CUBIC with double root: f(x) = ±(x-p)(x-q)² ----
    // Pairs where (q+2p) divisible by 3 → integer critical points
    function makeCubicDouble(){
        const pairs=[[0,3],[3,0],[-3,0],[0,-3],[-2,1],[2,-1],[-1,2],[1,-2]];
        const [p,q]=_pick(pairs);
        const sgn=_pick([1,-1]);
        const fn=sgn>0?x=>(x-p)*(x-q)**2:x=>-(x-p)*(x-q)**2;

        // Critical points: x=q and x=(q+2p)/3
        const ic=(q+2*p)/3;
        const c_lo=Math.min(q,ic), c_hi=Math.max(q,ic);
        // monotony for sgn>0: always creixent-decreixent-creixent; sgn<0: decreixent-creixent-decreixent
        const monParts=sgn>0?['creixent','decreixent','creixent']:['decreixent','creixent','decreixent'];

        // Sign changes only at simple root p; double root q is a touch point
        const signParts=sgn>0?['negatiu','positiu']:['positiu','negatiu'];

        let Sp=p===0?'x':p<0?`(x + ${-p})`:`(x - ${p})`;
        let Sq=q===0?'x^2':q<0?`(x + ${-q})^2`:`(x - ${q})^2`;
        const latex=sgn>0?`f(x) = ${Sp}${Sq}`:`f(x) = -${Sp}${Sq}`;

        const xs=[p,q,c_lo,c_hi];
        const ys=xs.map(fn);
        return {
            family:'cubicDouble', fn, latex,
            monBreaks:[c_lo,c_hi], monParts,
            signBreaks:[p], signParts,
            xRange:[Math.min(...xs)-3, Math.max(...xs)+3],
            yRange:[Math.max(Math.min(...ys)-3,-25), Math.min(Math.max(...ys)+3,25)],
            keyPoints:[
                {x:p,y:0,type:'root'},
                ...(p!==q?[{x:q,y:0,type:'root'}]:[]),
                {x:c_lo,y:fn(c_lo),type:'extremum'},
                {x:c_hi,y:fn(c_hi),type:'extremum'}
            ].filter(kp=>isFinite(kp.y)&&isFinite(kp.x))
        };
    }

    // ---- EXPONENTIAL ----
    function makeExp(){
        const a=_ri(-2,3);
        const hasRoot=_pick([true,false]);
        const sgn=_pick([1,-1]);
        const ex=a===0?'e^x':`e^{${_xa(a)}}`;
        if(hasRoot){
            const fn=x=>sgn*(Math.exp(x-a)-1);
            const latex=sgn>0?`f(x) = ${ex} - 1`:`f(x) = 1 - ${ex}`;
            return {
                family:'exp', fn, latex,
                monBreaks:[], monParts:[sgn>0?'creixent':'decreixent'],
                signBreaks:[a], signParts:sgn>0?['negatiu','positiu']:['positiu','negatiu'],
                xRange:[a-4,a+4], yRange:sgn>0?[-1.5,14]:[-14,1.5],
                keyPoints:[{x:a,y:0,type:'root'}]
            };
        } else {
            const fn=x=>sgn*Math.exp(x-a);
            const latex=sgn>0?`f(x) = ${ex}`:`f(x) = -${ex}`;
            return {
                family:'exp', fn, latex,
                monBreaks:[], monParts:[sgn>0?'creixent':'decreixent'],
                signBreaks:[], signParts:[sgn>0?'positiu':'negatiu'],
                xRange:[a-4,a+4], yRange:sgn>0?[-0.5,14]:[-14,0.5],
                keyPoints:[]
            };
        }
    }

    // ---- SQRT (domain ℝ) ----
    function makeSqrt(){
        const type=_pick(['always','roots']);
        const sgn=_pick([1,-1]);
        if(type==='always'){
            const k=_pick([1,4,9]);
            const fn=x=>sgn*Math.sqrt(x*x+k);
            const sq=`\\sqrt{x^2+${k}}`;
            const latex=sgn>0?`f(x) = ${sq}`:`f(x) = -${sq}`;
            return {
                family:'sqrt', fn, latex,
                monBreaks:[0], monParts:sgn>0?['decreixent','creixent']:['creixent','decreixent'],
                signBreaks:[], signParts:[sgn>0?'positiu':'negatiu'],
                xRange:[-5,5], yRange:sgn>0?[-0.5,7]:[-7,0.5],
                keyPoints:[]
            };
        } else {
            // Pythagorean triple: (a,b,r) with a²+r²=b²: (3,5,4) or (4,5,3)
            const [a,b,r]=_pick([[3,5,4],[4,5,3]]);
            if(sgn>0){
                // √(x²+a²)−b: min at x=0 (value a−b<0), roots ±r
                const fn=x=>Math.sqrt(x*x+a*a)-b;
                const latex=`f(x) = \\sqrt{x^2+${a*a}} - ${b}`;
                return {
                    family:'sqrt', fn, latex,
                    monBreaks:[0], monParts:['decreixent','creixent'],
                    signBreaks:[-r,r], signParts:['positiu','negatiu','positiu'],
                    xRange:[-r-3,r+3], yRange:[a-b-1,4],
                    keyPoints:[{x:-r,y:0,type:'root'},{x:r,y:0,type:'root'},{x:0,y:a-b,type:'extremum'}]
                };
            } else {
                // b−√(x²+a²): max at x=0 (value b−a>0), roots ±r
                const fn=x=>b-Math.sqrt(x*x+a*a);
                const latex=`f(x) = ${b} - \\sqrt{x^2+${a*a}}`;
                return {
                    family:'sqrt', fn, latex,
                    monBreaks:[0], monParts:['creixent','decreixent'],
                    signBreaks:[-r,r], signParts:['negatiu','positiu','negatiu'],
                    xRange:[-r-3,r+3], yRange:[-(4),b-a+1],
                    keyPoints:[{x:-r,y:0,type:'root'},{x:r,y:0,type:'root'},{x:0,y:b-a,type:'extremum'}]
                };
            }
        }
    }

    // ---- RATIONAL (domain ℝ) ----
    function makeRational(){
        const type=_pick(['inv','xover','x2minus']);
        if(type==='inv'){
            const sgn=_pick([1,-1]);
            const fn=x=>sgn/(x*x+1);
            const latex=sgn>0
                ?`f(x) = \\dfrac{1}{x^2+1}`
                :`f(x) = \\dfrac{-1}{x^2+1}`;
            return {
                family:'rational', fn, latex,
                monBreaks:[0], monParts:sgn>0?['creixent','decreixent']:['decreixent','creixent'],
                signBreaks:[], signParts:[sgn>0?'positiu':'negatiu'],
                xRange:[-5,5], yRange:[-1.5,1.5],
                keyPoints:[{x:0,y:sgn,type:'extremum'}]
            };
        } else if(type==='xover'){
            const sgn=_pick([1,-1]);
            const fn=x=>sgn*x/(x*x+1);
            const latex=sgn>0
                ?`f(x) = \\dfrac{x}{x^2+1}`
                :`f(x) = \\dfrac{-x}{x^2+1}`;
            return {
                family:'rational', fn, latex,
                monBreaks:[-1,1], monParts:sgn>0?['decreixent','creixent','decreixent']:['creixent','decreixent','creixent'],
                signBreaks:[0], signParts:sgn>0?['negatiu','positiu']:['positiu','negatiu'],
                xRange:[-5,5], yRange:[-0.8,0.8],
                keyPoints:[
                    {x:-1,y:-sgn*0.5,type:'extremum'},
                    {x:0,y:0,type:'root'},
                    {x:1,y:sgn*0.5,type:'extremum'}
                ]
            };
        } else {
            // (x²−r²)/(x²+1): roots ±r, min at 0 value −r²
            const r=_pick([1,2,3]);
            const fn=x=>(x*x-r*r)/(x*x+1);
            const latex=`f(x) = \\dfrac{x^2-${r*r}}{x^2+1}`;
            return {
                family:'rational', fn, latex,
                monBreaks:[0], monParts:['decreixent','creixent'],
                signBreaks:[-r,r], signParts:['positiu','negatiu','positiu'],
                xRange:[-r-4,r+4], yRange:[-r*r-0.5,1.5],
                keyPoints:[
                    {x:-r,y:0,type:'root'},{x:r,y:0,type:'root'},
                    {x:0,y:-r*r,type:'extremum'}
                ]
            };
        }
    }

    function generateFunction(level){
        const byLevel={
            1:['linear','quad2','quadNoRoots'],
            2:['linear','quad2','quadNoRoots','cubicMono','cubicDouble'],
            3:['linear','quad2','quadNoRoots','cubicMono','cubicDouble','exp','sqrt','rational'],
        };
        const t=_pick(byLevel[level]||byLevel[2]);
        switch(t){
            case 'linear':      return makeLinear();
            case 'quad2':       return makeQuad2Roots();
            case 'quadNoRoots': return makeQuadNoRoots();
            case 'cubicMono':   return makeCubicMono();
            case 'cubicDouble': return makeCubicDouble();
            case 'exp':         return makeExp();
            case 'sqrt':        return makeSqrt();
            case 'rational':    return makeRational();
            default:            return makeLinear();
        }
    }

    return { generateFunction };
})();
</script>

<!-- =====================================================================
     QUESTION BANK
     ===================================================================== -->
<script>
window.QuestionBank = (() => {
    const INF=Infinity;
    function _pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function _shuffle(arr){
        const a=[...arr];
        for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
        return a;
    }

    function _n(x){
        if(x===INF)  return '+∞';
        if(x===-INF) return '−∞';
        return x<0?`−${-x}`:`${x}`;
    }
    function _iv(a,b){ return `(${_n(a)}, ${_n(b)})`; }

    function _monLabel(breaks, parts){
        const pts=[-INF,...breaks,INF];
        const segs=parts.map((p,i)=>`${p} a ${_iv(pts[i],pts[i+1])}`);
        if(segs.length===1) return `f(x) és ${segs[0]}`;
        if(segs.length===2) return `f(x) és ${segs[0]} i ${segs[1]}`;
        return `f(x) és ${segs.slice(0,-1).join(', ')} i ${segs[segs.length-1]}`;
    }

    function _signLabel(breaks, parts){
        if(parts.every(p=>p==='positiu')) return 'f(x) és positiva a (−∞, +∞)';
        if(parts.every(p=>p==='negatiu')) return 'f(x) és negativa a (−∞, +∞)';
        const pts=[-INF,...breaks,INF];
        const pos=[],neg=[];
        parts.forEach((p,i)=>(p==='positiu'?pos:neg).push(_iv(pts[i],pts[i+1])));
        return `f(x) és positiva a ${pos.join(' ∪ ')} i negativa a ${neg.join(' ∪ ')}`;
    }

    function _genDistrs(correct, breaks, parts, otherBreaks, labelFn){
        const FLIP=parts.map(p=>p==='creixent'?'decreixent':p==='decreixent'?'creixent':p==='positiu'?'negatiu':'positiu');
        const pool=[];
        const add=d=>{ if(d!==correct&&!pool.includes(d)) pool.push(d); };

        // D1: flip direction/sign
        add(labelFn(breaks,FLIP));

        // Alternative breakpoints: from the other question type + shifts + common values
        const altBreaks=[
            ...otherBreaks,
            ...(breaks.length>0?[breaks[0]-1,breaks[0]+1,breaks[0]+2,breaks[0]-2]:[]),
            ...(breaks.length>1?[breaks[1]-1,breaks[1]+1]:[]),
            0,1,-1,2,-2,3,-3,4,-4
        ].filter(b=>!breaks.includes(b));

        for(const ab of altBreaks){
            if(breaks.length===0){
                add(labelFn([ab],parts.map((_,j)=>j%2===0?parts[0]:FLIP[0])));
                add(labelFn([ab],[FLIP[0],parts[0]]));
            } else if(breaks.length===1){
                add(labelFn([ab],parts));
                add(labelFn([ab],FLIP));
            } else if(breaks.length===2){
                add(labelFn([ab,breaks[1]],parts));
                add(labelFn([breaks[0],ab],parts));
                add(labelFn([ab,breaks[1]],FLIP));
            }
            if(pool.length>=5) break;
        }

        // Fallback "always" labels
        const isMon=parts[0]==='creixent'||parts[0]==='decreixent';
        if(isMon){
            add('f(x) és creixent a (−∞, +∞)');
            add('f(x) és decreixent a (−∞, +∞)');
        } else {
            add('f(x) és positiva a (−∞, +∞)');
            add('f(x) és negativa a (−∞, +∞)');
        }

        return pool.slice(0,3);
    }

    function generateMonoQ(spec){
        const {monBreaks,monParts,signBreaks}=spec;
        const correct=_monLabel(monBreaks,monParts);
        const distrs=_genDistrs(correct,monBreaks,monParts,signBreaks,_monLabel);
        return {
            type:'Q_MONO',
            badge:'Monotonia de f(x)',
            label:'On és creixent i decreixent f(x)?',
            options:_shuffle([
                {text:correct,isCorrect:true},
                ...distrs.map(t=>({text:t,isCorrect:false}))
            ])
        };
    }

    function generateSignQ(spec){
        const {signBreaks,signParts,monBreaks}=spec;
        const correct=_signLabel(signBreaks,signParts);
        const distrs=_genDistrs(correct,signBreaks,signParts,monBreaks,_signLabel);
        return {
            type:'Q_SIGN',
            badge:'Signe de f(x)',
            label:'On és positiva i negativa f(x)?',
            options:_shuffle([
                {text:correct,isCorrect:true},
                ...distrs.map(t=>({text:t,isCorrect:false}))
            ])
        };
    }

    return { generateMonoQ, generateSignQ };
})();
</script>

<!-- =====================================================================
     SVG RENDERER
     ===================================================================== -->
<script>
function renderFuncSVG(spec){
    const W=560, H=390;
    const ml=40, mr=18, mt=22, mb=22;
    const pw=W-ml-mr, ph=H-mt-mb;

    let [xMin,xMax]=spec.xRange||[-6,6];
    let [yMinR,yMaxR]=spec.yRange||[-8,8];
    const yPad=(yMaxR-yMinR)*0.06;
    const yMin=yMinR-yPad, yMax=yMaxR+yPad;

    const tx=x=>ml+(x-xMin)/(xMax-xMin)*pw;
    const ty=y=>mt+ph-(y-yMin)/(yMax-yMin)*ph;
    const px0=(xMin<=0&&xMax>=0)?tx(0):ml;
    const py0=(yMin<=0&&yMax>=0)?ty(0):mt+ph;

    const L=[];
    L.push(`<rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="#fff"/>`);

    // Grid verticals
    const xStep=(xMax-xMin)<=14?1:2;
    for(let x=Math.ceil(xMin);x<=Math.floor(xMax);x+=xStep){
        const px=tx(x).toFixed(1);
        L.push(`<line x1="${px}" y1="${mt}" x2="${px}" y2="${mt+ph}" stroke="#d1dce8" stroke-width="${x===0?2:0.7}"/>`);
    }
    // Grid horizontals
    const ySpan=yMax-yMin;
    const yS=ySpan<=8?1:ySpan<=16?2:ySpan<=32?5:10;
    for(let y=Math.ceil(yMin/yS)*yS;y<=yMax+yS*0.1;y+=yS){
        const py=ty(y).toFixed(1);
        L.push(`<line x1="${ml}" y1="${py}" x2="${ml+pw}" y2="${py}" stroke="${y===0?'#1e293b':'#d1dce8'}" stroke-width="${y===0?2:0.7}"/>`);
    }

    // Axes
    L.push(`<line x1="${ml}" y1="${py0.toFixed(1)}" x2="${ml+pw}" y2="${py0.toFixed(1)}" stroke="#1e293b" stroke-width="2"/>`);
    L.push(`<line x1="${px0.toFixed(1)}" y1="${mt}" x2="${px0.toFixed(1)}" y2="${mt+ph}" stroke="#1e293b" stroke-width="2"/>`);
    // Arrow tips
    L.push(`<polygon points="${ml+pw},${py0.toFixed(1)} ${ml+pw-7},${py0-4} ${ml+pw-7},${py0+4}" fill="#1e293b"/>`);
    L.push(`<polygon points="${px0.toFixed(1)},${mt} ${px0-4},${mt+7} ${px0+4},${mt+7}" fill="#1e293b"/>`);
    // Axis name labels
    L.push(`<text x="${ml+pw-10}" y="${(py0+16).toFixed(1)}" font-family="Barlow,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#1e293b">x</text>`);
    L.push(`<text x="${(px0+6).toFixed(1)}" y="${mt+14}" font-family="Barlow,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#1e293b">y</text>`);

    // Tick labels X
    for(let x=Math.ceil(xMin);x<=Math.floor(xMax);x+=xStep){
        if(x===0) continue;
        const px=tx(x);
        L.push(`<line x1="${px.toFixed(1)}" y1="${(py0-4).toFixed(1)}" x2="${px.toFixed(1)}" y2="${(py0+4).toFixed(1)}" stroke="#1e293b" stroke-width="1.5"/>`);
        L.push(`<text x="${px.toFixed(1)}" y="${(py0+17).toFixed(1)}" text-anchor="middle" font-family="Barlow,sans-serif" font-size="12" font-weight="500" fill="#334155">${x}</text>`);
    }
    // Tick labels Y
    for(let y=Math.ceil(yMin/yS)*yS;y<=yMax;y+=yS){
        if(y===0) continue;
        const py=ty(y);
        L.push(`<line x1="${(px0-4).toFixed(1)}" y1="${py.toFixed(1)}" x2="${(px0+4).toFixed(1)}" y2="${py.toFixed(1)}" stroke="#1e293b" stroke-width="1.5"/>`);
        L.push(`<text x="${(px0-7).toFixed(1)}" y="${(py+4.5).toFixed(1)}" text-anchor="end" font-family="Barlow,sans-serif" font-size="12" font-weight="500" fill="#334155">${y}</text>`);
    }
    // Zero label
    L.push(`<text x="${(px0-7).toFixed(1)}" y="${(py0+17).toFixed(1)}" text-anchor="end" font-family="Barlow,sans-serif" font-size="12" font-weight="500" fill="#334155">0</text>`);

    // Curve
    const paths=_buildCurve(spec,tx,ty,xMin,xMax,yMin,yMax);
    paths.forEach(d=>{
        L.push(`<path d="${d}" fill="none" stroke="#0077b6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`);
    });

    // Key point markers
    (spec.keyPoints||[]).forEach(kp=>{
        const {x,y,type}=kp;
        if(x<xMin||x>xMax||y<yMin||y>yMax) return;
        const px=tx(x).toFixed(1), py=ty(y).toFixed(1);
        const col=type==='root'?'#ef4444':'#f59e0b';
        L.push(`<circle cx="${px}" cy="${py}" r="5.5" fill="${col}" stroke="white" stroke-width="1.5"/>`);
    });

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;max-height:100%;display:block">${L.join('')}</svg>`;
}

function _buildCurve(spec,tx,ty,xMin,xMax,yMin,yMax){
    const N=500;
    const yClip=(yMax-yMin)*2;
    let d='';
    const paths=[];
    for(let i=0;i<=N;i++){
        const x=xMin+(xMax-xMin)*i/N;
        const y=spec.fn(x);
        if(!isFinite(y)||isNaN(y)){ if(d) d+=' '; continue; }
        const cy=Math.max(yMin-yClip,Math.min(yMax+yClip,y));
        const px=tx(x).toFixed(2), py=ty(cy).toFixed(2);
        d+=(d===''||d.endsWith(' '))?`M ${px} ${py}`:`L ${px} ${py}`;
    }
    d.split(' M ').filter(s=>s.trim()).forEach(seg=>{
        const full=seg.startsWith('M')?seg:'M '+seg;
        if(full.includes('L')) paths.push(full);
    });
    return paths;
}
</script>

<!-- =====================================================================
     CONTROLADOR PRINCIPAL
     ===================================================================== -->
<script>
const _p=new URLSearchParams(window.location.search);
const GAME_LEVEL =Math.min(3,Math.max(1,parseInt(_p.get('nivell')||'1',10)));
const TOTAL_Q    =Math.max(4,parseInt(_p.get('preguntes')||'8',10));
const TOTAL_ROUNDS=Math.max(2,Math.round(TOTAL_Q/2));

const LEVEL_NAMES={1:'Nivell 1 — lineal i quadràtica',2:'Nivell 2 — + cúbica',3:'Nivell 3 — + exponencial, arrel, racional'};

let currentRound=0;
let currentPhase='MONO'; // 'MONO' or 'SIGN'
let currentSpec=null;
let isAnswered=false;

const els={
    gameScreen:   document.getElementById('game-screen'),
    summary:      document.getElementById('session-summary'),
    fxDisplay:    document.getElementById('fx-display'),
    options:      document.getElementById('options-container'),
    feedback:     document.getElementById('missatge-feedback'),
    lvlDisplay:   document.getElementById('lvl-display'),
    levelDisplay: document.getElementById('level-display'),
    badge:        document.getElementById('q-badge'),
    label:        document.getElementById('q-label'),
    graphCanvas:  document.getElementById('graph-canvas'),
};

// -------- BUILD FUNCTION --------
function buildFunction(){
    isAnswered=false;
    currentSpec=FunctionEngine.generateFunction(GAME_LEVEL);

    // Render graph (always visible)
    els.graphCanvas.innerHTML=renderFuncSVG(currentSpec);

    // Show first question
    currentPhase='MONO';
    buildQuestion();
}

// -------- BUILD QUESTION --------
function buildQuestion(){
    isAnswered=false;
    els.feedback.style.opacity='0';
    els.feedback.innerHTML='';

    // Update counter
    const absQ=currentRound*2+(currentPhase==='MONO'?0:1)+1;
    els.lvlDisplay.textContent=`Pregunta ${absQ} de ${TOTAL_ROUNDS*2}`;

    // Generate question
    const q=currentPhase==='MONO'
        ?QuestionBank.generateMonoQ(currentSpec)
        :QuestionBank.generateSignQ(currentSpec);

    els.badge.textContent=q.badge;
    els.label.textContent=q.label;

    // Render function formula
    if(window.katex){
        katex.render(currentSpec.latex,els.fxDisplay,{throwOnError:false,displayMode:true});
    } else {
        els.fxDisplay.textContent=currentSpec.latex;
    }

    // Build option buttons
    els.options.innerHTML='';
    q.options.forEach((opt,idx)=>{
        const btn=document.createElement('button');
        btn.className='btn-option';
        btn.style.animationDelay=`${idx*55}ms`;
        btn.textContent=opt.text;
        btn.addEventListener('click',()=>checkAnswer(opt,btn));
        els.options.appendChild(btn);
    });
}

// -------- CHECK ANSWER --------
function checkAnswer(opt,btn){
    if(isAnswered) return;

    if(opt.isCorrect){
        isAnswered=true;
        btn.classList.add('correct');
        _disableAll();
        els.feedback.innerHTML=`<span class="feedback-correct">✓ Correcte!</span>`;
        els.feedback.style.opacity='1';

        setTimeout(()=>{
            if(currentPhase==='MONO'){
                // Move to sign question (same function)
                currentPhase='SIGN';
                buildQuestion();
            } else {
                // Done with this function, move to next
                currentRound++;
                if(currentRound>=TOTAL_ROUNDS){
                    _showSummary();
                } else {
                    buildFunction();
                }
            }
        },1400);

    } else {
        // Wrong: disable this button, allow retry
        btn.classList.add('wrong');
        els.feedback.innerHTML=`Revisa la gràfica i torna-ho a intentar.`;
        els.feedback.style.opacity='1';
    }
}

function _disableAll(){
    els.options.querySelectorAll('.btn-option')
        .forEach(b=>{ b.style.pointerEvents='none'; });
}

// -------- END SCREEN --------
function _showSummary(){
    els.gameScreen.style.display='none';
    els.summary.innerHTML=`
        <div class="end-emoji">🎉</div>
        <div class="end-title">Molt bé!</div>
        <div class="end-sub">Has completat totes les preguntes.</div>
        <button class="summary-continue-btn" id="btn-restart">Torna a jugar</button>`;
    els.summary.style.display='flex';
    document.getElementById('btn-restart').addEventListener('click',()=>{
        currentRound=0; currentPhase='MONO'; currentSpec=null;
        els.summary.style.display='none';
        els.gameScreen.style.display='flex';
        buildFunction();
    });
}

// -------- INIT --------
window.addEventListener('DOMContentLoaded',()=>{
    els.levelDisplay.textContent=LEVEL_NAMES[GAME_LEVEL]||'';
    els.gameScreen.style.display='flex';
    buildFunction();
});
</script>

</body>
</html>
