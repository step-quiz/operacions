<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Activitats interactives de matemàtiques per a ESO i Batxillerat. Pràctica d'operacions amb enters, fraccions, equacions i més." />
  <meta name="author" content="Step Quiz" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" href="icon.png" />
  <title>Step Quiz Matemàtiques</title>

  <script>
    const BASE_URL = 'https://step-quiz.net/';

    const ACTIVITIES_ESO = [
      { file: 'enters.html', label: 'Nombres enters', yt: 'https://youtu.be/7M6oAKwovag' },
      { file: 'enters-ordenar.html', label: 'Ordenar nombres enters', yt: '' },
      { file: 'recta-numèrica.html', label: 'La recta numèrica dels enters', yt: '' },      
      { file: 'factoritzar.html', label: 'Descomposar en factors primers', yt: 'https://youtu.be/s2LGUllVMfM' },
      { file: 'mcd-mcm.html', label: 'Màxim comú divisor i mínim comú múltiple', yt: 'https://youtu.be/B3JmbWrQzyQ' },
      { file: 'fraccions.html', label: 'Fraccions', yt: 'https://youtu.be/5jTHP_4fWkI', difficulty: true },
      { file: 'equacions.html', label: 'Equacions de 1r grau', yt: 'https://youtu.be/Ad9BBLqYgyc' },
      { file: 'radicals.html', label: 'Simplificació de radicals', yt: '' },
      { file: 'pla-cartesia.html', label: 'Pla cartesià', yt: '', difficulty: true }
    ];

    const ACTIVITIES_BATX = [
      { file: 'rectes-plans.html', label: 'Equacions rectes i plans', yt: '' },
      { file: 'esglaonar-matriu.html', label: 'Esglaonar una matriu', yt: '' },
      { file: 'ruffini.html', label: 'Ruffini (arrels enteres)', yt: '' },
      { file: 'complexos.html', label: 'Nombres complexos', yt: '' },
      { file: 'derivades.html', label: 'Càlcul de derivades', yt: '' },
      { file: 'integrals.html', label: 'Càlcul d'integrals', yt: '' },
      { file: 'asimptotes.html', label: 'Asímptotes i límits laterals', yt: '' },
      { file: 'grafica-funcio-i-derivada.html', label: 'Comparar gràfiques de funció i de derivada', yt: '' }
    ];

    const DEFAULT_ESO = 'enters.html';
    const DEFAULT_BATX = 'rectes-plans.html';
  </script>

  <style>
    :root {
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --eso-bg: #eff6ff;
      --batx-bg: #f1f5f9;
      --math-title: #3486e4;
      --border-heavy: #cbd5e1;
      --panel-w: 384px;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-body);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .title-container { text-align: center; margin-bottom: 20px; }
    .title-row-1 { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 36px; font-weight: 800; color: #0f172a; margin: 0; }
    .title-row-2 { font-size: 24px; font-weight: 400; color: var(--math-title); margin-top: -15px; }
    .inline-icon { height: 82px; opacity: 0; animation: icon-slide-brake 0.6s cubic-bezier(0.1, 1.0, 0.2, 1.0) 0.1s forwards; }
    .text-step { opacity: 0; animation: fade-in 0.43s ease-out 0.6s forwards; }
    .title-row-2, #mobile-nav-container { opacity: 0; animation: fade-in 0.24s ease-out 1.50s forwards; }

    @keyframes icon-slide-brake { from { transform: translateX(-60px) scale(0.8); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .main-wrapper { display: flex; gap: 30px; justify-content: center; width: 100%; max-width: 1000px; align-items: flex-start; }
    .quiz-panel { width: var(--panel-w); max-width: 100%; padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-heavy); }
    #panel-eso  { background-color: var(--eso-bg);  opacity: 0; animation: fade-in 0.24s ease-out 1.50s forwards; }
    #panel-batx { background-color: var(--batx-bg); opacity: 0; animation: fade-in 0.24s ease-out 1.80s forwards; }

    h2 { margin: 0 0 10px 5px; font-size: 22px; font-weight: 800; }

    .row { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 10px; padding: 4px 8px; }
    .row label { font-size: 14px; font-weight: 600; text-align: left; }

    /* Selects natius (sessions, preguntes, errors, criteri) — sense canvis */
    select {
      appearance: none; background-color: #ffffff; height: 32px; padding: 0 10px;
      font-size: 14px; border: 1px solid var(--border-heavy); border-radius: 6px;
      cursor: pointer; text-align: center; width: 100%; transition: background-color 0.2s;
    }
    select:hover { background-color: #cbd5e1; }

    /* ── CUSTOM DROPDOWN (Tailwind UI) ── */
    .cd-wrap { position: relative; width: 100%; font-size: 14px; user-select: none; }

    .cd-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      height: 32px; padding: 0 10px; background: #fff;
      border: 1px solid var(--border-heavy); border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-main);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .cd-trigger:hover { border-color: #94a3b8; background: #e2e8f0; }
    .cd-wrap.open .cd-trigger { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); background: #fff; }

    .cd-chevron {
      flex-shrink: 0; width: 15px; height: 15px; color: var(--text-muted);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .cd-wrap.open .cd-chevron { transform: rotate(180deg); }

    .cd-list {
      position: absolute; top: calc(100% + 5px); left: 0; right: 0;
      background: #fff; border: 1px solid var(--border-heavy); border-radius: 10px;
      box-shadow: 0 8px 30px -4px rgba(15,23,42,0.12), 0 2px 8px -2px rgba(15,23,42,0.08);
      z-index: 999; overflow: hidden; padding: 4px;
      transform-origin: top center;
      transform: scaleY(0.92) translateY(-4px); opacity: 0; pointer-events: none;
      transition: transform 0.18s cubic-bezier(0.4,0,0.2,1), opacity 0.18s cubic-bezier(0.4,0,0.2,1);
    }
    .cd-wrap.open .cd-list { transform: scaleY(1) translateY(0); opacity: 1; pointer-events: auto; }

    .cd-option {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 6px; cursor: pointer;
      font-size: 14px; color: var(--text-main); transition: background 0.1s;
    }
    .cd-option:hover { background: #eff6ff; }
    .cd-option.selected { font-weight: 600; color: var(--accent); background: #eff6ff; }
    .cd-check { width: 13px; height: 13px; flex-shrink: 0; color: var(--accent); opacity: 0; }
    .cd-option.selected .cd-check { opacity: 1; }

    /* Link block */
    .link-block { margin-top: 5px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.08); padding-inline: 5px; }
    .link-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; margin-bottom: 4px; display: block; }
    .link-output { width: 100%; min-height: 45px; height: 45px; font-family: monospace; font-size: 11px; padding: 8px; border-radius: 6px; border: 1px solid var(--border-heavy); background: #e2e8f0; word-break: break-all; user-select: all; -webkit-user-select: all; cursor: text; line-height: 1.3; display: flex; align-items: center; }

    .btn-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .copy-btn, .open-btn, .help-btn { height: 38px; cursor: pointer; border-radius: 6px; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; border: none; gap: 6px; transition: all 0.2s ease; }
    .copy-btn { flex: 0.8; background: #ffffff; color: var(--text-main); border: 1px solid var(--border-heavy); }
    .help-btn { flex: 0.9; background: #ffffff; color: var(--text-main); border: 1px solid var(--border-heavy); }
    .open-btn { flex: 1.25; background: var(--accent); color: white; }
    .copy-btn:hover, .help-btn:hover { background-color: #cbd5e1; border-color: #94a3b8; }
    .open-btn:hover { background: #1d4ed8; }

    .yt-icon { height: 16px; width: auto; }
    .copy-status { font-size: 13px; color: #059669; margin-top: 0px; min-height: 0px; font-weight: 700; text-align: center; }

    /* Mòbil */
    .mobile-nav { display: none; margin-bottom: 20px; padding: 5px; background: #e2e8f0; border-radius: 12px; width: 100%; max-width: var(--panel-w); }
    .mobile-nav input { display: none; }
    .mobile-nav label { flex: 1; text-align: center; padding: 10px 0; font-weight: 700; cursor: pointer; border-radius: 8px; color: var(--text-muted); }
    .mobile-nav label:hover { background-color: #cbd5e1; }
    .mobile-nav input:checked + label { background: #ffffff; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    @media (max-width: 1050px) {
      body { justify-content: flex-start; padding-top: 30px; }
      .main-wrapper { flex-direction: column; align-items: center; }
      .mobile-nav { display: flex; }
      .quiz-panel { display: none; }
      .quiz-panel.active { display: block; animation: fade-in 0.3s ease-out forwards; animation-delay: 0s !important; }
    }

    .select-atencio-shake { animation: select-shake-wave 1.2s ease-in-out; }
    @keyframes select-shake-wave {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); background-color: #fef08a; }
      20%, 40%, 60%, 80% { transform: translateX(4px); background-color: #ffedd5; }
    }

    .help-btn { display: none; }
  </style>
</head>
<body>

  <div class="title-container">
    <h1 class="title-row-1">
      <span class="text-step">Step</span>
      <img src="icon.png" alt="Icona" class="inline-icon">
      <span class="text-step">Quiz</span>
    </h1>
    <div class="title-row-2">Matemàtiques</div>
  </div>

  <div id="mobile-nav-container" class="mobile-nav">
    <input type="radio" id="nav-eso" name="mobile-nav" value="panel-eso" checked>
    <label for="nav-eso">ESO</label>
    <input type="radio" id="nav-batx" name="mobile-nav" value="panel-batx">
    <label for="nav-batx">Batxillerat</label>
  </div>

  <div class="main-wrapper">
    <div id="panel-eso" class="quiz-panel active">
      <h2>ESO</h2>
      <div class="row">
        <label>Activitat</label>
        <div class="cd-wrap" id="cd-eso">
          <div class="cd-trigger"><span class="cd-label"></span><svg class="cd-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 8 10 13 15 8"/></svg></div>
          <div class="cd-list"></div>
        </div>
      </div>
      <div class="row" id="row-diff-eso" style="display:none"><label for="d-eso">Dificultat</label><select id="d-eso"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div>
      <div class="row"><label for="s-eso">Sessions</label><select id="s-eso"><option selected>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
      <div class="row"><label for="o-eso">Preguntes</label><select id="o-eso"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
      <div class="row"><label for="i-eso">Errors màx.</label><select id="i-eso"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
      <div class="row"><label for="m-eso">Criteri</label><select id="m-eso"><option value="1">Nota màxima</option><option value="0">Nota mitjana</option></select></div>
      <div class="link-block">
        <div class="btn-row">
          <button id="c-eso" class="copy-btn">Copia</button>
          <button id="h-eso" class="help-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YT" class="yt-icon">Ajuda</button>
          <button id="p-eso" class="open-btn">Obre</button>
        </div>
        <div id="st-eso" class="copy-status"></div>
        <div class="link-label">Enllaç:</div>
        <div id="l-eso" class="link-output" tabindex="0"></div>
      </div>
    </div>

    <div id="panel-batx" class="quiz-panel">
      <h2>Batxillerat</h2>
      <div class="row">
        <label>Activitat</label>
        <div class="cd-wrap" id="cd-batx">
          <div class="cd-trigger"><span class="cd-label"></span><svg class="cd-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 8 10 13 15 8"/></svg></div>
          <div class="cd-list"></div>
        </div>
      </div>
      <div class="link-block">
        <div class="btn-row">
          <button id="c-batx" class="copy-btn">Copia</button>
          <button id="h-batx" class="help-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YT" class="yt-icon">Ajuda</button>
          <button id="p-batx" class="open-btn">Obre</button>
        </div>
        <div id="st-batx" class="copy-status"></div>
        <div class="link-label">Enllaç:</div>
        <div id="l-batx" class="link-output" tabindex="0"></div>
      </div>
    </div>
  </div>

  <script>
    // ── Custom dropdown factory ──
    function makeCustomDropdown(wrapId, activities, defaultFile, onChangeCallback) {
      const wrap    = document.getElementById(wrapId);
      const trigger = wrap.querySelector('.cd-trigger');
      const list    = wrap.querySelector('.cd-list');
      const label   = wrap.querySelector('.cd-label');
      let currentFile = defaultFile;

      function getValue() { return currentFile; }

      function render() {
        list.innerHTML = '';
        activities.forEach(a => {
          const div = document.createElement('div');
          div.className = 'cd-option' + (a.file === currentFile ? ' selected' : '');
          div.innerHTML = `
            <svg class="cd-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 8 7 12 13 4"/>
            </svg>
            <span>${a.label}</span>`;
          div.addEventListener('click', () => {
            currentFile = a.file;
            label.textContent = a.label;
            render();
            wrap.classList.remove('open');
            onChangeCallback();
          });
          list.appendChild(div);
        });
      }

      const def = activities.find(a => a.file === defaultFile) || activities[0];
      label.textContent = def.label;
      render();

      trigger.addEventListener('click', e => { e.stopPropagation(); wrap.classList.toggle('open'); });
      list.addEventListener('click', e => e.stopPropagation());

      return { getValue };
    }

    // ── Panel init ──
    function initPanel(suffix, activities, defaultFile) {
      const els = {
        d:      document.getElementById('d-' + suffix),
        rowD:   document.getElementById('row-diff-' + suffix),
        s:      document.getElementById('s-' + suffix),
        o:      document.getElementById('o-' + suffix),
        i:      document.getElementById('i-' + suffix),
        m:      document.getElementById('m-' + suffix),
        link:   document.getElementById('l-' + suffix),
        copy:   document.getElementById('c-' + suffix),
        open:   document.getElementById('p-' + suffix),
        help:   document.getElementById('h-' + suffix),
        status: document.getElementById('st-' + suffix)
      };

      let timeout1, timeout2;

      function manageDifficultyRow() {
        if (!els.rowD) return;
        const selected = activities.find(a => a.file === dropdown.getValue());
        els.rowD.style.display = (selected && selected.difficulty) ? '' : 'none';
      }

      function build() {
        const file = dropdown.getValue();
        if (suffix === 'batx') {
          els.link.textContent = `${BASE_URL}${file}`;
        } else {
          const selected = activities.find(a => a.file === file);
          const qs = new URLSearchParams({
            totalsessions:    els.s.value,
            totaloperations:  els.o.value,
            maxintents:       els.i.value,
            maxenllocmitjana: els.m.value
          });
          if (selected && selected.difficulty && els.d) {
            qs.append('nivell', els.d.value);
          }
          els.link.textContent = `${BASE_URL}${file}?${qs.toString()}`;
        }
      }

      function manageHelpButton(isInitialLoad = false) {
        const selected = activities.find(a => a.file === dropdown.getValue());
        const hasVideo = selected && selected.yt && selected.yt.trim() !== '';
        clearTimeout(timeout1); clearTimeout(timeout2);
        if (isInitialLoad) {
          els.help.style.display = 'none';
          timeout1 = setTimeout(() => {
            const nowSel = activities.find(a => a.file === dropdown.getValue());
            if (nowSel && nowSel.yt) els.help.style.display = 'flex';
          }, 4500);
        } else {
          timeout1 = setTimeout(() => {
            els.help.style.display = 'none';
            timeout2 = setTimeout(() => { if (hasVideo) els.help.style.display = 'flex'; }, 800);
          }, 200);
        }
      }

      const dropdown = makeCustomDropdown('cd-' + suffix, activities, defaultFile, () => {
        manageDifficultyRow();
        build();
        manageHelpButton(false);
      });

      build();
      manageDifficultyRow();
      manageHelpButton(true);

      [els.d, els.s, els.o, els.i, els.m].filter(Boolean).forEach(el => el.addEventListener('change', build));

      els.copy.addEventListener('click', async () => {
        await navigator.clipboard.writeText(els.link.textContent);
        els.status.textContent = 'Copiat ✅';
        setTimeout(() => els.status.textContent = '', 2000);
      });
      els.open.addEventListener('click', () => window.open(els.link.textContent, '_blank'));
      els.help.addEventListener('click', () => {
        const selected = activities.find(a => a.file === dropdown.getValue());
        if (selected && selected.yt) window.open(selected.yt, '_blank');
      });
    }

    initPanel('eso',  ACTIVITIES_ESO,  DEFAULT_ESO);
    initPanel('batx', ACTIVITIES_BATX, DEFAULT_BATX);

    // Tanca dropdowns en clicar fora
    document.addEventListener('click', () => {
      document.querySelectorAll('.cd-wrap').forEach(w => w.classList.remove('open'));
    });

    // Navegació mòbil
    document.querySelectorAll('input[name="mobile-nav"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.querySelectorAll('.quiz-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(e.target.value).classList.add('active');
      });
    });

    // Shake d'atenció inicial
    window.addEventListener('load', () => {
      setTimeout(() => {
        const triggers = document.querySelectorAll('.cd-trigger');
        triggers.forEach(t => t.classList.add('select-atencio-shake'));
        setTimeout(() => triggers.forEach(t => t.classList.remove('select-atencio-shake')), 1250);
      }, 2220);
    });
  </script>

  <footer style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: #f8f9fa; border-top: 1px solid #ccc; padding: 10px; z-index: 9999; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; box-sizing: border-box; text-align: center;">

      <img alt="Llicència CC BY-NC-ND" style="border-width:0; height: 31px;" src="https://licensebuttons.net/l/by-nc-nd/4.0/88x31.png" />

    </span>

  <div style="height: 70px;"></div>

</body>
