# Revisió automàtica: cada cop que es puja alguna cosa a main (o s'obre una
# pull request), GitHub comprova el projecte.
#   ✓ verd  → tot correcte
#   ✗ vermell → alguna cosa s'ha trencat (el detall és a la pestanya "Actions")
#
# Passos:
#   1. Tests (node tests/run-all.js): només cal Node, sense instal·lar res.
#   2. ESLint: busca errors al codi JavaScript (variables no definides,
#      codi que no s'executa mai…). Els avisos no fan fallar la revisió.
#   3. Prettier: comprova el format del codi de js/, css/ i tests/.
#      NOMÉS a les pull requests: si es puja un fitxer a mà a main, un
#      problema de format no ha de fer sortir una creu vermella.
name: Tests

on:
  push:
    branches: [main]      # el que es puja directament a main (p. ex. "Add files via upload")
  pull_request:           # les pull requests, abans de fusionar-les
  workflow_dispatch:      # botó "Run workflow" per executar-ho a mà

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - name: Executa tots els tests
        run: node tests/run-all.js
      - name: Instal·la ESLint i Prettier
        run: npm ci --prefix tools/lint --no-audit --no-fund
      - name: Revisió del codi (ESLint)
        run: tools/lint/node_modules/.bin/eslint -c tools/lint/eslint.config.mjs .
      - name: Format del codi (Prettier)
        if: github.event_name == 'pull_request'
        run: tools/lint/node_modules/.bin/prettier --check .
