<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asímptotes i Límits Laterals</title>
    <link rel="stylesheet" href="css/asimptotes.css">
</head>
<body>

<div class="title-row">
    <h1>Asímptotes verticals &amp; horitzontals / oblíqüies</h1>
</div>

<div class="panel">

    <!-- PANTALLA DE JOC -->
    <div id="game-screen">

        <div class="game-header">
            <span id="q-display">Pregunta 1 de 6</span>
            <span class="badge" id="level-display">Nivell mitjà</span>
            <span id="score-display">Punts: 0</span>
            <span id="attempts-display">Intents: 3</span>
        </div>

        <div class="game-body">

            <!-- Columna esquerra: pregunta + opcions + feedback -->
            <div class="game-left">
                <div id="question-prompt"></div>
                <div id="options-container" class="options-list"></div>
                <div id="feedback" class="feedback-area" style="opacity:0"></div>
            </div>

            <!-- Columna dreta: gràfic SVG -->
            <div class="game-right">
                <div id="graph-container"></div>
            </div>

        </div>
    </div>

    <!-- PANTALLA DE RESUM -->
    <div id="summary-screen" class="hidden"></div>

</div>

<!-- JS: ordre important -->
<script src="js/asimptotes/function-engine.js"></script>
<script src="js/asimptotes/strings-asimptotes.js"></script>
<script src="js/asimptotes/question-bank-asimptotes.js"></script>
<script src="js/asimptotes/asimptotes.js"></script>

</body>
</html>
