<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Activitat interactiva: equacions amb gots i fitxes — Step Quiz">
    <link rel="icon" href="icon.png">
    <title>Gots i Fitxes — Equacions</title>

    <!-- 1. Configuració per defecte específica d'aquest joc -->
    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    5,
            defaultIntents:       3,   /* 3 intents per pregunta (compartits entre passos) */
            defaultEnllocMitjana: 1
        };
    </script>

    <!-- 3. Estils compartits -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">

    <style>
        /* ---- Paleta de color: càlida (ambre/terracota), pròpia del material manipulatiu ---- */
        :root {
            --bg-color:      #fefce8;   /* groc càlid */
            --primary:       #b45309;   /* amber-700 */
            --primary-light: #fef3c7;
            --primary-hover: #92400e;
            --primary-dark:  #451a03;
            --accent:        #d97706;   /* taronja accent per parèntesis nivell 4 */
        }

        /* ---- Overrides específics de la capçalera ---- */
        h1 { color: var(--primary-dark); }
        .header-info { background-color: #fff7ed; }
        .level-text  { color: var(--primary-dark); }
        .score-text  { color: var(--primary); }

        /* ---- ZONA ESCENA (SVG dels gots i fitxes) ---- */
        #scene-svg-container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 18px 10px 6px;
            overflow-x: auto;
        }
        #scene-svg-container svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Estils dels elements SVG */
        .cup-body {
            fill: var(--primary);
            stroke: var(--primary-dark);
            stroke-width: 2;
        }
        .cup-rim {
            fill: var(--primary-dark);
        }
        .chip-circle {
            fill: #dc2626;
            stroke: #7f1d1d;
            stroke-width: 1.5;
        }
        .chip-inside {
            fill: #dc2626;
            stroke: #7f1d1d;
            stroke-width: 1;
            opacity: 0;
        }
        .table-line {
            stroke: #78350f;
            stroke-width: 2;
            stroke-linecap: round;
        }
        .plate-ellipse {
            fill: #fff7ed;
            stroke: var(--accent);
            stroke-width: 2.5;
            filter: drop-shadow(0 2px 3px rgba(120, 53, 15, 0.18));
        }

        /* Transicions */
        .cup-group, .chip-group, .plate-group {
            transition: transform 0.5s ease, opacity 0.5s ease;
        }
        .chip-removed { opacity: 0 !important; }
        .cup-lifted   { transform: translateY(-26px); }
        .chip-inside.chip-revealed {
            opacity: 1;
            animation: chipFadeIn 0.4s ease both;
        }
        .plate-fading { opacity: 0 !important; transition: opacity 0.6s ease; }

        @keyframes chipFadeIn {
            from { opacity: 0; transform: scale(0.4); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ---- EQUACIÓ EN TEXT ---- */
        #equation-prev {
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.36em;    /* ~80% de #equation-display */
            font-weight: bold;
            color: #94a3b8;       /* gris suau */
            padding: 6px 14px 0;
            min-height: 1.3em;
            transition: opacity 0.25s;
            letter-spacing: 1px;
            word-break: break-word;
        }
        #equation-prev:empty { display: none; }
        #equation-prev.eq-updating { opacity: 0; }
        /* La 'x' dins el parèntesi gris també hereta el color (gris). */
        #equation-prev .eq-bracket,
        #equation-prev .eq-var,
        #equation-prev .eq-sign { color: inherit; }

        #equation-display {
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.7em;
            font-weight: bold;
            color: var(--text-main);
            padding: 6px 14px 4px;
            min-height: 1.6em;
            transition: opacity 0.25s, transform 0.25s;
            letter-spacing: 1px;
            word-break: break-word;
        }
        #equation-display.eq-updating { opacity: 0; transform: translateY(-6px); }
        #equation-display .eq-var      { color: var(--primary-dark); }
        #equation-display .eq-sign     { color: var(--primary); padding: 0 6px; }
        #equation-display .eq-bracket  { color: var(--accent); }
        /* Dins del parèntesis, la 'x' també ha de ser taronja (hereta el color del parent). */
        #equation-display .eq-bracket .eq-var { color: inherit; }
        #equation-display.eq-solved    { color: var(--success); }
        #equation-display.eq-solved .eq-sign { color: var(--success); }

        /* ---- INSTRUCCIÓ DEL PAS ---- */
        #step-instruction {
            text-align: center;
            font-size: 1.05em;
            font-weight: 600;
            color: #334155;
            padding: 6px 18px 12px;
            min-height: 2.6em;
            line-height: 1.35;
        }

        /* ---- LLEGENDA DE L'ESCENA ("En total hi ha N fitxes" etc.) ---- */
        #scene-caption {
            text-align: center;
            font-size: 1.05em;
            font-weight: 600;
            color: var(--primary-dark);
            padding: 4px 18px 2px;
            min-height: 1.4em;
            transition: opacity 0.25s;
            line-height: 1.3;
        }
        #scene-caption.eq-updating { opacity: 0; }

        /* ---- ZONA DE RESPOSTA ---- */
        #answer-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 20px 12px;
            flex-wrap: wrap;
        }
        #answer-input {
            width: 86px;
            height: 50px;
            font-size: 1.6em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
            border: 3px solid var(--primary);
            border-radius: 8px;
            outline: none;
            color: var(--primary-dark);
            background: #fff;
            transition: border-color 0.2s, transform 0.15s;
        }
        #answer-input:focus { border-color: var(--primary-dark); }
        #answer-input.shake { animation: inputShake 0.3s; }
        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }
        #btn-check, #btn-continue, #btn-next {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            min-height: 48px;
        }
        @media (hover: hover) {
            #btn-check:hover, #btn-continue:hover, #btn-next:hover { background: var(--primary-hover); }
        }
        #btn-check:active, #btn-continue:active, #btn-next:active { transform: scale(0.96); }

        /* ---- FEEDBACK ---- */
        #feedback-area {
            min-height: 1.6em;
            text-align: center;
            font-weight: 600;
            font-size: 0.98em;
            padding: 0 20px 14px;
            color: var(--danger);
            line-height: 1.3;
        }
        #feedback-area.success { color: var(--success); font-size: 1.4em; }

        /* ---- RESPONSIU ---- */
        @media (max-width: 540px) {
            #equation-display { font-size: 1.35em; }
            #equation-prev    { font-size: 1.08em; }
            #step-instruction { font-size: 0.98em; }
            #answer-input { width: 76px; height: 46px; font-size: 1.4em; }
            .level-btn { min-width: 38px; height: 34px; padding: 0 10px; font-size: 0.95em; }
        }
        @media (max-width: 380px) {
            #equation-display { font-size: 1.15em; letter-spacing: 0.5px; }
            #equation-prev    { font-size: 0.92em; letter-spacing: 0.5px; }
            #scene-svg-container { padding: 10px 4px 4px; }
            .level-switcher { gap: 6px; padding: 10px 8px 2px; }
        }

        /* ---- SELECTOR DE NIVELL ---- */
        .level-switcher {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px 6px;
            flex-wrap: wrap;
        }
        .level-switcher-label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.95em;
            margin-right: 4px;
        }
        .level-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            height: 38px;
            padding: 0 14px;
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 20px;
            font-weight: 700;
            font-size: 1em;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, transform 0.1s;
            font-family: inherit;
        }
        @media (hover: hover) {
            .level-btn:hover { background: var(--primary-light); }
        }
        .level-btn:active { transform: scale(0.95); }
        .level-btn.active {
            background: var(--primary);
            color: #fff;
            cursor: default;
        }
        .level-btn.active:hover { background: var(--primary); }
    </style>
    <link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<!-- Capçalera amb icona home -->
<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Gots i Fitxes</h1>
</div>
<div class="subtitle">Equacions amb material manipulatiu</div>

<div class="panel" id="main-panel">

    <!-- Selector de nivell (4 botons; el del nivell actiu queda destacat) -->
    <nav class="level-switcher" id="level-switcher" aria-label="Selector de nivell">
        <span class="level-switcher-label">Nivell:</span>
        <a class="level-btn" data-level="1" href="?nivell=1">1</a>
        <a class="level-btn" data-level="2" href="?nivell=2">2</a>
        <a class="level-btn" data-level="3" href="?nivell=3">3</a>
        <a class="level-btn" data-level="4" href="?nivell=4">4</a>
    </nav>

    <div id="game-screen" style="display:none;">
        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display">Sessió 1 de 1</div>
                <div class="level-text"   id="lvl-display">Pregunta 1 de 5</div>
            </div>
            <div class="score-text"      id="score-display">Punts: 0</div>
            <div class="attempts-counter" id="attempts-display">Intents: 3</div>
        </div>

        <div id="scene-svg-container" aria-label="Escena amb gots i fitxes" role="img"></div>

        <div id="scene-caption" aria-live="polite"></div>

        <div id="equation-prev" aria-hidden="true"></div>
        <div id="equation-display"></div>

        <div id="step-instruction"></div>

        <div id="answer-area">
            <input type="text" id="answer-input"
                   inputmode="numeric" autocomplete="off"
                   aria-label="Resposta numèrica" maxlength="3">
            <button id="btn-check" type="button" onclick="checkCurrentCell()">Respon</button>
            <button id="btn-continue" type="button" style="display:none;" onclick="continueObservation()">Continua →</button>
            <button id="btn-next" type="button" style="display:none;" onclick="continueToNext()">Equació següent →</button>
        </div>

        <div id="feedback-area" aria-live="polite"></div>
    </div>

</div>

<!-- 4. game-core DESPRÉS del DOM -->

<script type="module" src="js/gots-fitxes/gots-fitxes.js"></script>
</body>
</html>
