<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Activitat interactiva de vocabulari matemàtic — Step Quiz">
    <link rel="icon" href="icon.png">
    <title>Vocabulari Matemàtic</title>

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    4,
            defaultIntents:       4,
            defaultEnllocMitjana: 1
        };
    </script>
    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/shared.css">

    <style>
        :root {
            --bg-color:      #fafaf7;
            --primary:       #7c3aed;
            --primary-light: #ede9fe;
            --primary-hover: #6d28d9;
            --primary-dark:  #4c1d95;
            --success:       #10b981;
            --danger:        #ef4444;
        }

        h1 { color: #3b0764; }
        .header-info { background-color: #f5f3ff; }
        .level-text  { color: #3b0764; }
        .score-text  { color: var(--primary); }
        .panel { border-top-color: var(--primary); }

        /* ---- ZONA PRINCIPAL DEL JOC ---- */
        #game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 16px;
        }

        /* ---- SVG FIGURA ---- */
        #figure-container {
            width: 100%;
            max-width: 520px;
            position: relative;
        }

        #figure-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ---- ZONES DE CAIGUDA (drop targets) al SVG ---- */
        .drop-zone {
            cursor: pointer;
            transition: all 0.2s;
        }
        .drop-zone rect.dz-bg {
            fill: white;
            stroke: var(--primary);
            stroke-width: 1.5;
            stroke-dasharray: 5 3;
            rx: 5;
            opacity: 0.85;
        }
        .drop-zone.dz-over rect.dz-bg {
            fill: var(--primary-light);
            stroke-width: 2.5;
            stroke-dasharray: none;
        }
        .drop-zone.dz-correct rect.dz-bg {
            fill: #d1fae5;
            stroke: var(--success);
            stroke-dasharray: none;
        }
        .drop-zone.dz-wrong rect.dz-bg {
            fill: #fee2e2;
            stroke: var(--danger);
            stroke-dasharray: none;
        }
        .drop-zone text.dz-label {
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            fill: #334155;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            font-weight: 600;
        }
        .drop-zone.dz-correct text.dz-label { fill: #065f46; }
        .drop-zone.dz-wrong  text.dz-label  { fill: #991b1b; }

        /* ---- POOL DE PARAULES (modalitat A) ---- */
        #word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 48px;
            padding: 10px;
            border: 2px dashed var(--border-heavy);
            border-radius: 10px;
            width: 100%;
            max-width: 520px;
            background: white;
        }

        .word-chip {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.95em;
            font-weight: 700;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
        }
        .word-chip:active  { cursor: grabbing; }
        .word-chip.dragging {
            opacity: 0.4;
        }
        .word-chip.used {
            opacity: 0.25;
            pointer-events: none;
        }

        /* Chip fantasma que segueix el cursor */
        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.95em;
            font-weight: 700;
            font-family: 'Segoe UI', sans-serif;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
            display: none;
            white-space: nowrap;
        }

        /* ---- ZONA D'ESCRIPTURA (modalitat B) ---- */
        #write-panel {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .write-prompt {
            font-size: 1.1em;
            font-weight: 700;
            color: #3b0764;
            text-align: center;
        }

        .write-progress {
            font-size: 0.9em;
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
        }

        .write-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        #write-input {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px 14px;
            border: 2px solid var(--border-heavy);
            border-radius: 6px;
            outline: none;
            width: 220px;
            text-align: center;
            transition: border-color 0.2s;
        }
        #write-input:focus { border-color: var(--primary); }

        /* Feedback d'ortografia */
        .typo-warning {
            display: none;
            background: #fefce8;
            border: 1.5px solid #fbbf24;
            color: #92400e;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.9em;
            font-weight: 600;
            text-align: center;
            animation: fadeIn 0.3s;
            max-width: 400px;
        }
        .typo-warning.visible { display: block; }

        /* ---- INSTRUCCIÓ CONTEXTUAL ---- */
        #context-instruction {
            font-size: 0.95em;
            color: #475569;
            text-align: center;
            font-weight: 600;
            min-height: 20px;
        }
        #context-instruction.error { color: var(--danger); }

        /* ---- RESPONSIU ---- */
        @media (max-width: 480px) {
            #game-area    { padding: 12px 10px; gap: 12px; }
            .word-chip    { font-size: 0.85em; padding: 5px 12px; }
            #write-input  { width: 170px; font-size: 1.1em; }
            .write-prompt { font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon.png" alt="Inici">
    </a>
    <h1>Vocabulari Matemàtic</h1>
</div>
<div class="subtitle">Identifica les parts de cada figura</div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">
        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display">Sessió 1 de 1</div>
                <div class="level-text"   id="lvl-display">Figura 1 de 4</div>
            </div>
            <div class="score-text"     id="score-display">Punts: 0</div>
            <div class="attempts-counter" id="attempts-display">Intents: 4</div>
        </div>

        <div id="game-area">
            <div id="context-instruction"></div>

            <!-- SVG de la figura -->
            <div id="figure-container">
                <svg id="figure-svg" viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>

            <!-- Pool de paraules (mode A) -->
            <div id="word-pool" style="display:none;"></div>

            <div id="write-panel" style="display:none;">
                <div class="write-prompt" id="write-prompt">Escriu la paraula que indica la fletxa</div>

                <div class="write-input-row">
                    <input type="text" id="write-input" autocomplete="off" spellcheck="false" aria-label="Escriu la paraula">

    </div>
</div>

<!-- Ghost per drag -->
<div id="drag-ghost"></div>

<script src="js/game-core.js"></script>

// ============================================================
// FUZZY MATCHING per detectar errors tipogràfics
// ============================================================
function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, (_, i) => [i]);
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++)
        for (let j = 1; j <= n; j++)
            dp[i][j] = a[i-1] === b[j-1]
                ? dp[i-1][j-1]
                : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[m][n];
}

function normalitza(s) {
    // Elimina accents i passa a minúscules per comparar
    return s.toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[·\-\s]+/g, '');
}

/**
 * Retorna:
 *  'correct'  — la resposta és exactament la paraula (normalitzada)
 *  'typo'     — la distància és 1 o 2 (possible errada tipogràfica)
 *  'wrong'    — massa diferent
 */
function avaluaResposta(input, target) {
    const ni = normalitza(input);
    const nt = normalitza(target);
    if (ni === nt) return 'correct';
    const dist = levenshtein(ni, nt);
    const threshold = nt.length <= 5 ? 1 : 2;
    return dist <= threshold ? 'typo' : 'wrong';
}

// ============================================================
// GENERACIÓ DE L'ORDRE ALEATORI DE FIGURES
// ============================================================
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ============================================================
// BUILD LEVEL — cridat per game-core
// ============================================================
function buildLevel() {
    attemptsLeft    = MAX_INTENTS;
    isTransitioning = false;
    isPenalizing    = false;
    etiquetesOK     = 0;
    writeIndex      = 0;

    // Tria la figura de la llista ordenada
    figuraActual = figuresOrden[currentOperation % figuresOrden.length];
    etiquetesTotal = figuraActual.etiquetes.length;

    // Fons rotatiu
    const colorIndex = (currentSession * TOTAL_OPERATIONS + currentOperation) % bgColors.length;
    els.body.style.backgroundColor = bgColors[colorIndex];

    // Amaga warning tipografia
    els.typoWarning.classList.remove('visible');
    els.contextInstr.innerText = '';
    els.contextInstr.classList.remove('error');

    updateHeader();
    renderFigura();

    if (MODALITAT === 'A') {
        setupModeA();
    } else {
        setupModeB();
    }
}

// ============================================================
// RENDER SVG + ZONES DE CAIGUDA
// ============================================================
function renderFigura() {
    const fig = figuraActual;
    const svgW = 500, svgH = 340;

    // Construir les drop-zones o fletxes depenent del mode
    let dzHTML = '';
    const DZ_W = 100, DZ_H = 26;

    fig.etiquetes.forEach(et => {
        const x  = et.lx - DZ_W / 2;
        const y  = et.ly - DZ_H / 2;

        // Línia de fletxa entre el punt de la figura i la caixa de l'etiqueta
        const fx = et.px, fy = et.py;
        const lx2 = et.lx, ly2 = et.ly;

        dzHTML += `
        <line x1="${fx}" y1="${fy}" x2="${lx2}" y2="${ly2}"
              stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"
              pointer-events="none"/>
        <circle cx="${fx}" cy="${fy}" r="3.5" fill="#94a3b8" pointer-events="none"/>
        <g class="drop-zone" id="dz-${et.id}" data-word="${et.text}">
            <rect class="dz-bg" x="${x}" y="${y}" width="${DZ_W}" height="${DZ_H}" rx="5"/>
            <text class="dz-label" x="${et.lx}" y="${et.ly}">?</text>
        </g>`;
    });

    els.figureSvg.innerHTML = fig.svgFn() + dzHTML;

    // Afegir listeners de drag als drop-zones (mode A)
    if (MODALITAT === 'A') {
        els.figureSvg.querySelectorAll('.drop-zone').forEach(dz => {
            dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('dz-over'); });
            dz.addEventListener('dragleave', () => dz.classList.remove('dz-over'));
            dz.addEventListener('drop',      e => { e.preventDefault(); dz.classList.remove('dz-over'); handleDrop(dz, e.dataTransfer.getData('text/plain')); });
        });
        // Touch drag drop-zones
        els.figureSvg.querySelectorAll('.drop-zone').forEach(dz => {
            dz.addEventListener('touchend', e => {
                // es gestiona a nivell de document
            }, { passive: false });
        });
    } else {
        // Mode B: ressaltar l'etiqueta activa
        highlightWriteTarget();
    }
}

// ============================================================
// MODE A — DRAG & DROP
// ============================================================
function setupModeA() {
    els.wordPool.style.display   = 'flex';
    els.writePanel.style.display = 'none';
    els.wordPool.innerHTML       = '';

    // Barrejar les paraules
    const paraules = shuffleArray([...figuraActual.etiquetes]);
    paraules.forEach(et => {
        const chip = document.createElement('div');
        chip.className      = 'word-chip';
        chip.textContent    = et.text;
        chip.draggable      = true;
        chip.dataset.word   = et.text;

        // Desktop drag
        chip.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', et.text);
            chip.classList.add('dragging');
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => chip.classList.remove('dragging'));

        // Touch drag
        chip.addEventListener('touchstart', onTouchStart, { passive: false });

        els.wordPool.appendChild(chip);
    });

    els.contextInstr.innerText = 'Arrossega cada paraula al lloc correcte de la figura';
}

function handleDrop(dzEl, word) {
    if (isTransitioning || isPenalizing) return;
    const expected = dzEl.dataset.word;

    if (word === expected) {
        // Correcte
        dzEl.querySelector('text.dz-label').textContent = word;
        dzEl.classList.add('dz-correct');
        dzEl.style.pointerEvents = 'none';

        // Marca el chip com a usat
        const chip = [...els.wordPool.querySelectorAll('.word-chip')]
                         .find(c => c.dataset.word === word);
        if (chip) chip.classList.add('used');

        recordAnswerToHistory(`Vocabulari: ${word}`, word, true);
        etiquetesOK++;
        if (etiquetesOK >= etiquetesTotal) finishLevel();

    } else {
        // Error: marca la zona en vermell i penalitza
        dzEl.classList.add('dz-wrong');
        setTimeout(() => dzEl.classList.remove('dz-wrong'), 600);
        recordAnswerToHistory(`Vocabulari (${dzEl.dataset.word})`, word, false);
        penalize();
    }
}

// ---- Touch Drag ----
let _touchChip     = null;
let _touchOffX     = 0;
let _touchOffY     = 0;
const ghost        = document.getElementById('drag-ghost');

function onTouchStart(e) {
    if (isTransitioning) return;
    e.preventDefault();
    const touch  = e.touches[0];
    _touchChip   = e.currentTarget;
    ghost.textContent = _touchChip.dataset.word;
    ghost.style.display = 'block';
    _moveGhost(touch.clientX, touch.clientY);

    document.addEventListener('touchmove',  onTouchMove,  { passive: false });
    document.addEventListener('touchend',   onTouchEnd,   { passive: false });
    document.addEventListener('touchcancel',onTouchCancel,{ passive: false });
}

function onTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    _moveGhost(touch.clientX, touch.clientY);
}

function _moveGhost(cx, cy) {
    ghost.style.left = (cx - ghost.offsetWidth / 2) + 'px';
    ghost.style.top  = (cy - 20) + 'px';
}

function onTouchEnd(e) {
    ghost.style.display = 'none';
    document.removeEventListener('touchmove',   onTouchMove);
    document.removeEventListener('touchend',    onTouchEnd);
    document.removeEventListener('touchcancel', onTouchCancel);

    if (!_touchChip) return;
    const touch = e.changedTouches[0];
    // Trobar el drop-zone sota el dit
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const dz = el ? el.closest('.drop-zone') : null;
    if (dz) handleDrop(dz, _touchChip.dataset.word);
    _touchChip = null;
}

function onTouchCancel() {
    ghost.style.display = 'none';
    _touchChip = null;
    document.removeEventListener('touchmove',   onTouchMove);
    document.removeEventListener('touchend',    onTouchEnd);
    document.removeEventListener('touchcancel', onTouchCancel);
}

// ============================================================
// MODE B — ESCRIPTURA LLIURE
// ============================================================
function setupModeB() {
    els.wordPool.style.display   = 'none';
    els.writePanel.style.display = 'flex';
    writeIndex = 0;
    els.typoWarning.classList.remove('visible');
    els.contextInstr.innerText = 'Escriu la paraula que descriu cada element assenyalat';
    showWriteStep();
}

function showWriteStep() {
    if (writeIndex >= etiquetesTotal) { finishLevel(); return; }

    const et = figuraActual.etiquetes[writeIndex];
    els.writeProgress.innerText = `Paraula ${writeIndex + 1} de ${etiquetesTotal}`;
    els.writeInput.value = '';
    els.typoWarning.classList.remove('visible');
    highlightWriteTarget();

    if (isTouchDevice()) {
        showCustomKeyboard(els.writeInput);
    } else {
        els.writeInput.focus();
    }
}

function highlightWriteTarget() {
    // Ressaltar la drop-zone activa en blau
    els.figureSvg.querySelectorAll('.drop-zone').forEach((dz, i) => {
        const et = figuraActual.etiquetes[i];
        if (!et) return;
        if (i === writeIndex && !dz.classList.contains('dz-correct')) {
            dz.querySelector('rect.dz-bg').setAttribute('stroke', 'var(--primary)');
            dz.querySelector('rect.dz-bg').setAttribute('stroke-width', '2.5');
            dz.querySelector('rect.dz-bg').setAttribute('stroke-dasharray', 'none');
            dz.querySelector('rect.dz-bg').style.fill = 'var(--primary-light)';
        }
    });
}

function checkWriteAnswer() {
    if (isTransitioning || isPenalizing) return;
    const raw = els.writeInput.value.trim();
    if (raw === '') return;

    const et       = figuraActual.etiquetes[writeIndex];
    const resultat = avaluaResposta(raw, et.text);

    if (resultat === 'correct') {
        // Encert!
        els.typoWarning.classList.remove('visible');
        recordAnswerToHistory(`Vocabulari: ${et.text}`, raw, true);

        // Actualitza la drop-zone al SVG
        const dz = document.getElementById(`dz-${et.id}`);
        if (dz) {
            dz.querySelector('text.dz-label').textContent = et.text;
            dz.classList.add('dz-correct');
        }

        etiquetesOK++;
        writeIndex++;
        hideCustomKeyboard();

        setTimeout(() => showWriteStep(), 400);

    } else if (resultat === 'typo') {
        // Error tipogràfic — avisa però NO penalitza
        els.typoWarning.classList.add('visible');
        els.writeInput.value = '';
        if (isTouchDevice()) {
            showCustomKeyboard(els.writeInput);
        } else {
            els.writeInput.focus();
        }
        // No cridem penalize() per errors tipogràfics

    } else {
        // Error real
        els.typoWarning.classList.remove('visible');
        recordAnswerToHistory(`Vocabulari: ${et.text}`, raw, false);

        const dz = document.getElementById(`dz-${et.id}`);
        if (dz) {
            dz.classList.add('dz-wrong');
            setTimeout(() => dz.classList.remove('dz-wrong'), 600);
        }
        els.btnSubmitWrite.classList.add('error-shake');
        setTimeout(() => els.btnSubmitWrite.classList.remove('error-shake'), 200);

        penalize();

        if (isTouchDevice()) {
            kbMarkForOverwrite(els.writeInput);
        } else {
            els.writeInput.value = '';
            els.writeInput.focus();
        }
    }
}

// ============================================================
// PENALITZACIÓ
// ============================================================
function penalize() {
    if (isPenalizing || isTransitioning) return;
    isPenalizing = true;

    els.attemptsDisplay.classList.add('danger');
    setTimeout(() => {
        attemptsLeft--;
        updateHeader();
        if (attemptsLeft <= 0) {
            isTransitioning = true;
            hideCustomKeyboard();
            finishLevel(true);
        }
        isPenalizing = false;
    }, 800);
}

// ============================================================
// FI DE NIVELL
// ============================================================
function finishLevel(exhausted = false) {
    isTransitioning = true;
    hideCustomKeyboard();

    const fails       = MAX_INTENTS - attemptsLeft;
    const levelPoints = exhausted ? 0 : Math.max(0, 10 - fails * 2);
    sessionScore += levelPoints;
    els.scoreDisplay.innerText = `Punts: ${sessionScore}`;

    // Mostrar totes les etiquetes si s'han exhaurit intents
    if (exhausted) {
        figuraActual.etiquetes.forEach(et => {
            const dz = document.getElementById(`dz-${et.id}`);
            if (dz && !dz.classList.contains('dz-correct')) {
                dz.querySelector('text.dz-label').textContent = et.text;
                dz.classList.add('dz-wrong');
            }
        });
    }

    const waitTime = showMiniOverlay(levelPoints);
    setTimeout(() => {
        hideMiniOverlay();
        if (currentOperation + 1 >= TOTAL_OPERATIONS) {
            endSession();
        } else {
            currentOperation++;
            buildLevel();
        }
    }, waitTime);
}

// ============================================================
// UI HEADER
// ============================================================
function updateHeader() {
    els.sessionDisplay.innerText  = `Sessió ${currentSession + 1} de ${TOTAL_SESSIONS}`;
    els.lvlDisplay.innerText      = `Figura ${currentOperation + 1} de ${TOTAL_OPERATIONS}`;
    els.scoreDisplay.innerText    = `Punts: ${sessionScore}`;
    els.attemptsDisplay.innerText = `Intents: ${attemptsLeft}`;
    els.attemptsDisplay.className = 'attempts-counter' + (attemptsLeft < 3 ? ' danger' : '');
}

// ============================================================
// TECLAT FÍSIC
// ============================================================
document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && MODALITAT === 'B') {
        if (els.gameScreen.style.display !== 'none' && els.writePanel.style.display !== 'none') {
            e.preventDefault();
            if (!isTransitioning) checkWriteAnswer();
        }
    }
});

function checkCurrentCell() {
    if (MODALITAT === 'B') checkWriteAnswer();
}

// ============================================================
// ARRENCADA
// ============================================================
injectSharedHTML();
validateConfig();

if (MODALITAT === 'B') {
    initCustomKeyboard({ allowNegative: false });
}

// Generar l'ordre de figures (aleatori, amb repetició si cal)
figuresOrden = shuffleArray(FIGURES);
// Si hi ha més operacions que figures, repetim aleatòriament
while (figuresOrden.length < TOTAL_OPERATIONS) {
    figuresOrden = [...figuresOrden, ...shuffleArray(FIGURES)];
}

startGame();
</script>
